readCrumbs\">\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/\">Eduskunta\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset\">Asiat ja äänestykset\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat\">Valtiopäiväasiat\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%20143%2F2025%20vp\">HE 143/2025 vp\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/nav>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">7.1.2026 | 17:18\u003C/span>\n \u003C/div>\n \u003Cdiv class=\"HallituksenEsitys HallituksenEsitys2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;HE&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">143\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2025 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle ammatillisesta koulutuksesta annetun lain muuttamisesta ja siihen liittyviksi laeiksi\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv id=\"SisaltoKuvaus\" class=\"SisaltoKuvaus\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">ESITYKSEN PÄÄASIALLINEN SISÄLTÖ\u003C/h2>\n   \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan muutettaviksi ammatillisesta koulutuksesta annettua lakia, lukiolakia, opetus- ja kulttuuritoimen rahoituksesta annettua lakia, oppivelvollisuuslakia sekä opiskelija- ja tutkijalakia.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Esityksen mukaan ammatillisen koulutuksen järjestäjille avattaisiin mahdollisuus myydä tutkintoon johtavaa tilauskoulutusta siten, että koulutettavina ovat EU:n ja ETA:n kansalaiset. Tilauskoulutusopiskelijoiden oikeuksista ja velvollisuuksista sovittaisiin entistä paremmin tilaajien ja koulutuksen järjestäjien välisillä sopimuksilla. Koulutuksen järjestäjät olisivat velvollisia tiedottamaan opiskelijoille heidän oikeuksistaan ja velvollisuuksistaan.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Kolmansista maista tuleville opiskelijoilla olisi lukuvuosimaksut lukiokoulutuksessa ja ammatillisessa koulutuksessa. Kyseiset opiskelijat eivät voisi olla valtionosuusrahoituksen perusteena jatkossa. Oppivelvollisuuslain soveltamisalaa tarkennettaisiin rajaamalla soveltamisalan ulkopuolelle kolmansista maista tulevat Suomessa opiskelutarkoituksessa oleskelevat henkilöt. Ammatillisesta koulutuksesta annettuun lakiin ja lukiolakiin lisättäisiin säännökset koulutuksen järjestäjien tiedonsaantioikeudesta hakijan ja opiskelijan oleskelulupatietoihin sekä koulutuksen järjestäjien oikeudesta luovuttaa oma-aloitteisesti tietoja Maahanmuuttovirastolle. Opiskelija- ja tutkijalakia muutettaisiin siten, että oleskeluluvan myöntäminen opiskelua varten edellyttäisi koulutuksen järjestäjän määräämien maksujen suorittamista.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Esitys liittyy pääministeri Petteri Orpon hallituksen hallitusohjelman kirjaukseen, jonka mukaan ammatillisen koulutuksen järjestäjille avataan mahdollisuus myydä tutkintoon johtavaa tilauskoulutusta myös niin, että koulutettavina ovat EU- ja ETA-valtioiden kansalaiset vastaavalla tavalla kuin korkeakouluissa.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Esitys liittyy valtion vuoden 2026 talousarvioesitykseen ja on tarkoitettu käsiteltäväksi sen yhteydessä.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Ehdotetut lait on tarkoitettu tulemaan voimaan 1.8.2026. &nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv class=\"PerusteluOsaPerustelut\" id=\"PerusteluOsaPerustelut\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">PERUSTELUT\u003C/h2>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Asian tausta ja valmistelu\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Asian tausta\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Pääministeri Petteri Orpon hallituksen hallitusohjelman mukaan ammatillisen koulutuksen järjestäjille avataan mahdollisuus myydä tutkintoon johtavaa tilauskoulutusta myös niin, että koulutettavina ovat EU- ja ETA-valtioiden kansalaiset vastaavalla tavalla kuin korkeakouluissa. Hallitusohjelman mukaan tilauskoulutuksella vastataan erityisesti osaajapulaan, kun tutkintoon johtavaa koulutusta voidaan myydä markkinoilla. Ammattikorkeakoulu- ja yliopistolain mukaan tilauskoulutuksella tarkoitetaan sitä, että korkeakoulut voivat järjestää opiskelijaryhmälle korkeakoulututkintoon johtavaa opetusta niin, että koulutuksen tilaa ja rahoittaa Suomen valtio, toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö. Vastaava säännös on myös laissa ammatillisessa koulutuksessa, mutta siinä tilauskoulutukseen osallistuminen on rajattu Euroopan talousalueen maiden kansalaisten ja täällä vakituisesti asuvien henkilöiden ulkopuolelle. Korkeakoululakeja muutettiin 1.1.2019 alkaen siten, että EU- ja ETA-kansalaisten opiskelu tilauskoulutuksessa mahdollistettiin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriö asetti 17.12.2024 työryhmän valmistelemaan esityksen ammatillisen koulutuksen tilauskoulutusta koskevien säädösten uudistamiseksi sekä täysikatteisista lukuvuosimaksuista EU- ja ETA-valtioiden ulkopuolelta Suomeen ammatilliseen tai lukiokoulutukseen tuleville opiskelijoille. Työryhmä asetettiin ajalle 1.1.2025 - 31.1.2026.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Työryhmän tehtävänä on valmistella esitykset tilauskoulutuksen laajentamisesta EU- ja ETA-valtioiden kansalaisille, tilauskoulutuksen opiskelijoiden aseman parantamiseksi ammatillisessa koulutuksessa vastaavalla tavalla kuin lukiokoulutukseen ja korkeakoulutukseen on esitetty, täysikatteisista lukuvuosimaksuista EU- ja ETA-valtioiden ulkopuolelta tuleville opiskelijoille lukiokoulutuksessa ja ammatillisessa koulutuksessa, muista tarvittavista toimista kansainvälisen opiskelijarekrytoinnin eettisyyden varmistamiseksi ja opiskelijoiden aseman parantamiseksi. Työryhmän valmistelun tukena ovat ministeriön 10.10.2023 asettamat ammatillisen koulutuksen ja lukiokoulutuksen seurantaryhmät, joiden toimikautta on 17.12.2024 tehdyllä päätöksellä jatkettu 30.6.2026 asti.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Huhtikuussa 2024 pääministeri Orpon hallitus päätti kehysriihessä toimista julkisen talouden menojen vähentämiseksi, joiden tarkoitus oli vähentää kuntien tehtäviä ja velvoitteita tai lisätä kuntien maksutuloja. Kunnat ja kuntayhtymät ovat keskeisiä toisen asteen koulutuksen järjestäjiä. Toisen asteen koulutus rahoitetaan ammatillisen koulutuksen ja lukiokoulutuksen valtionosuusrahoituksilla, joihin sisältyy valtion maksuosuuden lisäksi kuntien maksuosuus. Huhtikuussa 2025 pääministeri Orpon hallitus päätti vuosien 2026–2029 julkisen talouden suunnitelmassa, että ammatillisessa ja lukiokoulutuksessa otetaan käyttöön lukuvuosimaksut EU- ja ETA-valtioiden ulkopuolisille opiskelijoille.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomessa järjestetyssä tilauskoulutuksessa on ajoittain havaittu ongelmia. Esimerkiksi koulutusta tilanneet yritykset ovat perineet opiskelijoilta maksuja, jotka ovat lähtömaiden tulotasoon nähden korkeita, mikä osaltaan on lisännyt opiskelijoiden riskiä altistua hyväksikäytölle tai joutua ihmiskaupan uhreiksi. Koulutuksen tilaaja on saattanut laiminlyödä maksut koulutuksen järjestäjälle. Koulutuksen järjestäjä on saattanut siirtää tilauskoulutukseen saapuneita opiskelijoita valtionosuusrahoitteisen koulutuksen piiriin tai opiskelijat ovat itse hakeutuneet heille maksullisesta tilauskoulutuksesta julkisesti rahoitettuun ja opiskelijoille maksuttomaan koulutukseen. Maahan on myös tullut tilauskoulutuksen varjolla opiskelijoilta, joiden maahantulon motiivina on ollut jokin muu kuin opiskelutarkoitus.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Asian valmistelu\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Osana lukuvuosimaksujen säädösvalmistelua opetus- ja kulttuuriministeriö selvitti toisen asteen koulutuksen järjestäjien nykytilannetta kolmansista maista Suomeen tulevien opiskelijoiden osalta kahdella eri kyselyllä, josta toinen oli suunnattu ammatillisen koulutuksen järjestäjille ja toinen lukiokoulutuksen järjestäjille. Ammatillisen koulutuksen osalta kysymykset kohdentuivat Suomessa järjestettävään koulutukseen ja niihin kolmansista maista Suomeen tuleviin kansalaisiin, jotka ovat hakeutuneet Suomeen ammatilliseen koulutukseen opiskelutarkoituksessa. Tilannetta selvitettiin sekä tilauskoulutuksen että valtionosuusrahoitteisen koulutuksen osalta. Kysymyslomakkeella ammatillisen koulutuksen järjestäjiltä pyydettiin vastauksia myös sellaisesta ammatillisesta koulutuksesta annetun lain mukaisesta tutkintoon tai sen osaan tai osiin tähtäävästä tilauskoulutuksesta, jossa joltakin osin toteuttajana on koulutuksen järjestäjän kokonaan tai osittain omistama liiketaloudellisesti toimiva yhtiö. Lukiokoulutuksen kysymykset kohdentuivat Suomessa järjestettävään lukiokoulutukseen ja niihin kolmansista maista tuleviin kansalaisiin, jotka olivat hakeutuneet Suomeen lukiokoulutukseen opiskelutarkoituksessa. Tilannetta selvitettiin sekä tilauskoulutuksen että valtionosuusrahoitteisen koulutuksen osalta. Ammatillisen koulutuksen kysely oli avoinna aikavälillä 20.2.–7.3.2025, jonka aikana kyselyyn vastasi 55 ammatillisen koulutuksen järjestäjää. Lukiokoulutuksen kysely oli avoinna aikavälillä 4.3.–19.3.2025, jonka aikana kyselyyn vastasi 104 lukiokoulutuksen järjestäjää. Kyselyt toteutettiin raportointi- ja kyselysovellus Webropolin avulla.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriö järjesti ammatillisen koulutuksen järjestäjille ja tutkintovientitoimikunnalle 1.4.2025 keskustelutilaisuuden suunnitelluista muutosesityksistä. Tilaisuudessa esiteltiin suunniteltuja muutoksia ja kuultiin koulutuksen järjestäjien ja tutkintovientitoimikunnan näkemyksiä. Ministeriö järjesti lukiokoulutuksen järjestäjille 7.4.2025 vastaavan keskustelutilaisuuden suunnitelluista muutosesitystä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen esityksen valmistelun lähtökohtia esiteltiin opetus- ja kulttuuriministeriön järjestämissä Ammatillinen koulutus kohti uutta –seminaarissa (29.1.2025) ja Lukiokoulutus kohti 2030-lukua -seminaarissa (30.1.2025) &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen esitykseen valmisteluun liittyviä asioita on käsitelty myös opetus- ja kulttuuriministeriön asettamissa ammatillisen koulutuksen ja lukiokoulutuksen seurantaryhmissä, joissa koulutusmuotojen eri sidosryhmät ovat laajasti edustettuina. Lisäksi valmisteluun liittyviä asioita on esitelty ministeriön toisen asteen koulutuksen järjestäjille järjestämissä ajankohtaiswebinaareissa vuoden 2025 aikana.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen esityksen luonnoksesta on pyydetty lausunnot laaja-alaisesti keskeisiltä sidosryhmiltä ja kaikilta lukiokoulutuksen ja ammatillisen koulutuksen järjestäjiltä. Hallituksen esitys oli lausunnolla 10.6.2025–5.8.2025. Esitysluonnokseen annettiin yhteensä 111 lausuntoa. Lausuntotiivistelmä ja lausunnot ovat luettavissa esityksen hankesivuilla tunnuksella OKM003:00/2025.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen esitys on käsitelty kuntatalouden ja -hallinnon neuvottelukunnassa. Hallituksen esitys valittiin lainsäädännön arviointineuvoston käsittelyyn keväällä 2025. Lainsäädännön arviointineuvosto kuitenkin peruutti esityksen käsittelyn 25.8.2025 sen jälkeen, kun hallituksen esitysluonnos oli toimitettu arviointineuvostolle.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen esityksen valmisteluasiakirjat ovat julkisessa palvelussa osoitteessa https://okm.fi/hanke?tunnus=OKM003:00/2025.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Nykytila ja sen arviointi\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tilauskoulutus ammatillisessa koulutuksessa\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Johdanto\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ammatillisesta koulutuksesta annetun lain (531/2017) tultua voimaan 1.1.2018 mahdollisuus tilauskoulutuksen ja Euroopan talousalueen ulkopuolella järjestettävän tutkintokoulutukseen järjestämiseen tuli kaikille ammatillisen koulutuksen järjestäjille niiden järjestämislupien mukaisesti.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksesta säädetään ammatillisesta koulutuksesta annetun lain 33 §:ssä. Tilauskoulutuksessa ammatillisen koulutuksen järjestäjä voi järjestää opiskelijaryhmälle järjestämisluvassa määrättyjä tutkintoja ja tutkinnon osia sekä niihin valmistavaa tutkintokoulutusta niin, että koulutuksen tilaa ja rahoittaa Suomen valtio, toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö. Voimassa olevan lainsäädännön mukaan tilauskoulutusta ei voida järjestää Euroopan talousalueeseen kuuluvien valtioiden kansalaisille eikä niille, jotka Euroopan unionin ja sen jäsenvaltioiden muun sopimuspuolen kanssa tekemän sopimuksen mukaan rinnastetaan Euroopan unionin kansalaisiin, eikä edellä mainittujen perheenjäsenille. Tilauskoulutusta ei myöskään voida järjestää niille, joilla on kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä korkeaa osaamistasoa vaativaa työtä varten annetun lain (224/2024) nojalla myönnetty EU:n sininen kortti, ulkomaalaislain (301/2004) nojalla myönnetty jatkuva tai pysyvä oleskelulupa tai pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa, eikä edellä mainittujen perheenjäsenille. Perheenjäsenen määrittelyyn sovelletaan ulkomaalaislakia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjä voi järjestää tilauskoulutusta joustavasti ja ottaa huomioon koulutuksen rakenteessa, sisällössä sekä koulutuksen aikataulutuksessa tilaajan erityistarpeet. Tilauskoulutuksen järjestämispaikkaa ei ole rajattu, vaan tilauskoulutusta voidaan järjestää Suomessa tai muualla, esimerkiksi tilaajan kotimaassa. Tilauskoulutusta voidaan järjestää erilaisille ryhmille, mutta tilauskoulutusta ei voida järjestää yksittäiselle opiskelijalle eikä yksityishenkilö voi toimia säännöksessä tarkoitettuna tilauskoulutuksen tilaajana. Tilauskoulutuksen järjestäminen perustuu ammatillisen koulutuksen järjestäjän ja tilaajan väliseen sopimukseen. Tilauskoulutukseen osallistuviin ei sovelleta opiskelijavalintasäännöksiä lukuun ottamatta säännöstä opiskelijaksi ottamisen edellytyksistä sekä säännöksiä opiskelijaksi ottamisen esteistä ja siihen liittyvästä tiedonsaannista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen järjestäminen on koulutuksen järjestäjälle vapaaehtoista, ja tilauskoulutus ja Euroopan talousalueen ulkopuolella järjestettävä koulutusvienti eivät saa heikentää koulutuksen järjestäjän järjestämisluvassa määrättyjen tutkintojen ja koulutuksen järjestämisedellytyksiä. Koulutuksen järjestäjän on perittävä koulutuksen tilaajalta vähintään koulutuksen järjestämisestä aiheutuvat kustannukset kattava maksu. Koulutuksen tilaajalla on oikeus myös periä tilauskoulutukseen osallistuvilta opiskelijoilta tilaajan sijaintivaltion lainsäädännön tai oman käytäntönsä mukaisia maksuja.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriön keväällä 2025 toteuttamaan kyselyyn vastanneista koulutuksen järjestäjistä (n=55) noin neljäsosa ilmoitti järjestäneensä tilauskoulutusta Suomessa (n=13). Tilauskoulutusta järjestäneistä koulutuksen järjestäjistä viidellä tilaajana toimi koulutuksen järjestäjän joko osin tai kokonaan omistama tytäryhtiötyyppinen yhtiö. Tilauskoulutusta järjestävillä koulutuksen järjestäjillä oli vuonna 2023 keskimäärin kolme tilauskoulutusryhmää. Vuonna 2024 tilauskoulutusryhmiä oli keskimäärin viisi. Koulutuksen järjestäjien tilauskoulutusryhmien vuosittainen määrä vaihteli kaikkiaan 0–13 ryhmän välillä. Osalla tilauskoulutusta järjestävistä koulutuksen järjestäjistä ei ollut tilauskoulutusryhmiä molempina tarkasteltavina vuosina. Tilauskoulutukseen osallistui vuonna 2023 keskimäärin 47 opiskelijaa ja vuonna 2024 keskimäärin 89 opiskelijaa. Tilauskoulutukseen osallistuvien opiskelijoiden määrä vaihteli vuonna 2023 22–199 opiskelijan välillä ja vuonna 2024 20–210 opiskelijan välillä. Tilauskoulutuksena järjestetyn koulutuksen suoritti vuonna 2023 keskimäärin noin 26 opiskelijaa ja vuonna 2024 noin 35 opiskelijaa. Opiskelijoiden opinnot kestivät vuonna 2023 keskimäärin noin seitsemän kuukautta ja vuonna 2024 noin 10 kuukautta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutusryhmiä oli vuonna 2024 aiempaa vuotta enemmän ja vastaavasti myös koulutukseen osallistuneiden opiskelijoiden määrä kasvoi. Kuitenkaan koulutuksen loppuun asti suorittaneiden määrä ei vuonna 2024 kasvanut samassa suhteessa opiskelijamäärien kasvun kanssa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ammatillisesta koulutuksesta annetun lain 35 §:n mukaan koulutuksen järjestäjä voi järjestää myös Euroopan talousalueen ulkopuolella järjestämisluvassa määrättyjä tutkintoja ja tutkinnon osia sekä niihin valmistavaa tutkintokoulutusta. Koulutukseen ei voida ottaa opiskelijaksi EU-kansalaisia tai niihin rinnastettavia henkilöitä tai heidän perheenjäseniään. Mainittua koulutusta voidaan järjestää yksittäisille opiskelijoille, mutta sitä voidaan järjestää ainoastaan EU- ja ETA-valtioiden ulkopuolella. Tässä hallituksen esityksessä ei käsitellä tutkintokoulutuksen järjestäminen Euroopan talousalueen ulkopuolella laajemmin, vaan esitetyt muutokset koskevat ammatillisesta koulutuksesta annetun lain 33 §:n mukaista tilauskoulutusta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ammatillisen koulutuksensäädöksissä ‘tutkintovienti‘ käsite liittyy tutkintovientitoimikuntaan. Toimikunnan yhteydessä ’tutkintovienti’ käsitteellä tarkoitetaan tutkintokoulutuksen järjestämistä, joka toteutetaan valtionosuusjärjestelmän ulkopuolella joko koulutusvientityyppisenä tilauskoulutuksena tai Euroopan talousalueen ulkopuolella järjestettävänä tutkintokoulutuksena. Ammatillisen koulutuksen tai lukiokoulutuksen säädökset eivät sisällä ’koulutusviennin’ käsitettä. Koulutusviennille on kuitenkin toimialalla vakiintunut laajahko merkitys. Ulkomaisten tutkinto-opiskelijoiden kouluttamisen lisäksi koulutusviennillä tarkoitetaan koulutukseen ja osaamiseen liittyvää palveluvientiä, esimerkiksi koulutusratkaisujen myyntiä ulkomaille sekä tavaravientiä, kuten fyysisten oppimateriaalien tai -ympäristöjen vientiä.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ammatillisen tilauskoulutuksen laajentaminen EU- ja ETA-valtioiden kansalaisille\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Voimassa olevan lainsäädännön mukaan ammatillisen koulutuksen järjestäjät eivät voi järjestää tilauskoulutusta suomalaisille tai muille Euroopan talousalueeseen kuuluvien valtioiden kansalaisille tai heihin rinnastettaville henkilöille. Jotta Suomen osaajatarpeisiin voitaisiin mahdollisimman tehokkaasti vastata, olisi kuitenkin tarpeellista, että tilauskoulutusta voisi järjestää myös ryhmille, jotka koostuvat EU- ja ETA-valtioiden kansalaisista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vuoden 2023 syksyllä toteutetun yritysbarometrin mukaan 53 prosenttia pienistä ja keskisuurista yrityksistä on osana uusiutumistoimiaan kouluttanut henkilöstöään. Osuudessa ei juurikaan ole toimialoittaisia eroja. Oman henkilöstön osaamisen kehittäminen on selvästi yleisempää kuin uuden henkilöstön rekrytointi, sillä uutta henkilöstöä kertoo rekrytoineensa 37 prosenttia vastaajista. Saman kyselyn mukaan henkilöstön kehittäminen ja koulutus ovat markkinoinnin ja myynnin jälkeen toiseksi merkittävin kehittämiskohde pk-yrityksissä. (Pk-yritysbarometri Suomen Yrittäjät, Finnvera Oyj, Työ- ja elinkeinoministeriö 2023). &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ammatillinen tutkintokoulutus ja ammatilliset tutkinnot vastaavat osaavan työvoiman saatavuuteen etenkin työntekijäammateissa. Tutkintokoulutusta on mahdollista toteuttaa henkilöstökoulutuksena 31.12.2025 asti. Ammatillisesta koulutuksesta annetussa laissa (3 §) tarkoitetulla \u003Cspan class=\"KursiiviTeksti\">henkilöstökoulutuksella \u003C/span> tarkoitetaan \u003Cspan class=\"KursiiviTeksti\"> \u003C/span> tietyn työnantajan henkilöstölleen tarjoamaa koulutusta, jonka työnantaja rahoittaa osin itse ja osin se rahoitetaan julkisella rahoituksella. Mahdollisuus toteuttaa henkilöstökoulutusta poistuu lainsäädännöstä 1.1.2026 alkaen ammatillisesta koulutuksesta annetun lain muuttamisesta annetulla lailla (1078/2024) toteutettujen muutosten tullessa voimaan. Henkilöstökoulutuksen merkitys ammatillisen koulutuksen kokonaisuudessa on ollut erittäin vähäinen ja siihen on vuosittain kohdistunut noin puoli promillea valtion talousarvioon sisältyvästä ammatillisen koulutuksen määrärahasta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yritysten ja kansallisen kilpailukyvyn sekä julkisyhteisöjen työvoiman saatavuuden näkökulmista yhteisöjen mahdollisuuksia hankkia henkilöstölleen ammatillista koulutusta on tarpeellista vahvistaa. Yhteisöjen henkilöstön osaamistarpeet voivat olla huomattavia ja usein osaamiskapeikot muodostuvat kasvun ja uudistumisen esteiksi. Julkisesti rahoitetussa koulutuksessa yksittäisen yrityksen tai julkisyhteisön tarpeita ei ole mahdollista ottaa huomioon. Julkisesti rahoitettujen koulutusten on oltava avoimia kaikille, ja mahdollisuudet räätälöidä koulutusta yhteisöjen tarpeisiin ovat rajalliset. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kuntien asema koulutuksen järjestäjinä\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ammatillisesta koulutuksesta annettua lakia valmisteltaessa tilauskoulutus tulkittiin toiminnaksi kilpailutilanteessa markkinoilla ja kuntalain (410/2015) nojalla katsottiin, että tilauskoulutuksen järjestäminen edellyttää toiminnan yhtiöittämistä. Kuntalain 126 §:n mukaan kunnan hoitaessa 7 §:ssä tarkoitettua tehtävää kilpailutilanteessa markkinoilla sen on annettava tehtävä osakeyhtiön, osuuskunnan, yhdistyksen tai säätiön hoidettavaksi ( \u003Cspan class=\"KursiiviTeksti\">yhtiöittämisvelvollisuus\u003C/span> ). Hallituksen esityksessä eduskunnalle laiksi ammatillisesta koulutuksesta ja eräiksi siihen liittyviksi laeiksi (HE 39/2017 vp) todettiin (s. 211), että koulutuksen tilaajana voisi toimia esimerkiksi yhden tai useamman koulutuksen järjestäjän perustama yritys, joka vastaisi koulutuspalveluiden myynnistä ETA-valtioiden ulkopuolella toimiville asiakkaille. Yritys kantaisi näin ollen taloudellisen vastuun koulutusviennistä. Ammatillisesta koulutuksesta annettua lakia valmisteltaessa vuosina 2015–2017 kunnan toimintaa kilpailutilanteessa markkinoilla koskevat kuntalain säännökset olivat uusia niiden tultua voimaan 1.9.2013. Ammatillisesta koulutuksesta annettua lakia valmisteltaessa ajankohtaista tulkintakäytäntöä kuntalain uusien säännösten soveltamisesta ei juurikaan ollut ja varovaisuusperiaatetta noudattaen katsottiin, että tilauskoulutuksessa olisi varminta soveltaa kuntalain yhtiöittämistä koskevia säännöksiä. Sittemmin kuntalain kuntien toimintaa kilpailutilanteessa markkinoilla koskevien säännösten tulkinta ja sen pohjalta annettu lainsäädäntö on täsmentynyt. Myös ammatillisesta koulutuksesta annetun lain voimaantulon hetkellä voimassa ollut tulkinta on vanhentunut, miksi lakia olisi tältä osin tarpeellista muuttaa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">​Osa ammatillisen koulutuksen järjestämisluvan omaavista kunnista ja kuntayhtymistä on toteuttanut tilauskoulutusta joko olemassa olleen tai tilauskoulutusta varten perustetun tytär- tai osakkuusyhtiön kautta. Yritys on myynyt koulutuspalvelua EU-alueen ulkopuolelle, ja sen nimissä on solmittu kaupalliset sopimukset. Ammatillisesta koulutuksesta annetun lain tavoitteiden vastaisesti koulutuksen järjestäjän vastuulle kuuluvaa koulutuksen organisointia on näin ollen siirtynyt vientiyritykselle. Koska vientiyrityksillä ei ole opetus- ja kulttuuriministeriön myöntämiä ammatillisen koulutuksen järjestämislupia, ovat ne toimineet myös lain tarkoittamana tilauskoulutuksen tilaajana koulutuksen järjestäjän suuntaan. Tässä roolissa yritykset ovat voineet muun muassa koota opiskelijaryhmiä ja periä opiskelumaksuja suoraan opiskelijoilta, mitä laki ei mahdollista tilauskoulutusta järjestävälle koulutuksen järjestäjille. Koulutusvientiyrityksille on syntynyt kaksoisrooli, jossa ne osittain toimivat koulutuksen järjestäjän nimissä koulutuksen toteuttajana ja samalla tilauskoulutuksen tilaajana. Opiskelijoiden on ollut vaikea hahmottaa, mikä suhde koulutuksen järjestäjällä ja koulutuksen tilanneella yrityksellä on. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen järjestäminen kuntien ja kuntayhtymien tytär- ja osakkuusyhtiöiden kautta on myös johtanut tilanteeseen, jossa tilauskoulutuksen järjestämisestä syntyvät voitot jaetaan yhtiöiden osakkaille. Osakkaina voivat olla myös muut toimijat kuin ammatillisen koulutuksen järjestäjät. Ammatillisesta koulutuksesta annetun lain 28 §:n mukaan tutkintoja tai koulutusta ei saa järjestää taloudellisen voiton tavoittelemiseksi. Vaikka tilauskoulutus on voittoa tavoittelevaa toimintaa, voimassa olevassa laissa oleva säännös koskee myös tilauskoulutuksen järjestämistä. Tilauskoulutuksen osalta tilanne on näin ollen ristiriitainen. Hallituksen esityksessä (HE 39/2017 s. 89) säännöstä on täsmennetty siten, että voittoa tavoittelemattomuuden vaatimuksen ei ole tulkittu tarkoittavan sitä, että koulutuksen järjestäjälle ei voisi syntyä toiminnasta ylijäämää. Ylijäämä on kuitenkin käytettävä ammatillisen koulutuksen järjestämiseen, kehittämiseen ja siihen liittyviin investointeihin. Ylijäämä ei saa tuottaa taloudellista etua osakeyhtiön osakkeenomistajalle tai muulle toimintaan osallistuvalle tai sitä ylläpitävälle. Lukiolain ja ammattikorkeakoululain mukaan tilauskoulutuksen tuotot on käytettävä koulutuksen järjestäjän koulutustoimintaan. Sääntelyä olisi tältä osin välttämätöntä täsmentää. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tilaajien väärinkäytökset ja ilmenneet ongelmatilanteet\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjien ja eräiden tilauskoulutuksen tilaajien välillä on havaittu ongelmia, jotka ovat aiheuttaneet kohtuuttomia tilanteita tilauskoulutukseen osallistuville opiskelijoille. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen tilaajien toiminnassa on havaittu väärinkäytöksiä, jotka ovat kohdistuneet sekä koulutuksen järjestäjiin että tilauskoulutukseen osallistuneisiin opiskelijoihin. Eräissä tapauksissa tilaajat ovat käyttäneet hyväksi luottamusta, toimineet vilpillisesti ja sopimuksia laiminlyöden sekä antaneet virheellistä tietoa tavoitellessaan omaa taloudellista etua. Esimerkiksi opiskelijoiden maksamien rahasummien katoaminen ja maksuvelvoitteiden laiminlyönti koulutuksen järjestäjille ovat asettaneet sekä opiskelijat että koulutuksen järjestäjät kohtuuttomiin tilanteisiin. Epäselvyyksiä on ilmennyt myös esimerkiksi tilanteessa, joissa opiskelija on halunnut saada rahansa takaisin, koska ei ole voinut jatkaa opintojaan terveydellisistä syistä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista tilauskoulutukseen osallistuneet opiskelijat ovat usein maksaneet koulutuksestaan. Tilanne on voinut näyttäytyä heille epäjohdonmukaisena, koska samaan aikaan ulkomailta tulee Suomeen opiskelijoita myös maksuttomaan koulutukseen. Mitä laajemmin Suomen maksuton koulutus tunnetaan, sitä useammin opiskelijat hakeutuvat opiskelemaan suoraan koulutuksen järjestäjän valtionosuudella rahoitettavan koulutuksen opiskelijaksi. Tämä osaltaan vähentää kiinnostusta tilauskoulutukseen. Tilauskoulutuksen opiskelijat ovat myös kasvavissa määrin hakeutuneet kesken tilauskoulutuksen maksuttomaan valtionosuudella rahoitettavaan koulutukseen. Tilanteet ovat aiheuttaneet tilauskoulutussopimusten tulkintaan liittyviä ongelmatilanteita sekä taloudellisia seuraamuksia tilauskoulutusta järjestäville.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tilauskoulutuksen järjestäminen Ahvenanmaalla\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Voimassa oleva lainsäädäntö ei mahdollista ammatillisesta koulutuksesta annetun lain mukaisen tutkintokoulutuksen myymistä Ahvenanmaan maakunnassa. Ahvenanmaan maakunta on itsehallintolain nojalla järjestänyt ammatillisen koulutuksen pääsääntöisesti itse. Ammatillisesta koulutuksesta annetun lain tultua voimaan 1.1.2018 tutkintotoimikuntien toiminta päättyi ja tutkintojen myöntämisoikeus siirtyi kokonaisuudessaan ammatillisen koulutuksen järjestämisluvan saaneille koulutuksen järjestäjille. Ahvenanmaan maakunta ei voi toimia ammatillisesta koulutuksesta annetussa laissa tarkoitettuna koulutuksen järjestäjänä itsehallinnollisen asemansa vuoksi.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ahvenanmaan maakunta on ennen ammatillisesta koulutuksesta annetun lain tultua voimaan hankkinut koulutusta ammatillisen koulutuksen järjestäjiltä niihin tutkintoihin ja aloihin, joita Ahvenanmaan maakunta ei itse järjestä. Nykyisen lainsäädännön puitteissa Ahvenanmaan maakunta ei voi hankkia koulutusta, sillä lain 30 § koulutuksen hankinnasta koskee vain järjestämisluvan saaneita toimijoita. Ammatillisen koulutuksen järjestäjät eivät voi järjestää tilauskoulutusta Ahvenanmaalla.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ahvenanmaalaisten opiskelijoiden on voimassa olevan lainsäädännön puitteissa mahdollista hakeutua Manner-Suomessa toimivan ammatillisen koulutuksen järjestäjän opiskelijaksi. Ahvenanmaalaiset opiskelijat voivat tulla osoittamaan osaamisensa näytössä valtakunnan alueen koulutuksen järjestäjillä. Opiskelijan on myös mahdollista hankkia osaamisensa Manner-Suomen alueen koulutuksen järjestäjällä oppisopimuskoulutuksena tai koulutussopimukseen perustuvana koulutuksena siten, että hän tekee käytännön työtehtäviä työpaikalla Ahvenanmaalla. Tuolloin yritys, jonka kanssa opiskelija solmii oppi- tai koulutussopimuksen, voi olla ahvenanmaalainen yritys tai Ahvenanmaalla toimiva yritys. Koulutuksen järjestäjä ei kuitenkaan voi mennä Ahvenanmaalle ottamaan näyttöä vastaan, ellei kysymyksessä ole näyttö, joka suoritetaan koulutustyöpaikalla Ahvenanmaalla käytännön työtehtävien yhteydessä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen laajentaminen Euroopan talousalueen valtioiden kansalaisille ja heihin rinnastettaville henkilöille mahdollistaisi myös tilauskoulutuksen järjestämisen Ahvenanmaan asukkaille.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tilauskoulutus lukiokoulutuksessa\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Johdanto\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutuksessa tilauskoulutus tuli mahdolliseksi lukiolain (714/2018) tultua voimaan 1.8.2019. Lukiolain 9 §:n mukaan koulutuksen järjestäjä, jolla on lupa järjestää International Baccalaureate -tutkintoon johtavaa koulutusta, saa järjestää Suomeen tuleville opiskelijoille kyseiseen tutkintoon johtavaa opetusta, jos koulutuksen tilaa ja rahoittaa toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutusta ei saa järjestää Euroopan talousalueeseen kuuluvien valtioiden kansalaisille eikä niille, jotka Euroopan unionin ja sen jäsenvaltioiden muun sopimuspuolen kanssa tekemän sopimuksen mukaan rinnastetaan Euroopan unionin jäsenvaltion kansalaisiin, eikä heidän perheenjäsenilleen. Tilauskoulutusta ei myöskään saa järjestää niille, joilla on kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä korkeaa osaamistasoa vaativaa työtä varten annetun lain nojalla myönnetty EU:n sininen kortti, ulkomaalaislain nojalla myönnetty jatkuva tai pysyvä oleskelulupa tai pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa, eikä heidän perheenjäsenilleen. Perheenjäsenen määrittelyyn sovelletaan ulkomaalaislakia. Tilauskoulutukseen osallistuvaan ei sovelleta lukiolain 1 §:n 2 momenttia, 10, 15, 16 ja 19–22 §:ää, 28 §:n 3 momenttia, 32 §:n 1 momenttia eikä 34 §:n 2 momenttia. Tilauskoulutuksen järjestäminen ei saa heikentää koulutuksen järjestäjän tämän lain perusteella antamaa muuta lukiokoulutusta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjän on perittävä koulutuksen tilaajalta tilauskoulutuksen järjestämisestä vähintään siitä aiheutuvat kustannukset kattava maksu. Maksun tulee kattaa myös 35 §:n mukaisista opintososiaalisista eduista aiheutuvat kustannukset. Koulutuksen järjestäjän on kohdennettava tilauskoulutuksesta saamansa tuotto omaan koulutustoimintaansa. Koulutuksen tilaajalla on oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta sijaintivaltionsa lainsäädännön tai oman käytäntönsä mukaisia maksuja. Tilauskoulutuksena järjestettävään opetukseen ei sovelleta opetus- ja kulttuuritoimen rahoituksesta annettua lakia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjä voi valita opiskelijaksi tilauskoulutukseen henkilön, jolla on riittävät edellytykset 1 momentissa tarkoitettujen opintojen suorittamiseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutusta koskevaa pykälää täsmennettiin 1.1.2025 alkaen voimaan tulleella lailla lukiokolain muuttamisesta (801/2024). Pykälään lisättiin, että tilauskoulutusta ei kuitenkaan saa järjestää, jos tilaajan tarkoituksena on vain välittää opiskelijoita tutkinto-opiskelijoiksi ilman tarkoitusta rahoittaa koulutus. Koulutuksen järjestäjän on huolehdittava siitä, että tilauskoulutusta koskevassa sopimuksessa on määritelty tilauskoulutukseen osallistuvan oikeudet ja velvollisuudet ja että tilauskoulutukseen osallistuvat tuntevat ne.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriön toteuttaman kyselyn mukaan kaikista vastaajista (n=104) vain neljä koulutuksen järjestäjää ilmoitti järjestävänsä tilauskoulutusta. Tilauskoulutusryhmiä oli sekä vuonna 2023 ja 2024 keskimäärin noin yksi. Kaikki tilauskoulutusta järjestävät koulutuksen järjestäjät eivät järjestäneet tilauskoulutusta molempina tarkasteltuina vuosina. Vuonna 2023 tilauskoulutukseen osallistui keskimäärin noin kuusi opiskelijaa ja vuonna 2024 noin 12 opiskelijaa. Koska tarkasteltuina vuosina aloittaneiden opiskelijoiden opintojen alkamisesta on kulunut maksimissaan puolitoista vuotta, vain muutama opiskelija on ehtinyt suorittaa tutkintonsa loppuun alkukevääseen 2025 mennessä. Vastaajien mukaan kukaan vuonna 2023 tai 2024 aloittaneista tilauskoulutusopiskelijoista ei ole keskeyttänyt opintojaan. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukuvuosimaksullisuus toisella asteella\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Kolmansista maista Suomeen tulevat opiskelijat voivat opiskella maksuttomassa valtionosuusrahoitteisessa koulutuksessa tai tilauskoulutuksessa, jonka tilaajalla on oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta tilaajan sijaintivaltion lainsäädännön tai oman käytäntönsä mukaisia maksuja. Lukuvuosimaksuja toisen asteen koulutuksessa ei voi periä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ammatillisesta koulutuksesta annetun lain 105 §:n mukaan ammatillinen perustutkintokoulutus sekä työhön ja itsenäiseen elämään valmentava koulutus ovat opiskelijalle maksuttomia. Ammattitutkinto- ja erikoisammattitutkintokoulutuksessa sekä 8 §:ssä tarkoitetussa muussa ammatillisessa koulutuksessa koulutuksen järjestäjä voi periä opiskelijalta kohtuullisen opiskelumaksun, jolla katetaan osittain koulutuksen järjestämisestä aiheutuvia kustannuksia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiolain 34 §:n mukaan tässä laissa tarkoitettuun koulutukseen kuuluva opetus ja ohjaus ovat opiskelijalle maksuttomia. Aineopiskelijalta ja erityisen tutkinnon kokeista voidaan periä maksuja, ei kuitenkaan oppivelvolliselta. Lisäksi ulkomailla järjestettävästä opetuksesta ja yksityisen yhteisön tai säätiön opetus- ja kulttuuriministeriön määräämän erityisen koulutustehtävän perusteella muulla opetuskielellä kuin suomen, ruotsin, saamen, romani- tai viittomakielellä järjestämästä opetuksesta voidaan periä kohtuullisia maksuja.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen kansainväliset opiskelijat osallistuvat lähes täysin julkisrahoitteiseen koulutukseen. Ammatillisen koulutuksen osalta kysyntä jakautuu tilauskoulutukseen ja julkisrahoitteiseen koulutukseen. Tilauskoulutuksen maksujen periminen opiskelijoilta on yleistä. Ulkoministeriön tietojen mukaan esimerkiksi tilauskoulutuksen kautta Kenian maaseudulta kotoisin olevat siivousalan ja sosiaali- ja terveysalan opiskelijat sijoittavat jopa 19 000 euroa koulutukseen ja Suomeen muuttoon. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Julkisrahoitteiseen koulutukseen hakeudutaan omaehtoisesti tai välittäjäorganisaatioiden avulla. Välittäjäorganisaatioita käytetään niin maksullisessa tilauskoulutuksessa opiskelijaryhmien kokoamiseen kuin opiskelijarekrytoinnissa julkisrahoitteiseen koulutukseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kolmansista Suomeen tulevat opiskelijat maksavat jo nyt koulutuksestaan osin tai kokonaan. Kolmansista maista Suomeen saapuvat opiskelijat osallistuvat yleensä maksulliseen kieli- ja/tai kulttuurikoulutukseen tai opiskeluvalmiuksia parantavaan koulutukseen, joka yleensä tapahtuu opiskelijan lähtömaassa ennen Suomeen saapumista. Nämä koulutukset ovat maksullisia ja koulutusta järjestävät yleensä aiemmin mainitut välittäjäorganisaatiot. Poliisi ja Rajavartiolaitos ovat kiinnittäneet huomiota välittäjäorganisaatioiden toimintaan, johon voi liittyvä kynnysrahan perimisen kaltaista toimintaa. Kyse on siitä, että onko maksulliseen lähtömaakoulutukseen osallistuminen edellytys opiskelupaikan saamiselle Suomesta. Opiskelupaikan perusteella on mahdollista hakea opiskelijan oleskelulupaa. Toimintatavan moitittavuuden arviointi ei ole helppoa, koska maksullisten koulutusten ja palvelujen tarjoaminen tapahtuu Suomen ulkopuolella ko. maan kansallisen lainsäädännön piirissä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansainvälisten opiskelijoiden hakeutuminen suomalaiseen lukiokoulutukseen ja ammatilliseen koulutukseen on lisääntynyt. Taustalla ovat koulutusmahdollisuuksien lisääntynyt markkinointi maan rajojen ulkopuolella sekä ammatillisen koulutuksen osalta myös syventynyt työvoimapula, johon haetaan helpotusta maan rajojen ulkopuolelta. Lähtömaissa on myös elinolosuhteisiin, talouteen ja työmarkkinoihin sekä poliittiseen tilanteeseen liittyviä tekijöitä, jotka tekevät Eurooppaan hakeutumisesta houkuttelevaa. On odotettavissa, että hakeutuminen suomalaiseen koulutukseen ennalta mainituista syistä lisääntyy myös tulevaisuudessa. Suomeen onkin 2020-luvulla syntynyt ilmiö, jossa julkisrahoitteista lukiokoulutusta markkinoidaan Euroopan ulkopuolella. Taustalla on myös Suomen väestökehitys, joka on johtanut opiskelijamäärien vähentymiseen erityisesti monissa lukioissa. Markkinoinnista vastaavat yksityiset yritykset ja siihen sisältyy mm. kielikoulutusta, josta yritys perii osallistujilta maksut. Toistaiseksi Suomeen on tullut muutamia satoja opiskelijoita Euroopan ulkopuolelta, mutta julkisuudessa on asetettu tavoitteeksi tuhansien ulkomaalaisten opiskelijoiden saaminen Suomeen vuosittain.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Englanninkielisen ammatillisen koulutuksen tarjonta on lisääntynyt, kun opetus- ja kulttuuriministeriö on myöntänyt järjestämislupiin oikeuksia järjestää eri alojen tutkintoja englannin kielellä. Keväällä 2025 oli 30 koulutuksen järjestäjällä oikeus järjestää yhteensä 92 tutkintoa englannin kielellä. Opiskelijoita on vajaa 2000. Englanninkielinen tutkintokoulutus tarkoitettiin alun perin maassa olevan vieraskielisen väestön tarpeisiin, mutta työvoimapulasta ja kansainvälisestä hakeutumisesta johtuen järjestämislupamuutoksia on perusteltu myös ulkomailta Suomeen tulevilla opiskelijoilla.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäksi ammatillisen koulutuksen kokeilu käynnistyy 1.1.2026 alkaen, jolloin kokeilujärjestäjät saavat suhteellisen vapaan oikeuden järjestää englanninkielistä koulutusta. Arvioidaan, että kolmansista maista tulevien hakijoiden määrä voi tästä syystä kasvaa englanninkielisiin tutkintoihin, joita rahoitetaan valtionosuusrahoituksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto toimitti opetus- ja kulttuuriministeriölle 1.4.2025 tilastotietoja vuosina 2022–2024 tehdyistä myönteisistä opiskelijan oleskelulupapäätöksistä.&nbsp;\u003C/p>\n     \u003Cdiv id=\"tableID-N10220\" class=\"table\">\n      \u003Ctable class=\"vaskitgroup\">\n       \u003Ctbody class=\"tbody\">\n        \u003Ctr class=\"vaskirow\">\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">2022&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">2023&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">2024&nbsp;\u003C/p>\n         \u003C/td>\n        \u003C/tr>\n        \u003Ctr class=\"vaskirow\">\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Ensimmäistä oleskelulupaa koskeva hakemus\u003C/span> &nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">8 383\u003C/span> &nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">12 795\u003C/s rder r-border\">\n          \u003Cp class=\"KappaleKooste\">874&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">703&nbsp;\u003C/p>\n         \u003C/td>\n        \u003C/tr>\n        \u003Ctr class=\"vaskirow\">\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">Ylioppilastutkinto&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">61&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">85&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">102&nbsp;\u003C/p>\n         \u003C/td>\n        \u003C/tr>\n        \u003Ctr class=\"vaskirow\">\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">Ei tiedossa&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">174&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">223&nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">189&nbsp;\u003C/p>\n         \u003C/td>\n        \u003C/tr>\n        \u003Ctr class=\"vaskirow\">\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kaikki yhteensä\u003C/span> &nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">11 999\u003C/span> &nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">16 112\u003C/span> &nbsp;\u003C/p>\n         \u003C/td>\n         \u003Ctd class=\"vaskientry b-border r-border\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">14 224\u003C/span> &nbsp;\u003C/p>\n         \u003C/td>\n        \u003C/tr>\n       \u003C/tbody>\n      \u003C/table>\n     \u003C/div>\n     \u003Cp class=\"KappaleKooste\">Taulukko 1 ensimmäistä oleskelulupaa ja jatkolupaa koskevien myönteisten päätösten määrä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Taulukossa on noin 19 % osuus päätöksiä, joissa koulutusaste ei ole tiedossa. Osa näistä päätöksistä voi koskea myös ammatillista ja lukiokoulutusta. Kolmansien maiden kansalaisten osuus ammatillisessa koulutuksessa on huomattavasti suurempi kuin taulukossa 1 oleva oleskelulupien määrä, koska ammatillinen koulutus on suosittu koulutusväylä maassa jo vakituisesti asuville maahanmuuttajille. Maahanmuuttoviraston tilastojen mukaan opiskelijan oleskeluluvan hakemuksia saapuu eniten toiselle asteelle Myanmarista (18 %), Intiasta (13 %), Vietnamista (12 %), Filippiineiltä (11 %) ja Sri Lankasta (10 %). Muut valtiot muodostavat kaikista toisen asteen hakemuksista 36 prosentin osuuden.&nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kolmansien maiden opiskelijat lukiokoulutuksessa\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriön keväällä 2025 lukiokoulutuksen järjestäjille tekemän kyselyn mukaan kaikista vastaajista noin 70 % (n=72) ilmoitti, että heidän järjestämäänsä lukiokoulutukseen hakeutuu opiskelijoita kolmansista maista. Heistä hieman vajaa puolet (n=34) kertoi tekevänsä itse tai yhdessä yhteistyökumppanin kanssa kolmansiin maihin suunnattua viestintää tai markkinointia, jolla on pyritty lisäämään kiinnostusta heidän tarjoamaansa koulutukseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista hakemuksia saavista koulutuksen järjestäjistä selvä enemmistö (n=60) kertoi, että opiskelijat hakeutuvat suoraan oma-aloitteisesti heidän järjestämäänsä koulutukseen. Vastaajat kertoivat, että opiskelijat hakeutuivat lukiokoulutukseen esimerkiksi Opintopolun yhteishaun tai jatkuvan haun kautta taikka olemalla sähköpostitse yhteydessä suoraan koulutuksen järjestäjään. Oma-aloitteisen koulutukseen hakeutumisen lisäksi opiskelijoita oli hakeutunut opiskelijaksi opiskelijarekrytoinnin kautta. Vastaajista noin puolet (n=34) kertoi, että kolmansissa maissa tehtyyn opiskelijarekrytointiin osallistui yhteistyökumppani, jonka kanssa oli tehty sopimus yhteistyöstä. Vain kolme vastaajaa kertoi, että kolmansissa maissa tehtyyn opiskelijarekrytointiin osallistui sellainen opiskelijoita välittävä organisaatio, jonka kanssa ei ollut tehty sopimusta yhteistyöstä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vuonna 2023 lukiokoulutukseen hakeutui kolmansista maista keskimäärin noin 18 opiskelijaa ja vuonna 2025 noin 25 opiskelijaa. Hakeutuneista opiskelijaksi valittiin vuonna 2023 keskimäärin neljä opiskelijaa ja vuonna 2024 viisi opiskelijaa. Valituista opiskelijoista saman verran sekä vastaanotti opiskelupaikan että lopulta aloitti opiskelun molempina vuosina. Opintojen lopettaminen kesken koulutuksen oli hyvin harvinaista tarkasteltuina vuosina. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista hakeutuvien opiskelijoiden edellytyksiä suoriutua koulutuksesta arvioitiin eri tavoin. Edellytyksiä arvioitiin pääasiassa joko kielikokeen, haastattelun tai todistuksen perusteella. Kaikkein tärkeimpänä edellytyksenä koulutuksesta suoriutumisen kannalta pidettiin riittävää kielitaitoa. Myös hakijoiden korkea motivaatio koettiin tärkeäksi.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tyypillisesti pääsy- tai soveltuvuuskokeita järjestettiin joko Suomessa, EU:n alueella tai verkon välityksellä. Mainituilla tavoilla pääsy- tai soveltuvuuskokeita järjesti vuonna 2023 noin neljännes vastaajista ja vuonna 2024 noin kolmasosa vastaajista. Vain kaksi koulutuksen järjestäjää ilmoitti järjestäneensä pääsy- tai soveltuvuuskokeita paikan päällä kolmansissa maissa. Kielikokeita tai muuta kielitaidon testausta järjestettiin useimmiten verkossa ennen opiskelijaksi valintaa. Vuonna 2023 vajaa puolet vastaajista ja vuonna 2024 reilu puolet vastaajista oli järjestänyt kielikokeita tai muuta kielitaidon testausta verkossa. Ennen opiskelijaksi valintaa kielitaitoa testattiin usein myös Suomessa tai EU:n alueella. Vuonna 2023 noin 28 % vastaajista ja vuonna 2024 noin 43 % vastaajista oli ennen opiskelijaksi valintaa järjestänyt Suomessa tai EU:n alueella kielikokeita tai muuta kielitaidon testausta. Vain muutama koulutuksen järjestäjä kertoi järjestäneensä kielitaidon testausta paikan päällä kolmansissa maissa.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kolmansien maiden opiskelijat ammatillisessa koulutuksessa\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriön keväällä 2025 toteuttaman kyselyn toisessa osiossa käsiteltiin valtionosuusrahoitteista ammatillista koulutusta, johon on haettu vapaan hakeutumisoikeuden kautta. Kysymykset koskivat kolmansista maista Suomeen hakeutuneita henkilöitä, tilauskoulutusopiskelijoita lukuun ottamatta. Kolmansista maista saapuneilla tarkoitettiin tässä kyselyssä EU- ja ETA-valtioiden ulkopuolelta hakeutuneita opiskelijoita, jotka olivat hakeutuneet Suomeen ammatilliseen koulutukseen opiskelutarkoituksessa. Kysely ei siis koskenut niitä henkilöitä, jotka opiskelemaan hakeutuessaan oleskelivat jo Suomessa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vastaajista 80 % (n=44) ilmoitti, että heidän järjestämään ammatilliseen tutkintokoulutukseen hakeutui opiskelijoita kolmansista maista. Kaikista vastanneista koulutuksen järjestäjistä kuitenkin vain 7 % (n=4) ilmoitti tekevänsä sellaista kolmansiin maihin suunnattua viestintää tai markkinointia, jolla oli pyritty lisäämään kiinnostusta heidän tarjoamaansa koulutukseen. Markkinointia tekevistä koulutuksen järjestäjistä kahdella osallistui opiskelijarekrytointiin kolmansissa maissa yhteistyökumppani (esim. agentti), jonka kanssa koulutuksen järjestäjällä oli sopimus yhteistyöstä. Joissain tapauksissa opiskelijarekrytoinnissa mukana saattoi olla myös agentti, jonka kanssa ei ollut erillistä sopimusta yhteistyöstä. Kolmansiin maihin kohdistuvaa markkinointia harjoittavista koulutuksen järjestäjistä kolme ilmoitti, että yksittäiset opiskelijat hakeutuivat oma-aloitteisesti suoraan heidän järjestämäänsä koulutukseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista tutkintokoulutukseen hakeutuneiden määrä vuonna 2023 oli markkinointia tekevillä koulutuksen järjestäjillä (n=4) keskimäärin 61 opiskelijaa ja vuonna 2024 132 opiskelijaa. Heistä tutkintokoulutukseen valittiin sekä vuonna 2023 että 2024 noin 39 opiskelijaa. Vuonna 2023 opiskelupaikan vastaanotti noin 36 opiskelijaa ja vuonna 2024 noin 35 opiskelijaa. Opiskelun aloitti vuonna 2023 noin 35 opiskelijaa ja vuonna 2024 34 opiskelijaa. Paikan saaneista opiskelijoista siis lähes kaikki otti tarjotun opiskelupaikan vastaan sekä lopulta aloitti opiskelun tutkintokoulutuksessa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista hakeutuvien henkilöiden soveltuvuutta koulutukseen kerrottiin arvioitavan muun muassa pääsykokeen avulla. Pääsykokeet järjestettiin pääasiassa verkossa. Soveltuvuutta koulutukseen arvioitiin myös etähaastatteluiden avulla. Hakijan soveltuvuutta arvioitaessa riittävää kielitaitoa pidetiin erityisen merkittävänä tekijänä. Vastaajista enemmistö ilmoittikin järjestävänsä lisäksi myös kielikokeita tai muuta kielitaidon testausta verkossa ennen opiskelijaksi valintaa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vastausten mukaan kolmansista maista opiskelutarkoituksessa Suomeen tulleista opiskelijoista kolmannes suoritti vuosina 2023 ja 2024 opintonsa osin tai kokonaan oppisopimuskoulutuksena. Vuonna 2023 koulutuksen järjestäjä järjesti oppisopimuskoulutusta keskimäärin 75 kolmansista maista saapuneelle opiskelijalle. Vuonna 2024 oppisopimuskoulutusta järjestettiin keskimäärin noin 118 kolmansista maista saapuneelle opiskelijalle. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimus oppisopimuskoulutuksesta tehtiin suurimmassa osassa tapauksista vasta opintojen edettyä Suomessa. Tavallista oli myös tehdä sopimus heti opiskelijan saavuttua Suomeen. Harvoissa tapauksissa sopimus oppisopimuskoulutuksesta tehtiin jo ennen opiskelijan saapumista Suomeen. Tätä tapaa käytettiin erityisesti silloin, kun kolmansista maista saapuvilla opiskelijoilla oli valmiiksi työperusteiset oleskeluluvat ja heillä oli myös työpaikka valmiina ennen maahan saapumista. Vastaajien arvion mukaan oppisopimuskoulutukseen osallistuvista opiskelijoista ei juurikaan vaihdeta opiskeluperusteista oleskelulupaa työperusteiseksi muutamaa poikkeusta lukuun ottamatta. Vastaajista puolet arvioi, että oleskelulupaa ei vaihdettu. Kuusi järjestäjää arvioi vaihtajien lukumäärän vaihtelevan 5–450 välillä. Kolme vastaajaa ei osannut arvioida oleskeluluvan vaihtaneiden määrää.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukuvuosimaksullisuus korkea-asteella\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Yliopistoissa ja ammattikorkeakouluissa lukuvuosimaksut kolmansista maista tuleville opiskelijoille otettiin käyttöön 1.8.2017 alkaen. Yliopistolain 10 §:n ja ammattikorkeakoululain 13 a §:n mukaan korkeakoulun on perittävä muuhun kuin suomen- tai ruotsinkieliseen alempaan tai ylempään korkeakoulututkintoon johtavaan koulutukseen hyväksytyltä opiskelijalta vähintään 1 500 euron suuruinen maksu lukuvuodessa. Yliopistolakia ja lakia ammattikorkeakouluista on muutettu 1.8.2026 alkaen siten, että korkeakoulujen on perittävä muuhun kuin suomen- tai ruotsinkieliseen alempaan tai ylempään korkeakoulututkintoon johtavaan koulutukseen hyväksytyiltä opiskelijoilta vähintään koulutuksen järjestämisestä aiheutuvat kustannukset kattavat maksut lukuvuodessa. Korkeakouluissa siirrytään siis 1.8.2026 alkaen kiinteästä lukuvuosimaksusta yleiskatteelliseen lukuvuosimaksuun. Täysikatteellisiin lukuvuosimaksuihin siirtyminen korkea-asteella saattaa johtaa kasvaviin hakijamääriin ammatillisessa koulutuksessa, mikäli toisella asteella ei oteta käyttöön säännöksiä lukuvuosimaksuista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Korkeakoulut ovat havainneet kasvavissa määrin, että lukuvuosimaksuvelvollisuutta kierretään hankkimalla opintojen alkamisen jälkeen muu kuin opiskelijan oleskelulupa. Useimmiten hankitaan työntekijän oleskelulupa, koska muilla jatkuvilla oleskeluluvilla kuin opiskelijan oleskeluluvalla maassa oleskelevat eivät ole tällä hetkellä lukuvuosimaksuvelvollisia. Tästä syystä korkeakouluissa tulee 1.8.2026 voimaan säännösmuutos, jolla lukuvuosimaksun välttäminen oleskelulupaperustetta muuttamalla estetään. Toiselle asteelle on perusteltua esittää vastaavanlaista säännöstä. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oppivelvollisuuslaki\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Uusi oppivelvollisuuslaki tuli voimaan 1.8.2021. Oppivelvollisuuslain 1 §:n mukaan Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia. Lapsi katsotaan tätä lakia sovellettaessa Suomessa vakinaisesti asuvaksi, jos hänellä on kotikuntalaissa (201/1994) tarkoitettu kotikunta Suomessa. Oppivelvollisuus päättyy, kun oppivelvollinen täyttää 18 vuotta tai kun oppivelvollinen on tätä ennen hyväksytysti suorittanut ylioppilastutkinnosta annetussa laissa (502/2019) tai ammatillisesta koulutuksesta annetussa laissa tarkoitetun tutkinnon taikka niitä vastaavan Ahvenanmaalla suoritetun tai ulkomaisen koulutuksen. Kotikuntalain 4 §:n mukaan Suomeen ulkomailta tulleen ja täällä asuvan henkilön kotikunta ja siellä oleva asuinpaikka määräytyy tämän lain säännösten mukaisesti muun muassa silloin, kun hänellä on ulkomaalaislaissa (301/2004) tarkoitettu voimassa oleva jatkuvaan tai pysyvään oleskeluun oikeuttava lupa, hän on sellaisen henkilön perheenjäsen, jolla on Suomessa tässä laissa tarkoitettu kotikunta taikka hänellä on ulkomaalaislaissa tarkoitettu voimassa oleva vähintään yhden vuoden tilapäiseen oleskeluun oikeuttava lupa ja hänellä on lisäksi tarkoitus olosuhteet kokonaisuudessaan huomioon ottaen jäädä Suomeen vakinaisesti asumaan. Suomeen toiselle asteelle opiskelemaan tulevat henkilöt tulevat Suomeen tilapäisellä oleskeluluvalla. Oppivelvollisuuslain perustelujen (HE 173/2020 vp, s. 284) mukaan oikeus maksuttomaan koulutukseen olisi vain oppivelvollisuksi katsottavilla henkilöillä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Oppivelvollisuuslain säännökset huomioiden henkilö, joka on Suomessa oppivelvollinen, ei myöskään pääsääntöisesti voisi olla lukuvuosimaksuvelvollinen. Olisi kuitenkin perusteltua, että lukuvuosimaksullisia olisivat sellaiset alaikäiset opiskelijat, jotka ovat tulleet Suomeen opiskelijan oleskeluluvalla nimenomaan opiskelutarkoituksessa tarkoituksenaan suorittaa toisen asteen tutkinto.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Toisen asteen koulutuksen rahoitus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuritoimen rahoituksesta annetussa laissa (1705/2009, jatkossa rahoituslaki) säädetään ammatillisen koulutuksen ja lukiokoulutuksen rahoituksesta. Ammatillisessa koulutuksessa rahoitus perustuu 1.1.2026 alkaen toteutuneisiin opiskelijavuosiin, suoritettuihin opintoihin, opiskelijoiden siirtymiseen työelämään tai jatko-opintoihin sekä opiskelija- ja työelämäpalautteeseen. Lukiokoulutuksessa rahoitus perustuu opiskelijamääriin ja yksikköhintoihin.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Jotta toisen asteen koulutukseen kolmansista maista tulevat opiskelijat eivät olisi valtionosuusrahoituksen piirissä, olisi tarpeellista säätää rahoituslaissa poikkeukset, jonka mukaan näitä henkilöitä ei otettaisi huomioon valtionosuusrahoitusta laskettaessa.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukuvuosimaksujen maksaminen opiskelijan oleskeluluvan myöntämisen edellytyksenä\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annetun lain (719/2018, jäljempänä Tutkija- ja opiskelijalaki) 7 ja 7 a §:ssä säädetään opiskelijan oleskeluluvan myöntämisen edellytyksistä. Korkeakouluopintojen osalta säädetään luvan myöntämisen edellytyksenä, että oleskelulupaa hakeva on hyväksytty opiskelijaksi korkeakoulututkintoon johtavaan koulutukseen Suomessa sijaitsevaan korkeakouluun ja hän on suorittanut korkeakoulun vaatimat maksut. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koska lukuvuosimaksuja toisen asteen koulutuksesta ei voimassa olevan lainsäädännön nojalla voi periä, ei lukuvuosimaksujen perimistä myöskään säädetä oleskeluluvan myöntämisen edellytykseksi Tutkija ja opiskelijalain 7 a §:n 2 momentissa. Lainkohdassa säädetään edellytykseksi ainoastaan, että kolmannen maan kansalainen on hyväksytty opiskelijaksi Suomessa sijaitsevaan: 1) muuhun oppilaitokseen kuin korkeakouluun, jos opiskelu johtaa tutkintoon tai ammattiin; tai 2) korkeakouluun tai muuhun oppilaitokseen myös muihin kuin tutkintoon johtaviin opintoihin, jos oleskeluluvan myöntämiselle on perusteltu syy. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Jotta tämän esityksen mukainen lukuvuosimaksuvelvollisuus lukiokoulutuksen ja ammatillisen koulutuksen osalta kolmansista maista tuleville opiskelijoille saadaan yhdenmukaisesti opiskelijan oleskeluluvan edellytykseksi, olisi tarpeellista muuttaa Tutkija- ja opiskelijalakia.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdistelmälupadirektiivin vaikutus lukuvuosimaksujen kohderyhmään\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Euroopan neuvoston ja parlamentin direktiivi kolmansien maiden kansalaisille jäsenvaltion alueella oleskelua ja työskentelyä varten myönnettävää yhdistelmälupaa koskevasta yhden hakemuksen menettelystä sekä jäsenvaltiossa laillisesti oleskelevien kolmansista maista tulleiden työntekijöiden yhtäläisistä oikeuksista (2011/98/EU, jäljempänä yhdistelmälupadirektiivi) on annettu 13.12.2011. Se on toimeenpantu hallituksen esityksellä HE 139/2013 vp. Uudistettu yhdistelmälupadirektiivi (EU) 2024/1233, joka edellyttää Suomessa vähäisiä muutoksia lainsäädäntöön, tulee panna kansallisesti täytäntöön 21.5.2026 mennessä. Uudistus ei sisällöllisesti vaikuta seuraavassa esitettyyn arvioon direktiivin vaikutuksesta lukuvuosimaksujen perimiseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhdistelmälupadirektiivin tarkoituksena on yksinkertaistaa ja yhdenmukaistaa kolmansista maista tulevien työntekijöiden maahanpääsyä koskevia menettelyjä. Direktiivi turvaa kolmansista maista tuleville työntekijöille jäsenvaltion kansalaisten kanssa yhdenvertaisen kohtelun direktiivissä määritellyillä, esimerkiksi työelämän, koulutuksen ja sosiaaliturvan alueilla. Direktiivin ’kolmannesta maasta tulleella työntekijällä’ tarkoitetaan kolmannen maan kansalaista, jolle on myönnetty pääsy jonkin jäsenvaltion alueelle ja joka oleskelee siellä laillisesti ja joka kansallisen oikeuden tai käytännön mukaisesti saa työskennellä palkatussa työsuhteessa olevana tuossa jäsenvaltiossa (2 artiklan 1 kohdan b alakohta). Direktiivin johdanto-osan 19 kappaleessa on todettu, että direktiivin työntekijän määritelmästä sanottu ei vaikuta muissa unionin oikeuden säännöksissä olevan työsuhteen käsitteen tulkintaan. Direktiivin 3 luvussa säädetään oikeudesta yhdenvertaiseen kohteluun. Direktiivin mukaan kolmansista maista tulleita työntekijöitä on kohdeltava yhdenvertaisesti oleskelujäsenvaltion kansalaisten kanssa koulutuksen ja ammatillisen koulutuksen osalta (12 artiklan 1 kohdan c alakohta). Uudistetussa direktiivissä vastaava kohta on muotoiltu oikeudeksi yleissivistävään ja ammatilliseen koulutukseen, mutta muutoksella ei ole tämän esityksen kannalta merkitystä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Direktiivin 1 artiklan 2 kohdan mukaisesti direktiivi ei vaikuta jäsenvaltioiden toimivaltaan, joka koskee kolmansien maiden kansalaisten pääsyä niiden työmarkkinoille. Direktiivin johdanto-osan 6 kappaleen mukaan direktiivin säännökset eivät saisi vaikuttaa jäsenvaltioiden toimivaltaan säännellä maahanpääsyä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kun lukuvuosimaksujen maksaminen on kansallisessa lainsäädännössä opiskelijan oleskeluluvan myöntämisen edellytyksenä, ei yhdistelmälupadirektiivi rajoita mahdollisuutta vaatia lukuvuosimaksuja lukio- ja ammatilliseen koulutukseen saapuvilta tai maassa oleskelevilta kolmannen maan kansalaisilta, jotka oleskelevat Suomessa opiskelijan oleskeluluvalla. Tämä johtuu siitä, että direktiivin tarkoituksena ei ole säätää maahanpääsyn tai laillisen oleskelun edellytyksistä, vaan yhdenvertaisesta kohtelusta siinä tilanteessa, kun henkilölle on myönnetty pääsy jäsenvaltioon ja tämä oleskelee siellä laillisesti. Merkitystä ei olisi sillä, vaatiiko koulutuksen järjestäjä maksujen maksamista kokonaisuudessaan ennen koulutuksen alkamista vai useassa osassa, sillä lupaedellytysten tulee täyttyä oleskelun ajan. Tutkija- ja opiskelijalain 12 §:n 1 momentin 1 kohdan mukaan opiskelijan oleskelulupa on peruutettava tai jätettävä uusimatta, jos kolmannen maan kansalainen ei enää täytä säädettyjä edellytyksiä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Direktiivin 12 artiklan mukainen yhdenvertainen kohtelu on rajattu koskemaan 3 artiklan 1 kohdan b ja c alakohdassa tarkoitettuja kolmansista maista tulleita työntekijöitä eli kolmansien maiden kansalaisia, joille on unionin tai kansallisen oikeuden mukaisesti myönnetty pääsy jäsenvaltioon muuta tarkoitusta kuin työntekoa varten, jotka saavat työskennellä ja joille on myönnetty oleskelulupa asetuksen (EY) N:o 1030/2002 mukaisesti sekä kolmansien maiden kansalaisiin, joille on unionin tai kansallisen oikeuden mukaisesti myönnetty pääsy jäsenvaltioon työntekoa varten. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tämän lisäksi direktiivin mukaan jäsenvaltiot voivat rajoittaa yhdenvertaista kohtelua liittyen koulutukseen ja ammatilliseen koulutukseen. Ensinnäkin jäsenvaltiot voivat rajoittaa yhdenvertaista kohtelua koulutuksessa ja ammatillisen koulutuksessa rajoittamalla sen soveltamisen sellaisiin kolmansista maista tulleisiin työntekijöihin, jotka ovat työsuhteessa tai jotka ovat olleet työsuhteessa ja ovat rekisteröityneet työttömiksi työnhakijoiksi (12 artiklan 2 kohdan a alakohdan i alakohta). Näin ollen oikeus yhdenvertaiseen kohteluun ei jäsenvaltion niin halutessa synny pelkästään sillä, että henkilöllä on oikeus työntekoon, vaan häneltä voidaan edellyttää myös tosiasiallista työntekoa ja työnteon päätyttyä työttömäksi työnhakijaksi rekisteröitymistä. Lisäksi jäsenvaltiot voivat rajoittaa yhdenvertaista kohtelua asettamalla kansallisen oikeuden mukaisesti erityisiä vaatimuksia korkeakoulutason koulutukseen ja toisen asteen jälkeiseen koulutukseen sekä ammatilliseen koulutukseen, joka ei liity suoraan tiettyyn työllistymiseen tähtäävään toimintaan, pääsyn edellytykseksi. Erityisiä vaatimuksia voivat olla kielitaitovaatimukset ja lukukausimaksujen maksaminen (12 artiklan 2 kohdan a alakohdan iv alakohta). Näin ollen direktiivi ei yleisesti estä lukuvuosimaksujen perimistä ammatillisesta koulutuksesta. Lukiokoulutus ei kuitenkaan mene tämän poikkeuksen piirin. Näin ollen direktiivin mukaisena vähimmäisvaatimuksena on, että maksutonta lukiokoulutusta tarjotaan sellaisille henkilöille, jotka ovat työsuhteessa tai jotka ovat olleet työsuhteessa ja ovat rekisteröityneet työttömiksi työnhakijoiksi, ellei lukuvuosimaksun maksaminen ole edellisessä kappaleessa kuvatusti kyseisen henkilön maahanpääsyn ja laillisen maassa oleskelun edellytys. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhteenvetona, yhdistelmälupadirektiivin edellä kuvatut vaatimukset yhdenvertaisesta kohtelusta on otettava huomioon säädettäessä lukuvuosimaksuja toiselle asteelle. Yhdistelmälupadirektiivi rajoittaa lukukausimaksujen perimistä niiden osalta, joilla lukuvuosimaksujen maksaminen ei ole oleskeluluvan edellytys eikä näin ollen koske henkilön pääsyä jäsenvaltion alueelle tai laillista oleskelua siellä. Direktiivin mukaiset rajoitukset koskevat myös henkilöitä, jotka ovat alun perin tulleet maahan opiskelijan oleskeluluvalla, mutta sittemmin vaihtaneet toiseen lupaperusteeseen, koska tällöin lukuvuosimaksun maksaminen ei ole enää heille laillisen oleskelun edellytys.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tiedonsaantioikeudet\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Julkisen hallinnon tiedonhallinnasta annetun lain (906/2019), jäljempänä tiedonhallintalaki, 23 §:n mukaan viranomainen voi avata katseluyhteyden toiselle viranomaiselle tietovarannon sellaisiin tietoihin, joihin katseluoikeuden saavalla viranomaisella on tiedonsaantioikeus. Tiedonhallintalaki siten lähtökohtaisesti mahdollistaa sen, että ammatillisen koulutuksen ja lukiokoulutuksen järjestäjille voisi myöntää katseluyhteyden oleskelulupatietoihin, mutta edellytyksenä on, että koulutuksen järjestäjien tiedonsaantioikeudesta säädetään laissa. Katseluyhteys edellyttää tiedonhallintalain mukaan lisäksi sitä, että katselu rajataan vain yksittäisiin hakuihin, jotka voivat kohdistua tiedonsaantioikeuden mukaisesti tarpeellisiin tai välttämättömiin tietoihin ja että tietojen hakemisen yhteydessä selvitetään tietojen käyttötarkoitus.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiolaissa, laissa ammatillisesta koulutuksesta tai laissa valtakunnallisista opinto- ja tutkintorekistereistä ei nykyisellään ole sellaisia tiedonsaantioikeuksia, jotka sopisivat tähän tarkoitukseen. Kumotussa ulkomaalaisrekisteristä annetussa laissa (1270/1997) säädettiin aiemmin, että ulkomaalaisrekisteristä sai luovuttaa tietoa oppilaitoksille opiskelijoiden oleskeluluvista. Sen korvanneessa henkilötietojen käsittelystä maahanmuuttohallinnossa annetussa laissa (615/2020), jäljempänä maahanmuuttohallinnon henkilötietolaki, ei sen sijaan enää säädetä tiedon luovuttamisesta ulkomaalaisasioiden asianhallintajärjestelmästä muuten kuin sen rekisterinpitäjien välillä. Perusteena oli, että haluttiin luopua niin sanotusta kaksisuuntaisesta sääntelystä. Lisäksi tiedonhallintalain lähtökohta on, että laissa säädettäisiin tiedonsaantioikeuksista eikä tietojen luovutusoikeuksista. Tiedonsaantioikeuksien tulisi ilmetä kunkin viranomaisen omasta lainsäädännöstä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjillä ei ole voimassa olevan lainsäädännön puitteissa oikeutta saada rekisteritietoa siitä, millaisella oleskeluluvalla henkilö tai hänen perheenjäsenensä oleskelee, mikä olisi välttämätöntä tässä esityksessä ehdotetun kolmansien maiden kansalaisten lukuvuosimaksullisen koulutuksen toteuttamiseksi. Opiskelija on myös saattanut kadota kesken opintojensa, eikä koulutuksen järjestäjällä ole tietoa, onko hän saanut jatkoa oleskeluluvalleen tai onko hän saanut kielteisen päätöksen.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tavoitteet\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Esityksen tavoitteena on avata ammatillisen koulutuksen tilauskoulutus myös Euroopan talousalueen valtioiden kansalaisille Suomen osaajatarpeeseen vastaamiseksi pääministeri Petteri Orpon hallitusohjelman mukaisesti.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Tilauskoulutusta koskevia säännöksiä pyritään täsmentämään niin, että ammatillisen koulutuksen tilauskoulutusopiskelijoiden oikeusturvasta sovitaan entistä paremmin tilaajien ja koulutuksen järjestäjien välisillä sopimuksilla. Tavoitteena on myös selkeyttää sitä, että koulutuksen järjestäjä ei voi järjestää tilauskoulutusta, jos tilaajalla ei ole aitoa intressiä huolehtia opiskelijoiden oikeusturvasta ja kouluttautumisesta. Tavoitteena on puuttua havaittuihin ongelmiin tilauskoulutuksen järjestämisessä. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esityksen tavoitteena on asettaa lukiokoulutuksen ja ammatillisen koulutuksen järjestäjille velvoite kerätä lukuvuosimaksuja opiskelijoilta, jotka saapuvat opiskelemaan kolmansista maista. Näiden opiskelijoiden kouluttamiseen ei myönnettäisi jatkossa valtionosuusrahoitusta, joten koulutuksesta aiheutuvat kustannukset rahoitettaisiin opiskelijoilta perittävillä lukuvuosimaksuilla. Esityksen tavoitteena on julkisten varojen käytön hallinta sekä kuntien maksutaakan keventäminen. Pääministeri Petteri Orpon hallitusohjelmassa on kiinnitetty huomiota kuntien välisen rahoitusvastuun tasapuoliseen jakautumiseen. Toisin kuin korkeakouluissa, ehdotettaisiin toiselle asteelle lukuvuosimaksuja myös kansalliskielillä toteutettavaan koulutukseen. Suomeen kolmansista maista saapuvat opiskelijat opiskelevat Suomessa pääsääntöisesti kansalliskielillä. Lukiokoulutuksessa kolmansista maista tulevat opiskelijat opiskelevat pelkästään kansallisilla kielillä. Esityksen valtiontaloudellisiin tavoitteisiin ei päästäisi, jos lukuvuosimaksut rajattaisiin vain englannin kielellä tapahtuvaan koulutukseen.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esityksen tavoitteena on laajentaa koulutuksen järjestäjien oikeutta saada tietoa kolmansista maista tulevien henkilöiden oleskelupien tilanteesta ja perusteista. Lisäksi koulutuksen järjestäjille tulisi oikeus ilmoittaa Maahanmuuttovirastolle epäillyistä väärinkäytöksistä.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ehdotukset ja niiden vaikutukset\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Keskeiset ehdotukset\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tilauskoulutus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ammatillisen koulutuksen tilauskoulutusta koskevia säännöksiä muutettaisiin siten, että tilauskoulutukseen voisivat jatkossa osallistua myös Euroopan talousalueeseen kuuluvan valtion kansalaiset ja näihin rinnastettavat henkilöt. Tilauskoulutuksen kohderyhmä laajenisi ja koulutuksen tilaaminen nykyistä monipuolisempiin käyttötarkoituksiin mahdollistuisi. Ratkaisu varmistaisi suomalaisten ja muiden EU- ja ETA-valtion kansalaisten sekä kolmansien maiden kansalaisten yhdenmukaiset mahdollisuudet osallistua tilaajan maksamaan koulutukseen. Ammatillisen koulutuksen järjestäjä ei perisi tilauskoulutusta järjestäessään maksuja opiskelijalta, vaan koulutuksen maksaisi jatkossakin kokonaisuudessaan tilaaja. Esityksessä ehdotetaan, että tilaaja ei voisi periä koulutuksen kustannuksia opiskelijalta, joka on EU- ja ETA-valtion kansalainen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutusta koskevia säännöksiä täsmennettäisiin niin, että tilauskoulutusopiskelijoiden oikeuksista ja velvollisuuksista sovitaan yksityiskohtaisemmin tilaajien ja koulutuksen järjestäjien välisillä sopimuksilla. Lisäksi säädettäisiin koulutuksen järjestäjien velvollisuudesta tiedottaa opiskelijoille heidän oikeuksistaan ja velvollisuuksistaan.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tavoitteena on myös selkeyttää lainsäädäntö siten, että koulutuksen järjestäjä voi järjestää tilauskoulutusta vain silloin, kun tilaajalla on selkeä intressi opiskelijoiden kouluttamiseen ja sen liiketoimintatapa on todettu opiskelijoiden näkökulmasta kestäväksi. Yritys, jonka toiminnan keskeisenä intressinä olisivat sen Suomeen välittämiltään opiskelijoilta keräämät maksut, ei sovellu lain mukaan tilaajaksi. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukuvuosimaksut\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että kolmansista maista tule
