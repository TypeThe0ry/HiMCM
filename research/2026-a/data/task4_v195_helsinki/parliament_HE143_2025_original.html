ville opiskelijoille säädettäisiin lukuvuosimaksuista lukiokoulutuksessa ja ammatillisessa koulutuksessa. Esitys on tarkoitettu tulemaan voimaan 1.8.2026, jolloin se koskisi tuon jälkeen opintonsa aloittavia. Esitys ei koske Euroopan talousalueella vakituisesta asuvia kolmansien maiden kansalaisia eikä vakiintuneiden ohjelmien kautta saapuvia vaihto-opiskelijoita, jotka eivät tule suorittamaan koko tutkintoa tai lukion oppimäärää. Myös tilapäistä suojelua saavat rajattaisiin maksullisuuden ulkopuolelle samaan tapaan kuin korkeakouluissa. Suomeen kolmansista maista pidempiaikaiseen työhön tulevien perheeseen kuuluvat eivät kuuluisi maksullisuuden piiriin, jos heillä olisi ennen opintojen alkua oleskelulupa Suomeen. Oppivelvollisuusikäiset eli alle 18-vuotiaat opiskelijat eivät olisi lukuvuosimaksuvelvollisia. Alle 18-vuotiaat, jotka ovat tulleet Suomeen opiskelijan oleskeluluvalla tarkoituksenaan suorittaa toisen asteen tutkinto, olisivat kuitenkin lukuvuosimaksuvelvollisia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjä ei voisi jatkossa saada valtionosuusrahoitusta lukuvuosimaksullisesta opiskelijasta. Lukuvuosimaksullisessa koulutuksessa ei ole kysymys kilpailluilla markkinoilla tapahtuvasta toiminnasta kuten tilauskoulutuksessa, vaan lukuvuosimaksullista koulutusta toteutetaan osana kansallista koulutusjärjestelmää. Ammatillisesta koulutuksesta annetun lain 28 §:n ja lukiolain 4 §:n mukaan tutkintoja tai koulutusta ei saa järjestää taloudellisen voiton tavoittelemiseksi.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tietojensaanti- ja luovutusoikeus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Lukiolakiin ja lakiin ammatillisesta koulutuksesta lisättäisiin koulutuksen järjestäjille tiedonsaantioikeus niiden tarvitsemista hakijoiden ja opiskelijoiden oleskelulupatiedoista sekä oikeus luovuttaa tietoja oma-aloitteisesti Maahanmuuttovirastolle seikoista, jotka ovat välttämättömiä Maahanmuuttovirastolle säädettyjen tehtävien hoitamiseksi. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oppivelvollisuuslaki\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Oppivelvollisuuslakia muutettaisiin siten, että soveltamisalan ulkopuolelle rajattaisiin kolmansista maista tulevat opiskelijat, jotka oleskelevat Suomessa opiskelutarkoituksessa ja ovat näin ollen lukuvuosimaksuvelvollisia.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Opiskelija- ja tutkijalaki\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Opiskelija- ja tutkijalakia muutettaisiin siten, että oleskeluluvan myöntäminen opiskelua varten edellyttäisi lukuvuosimaksun suorittamista.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Pääasialliset vaikutukset\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Taloudelliset vaikutukset valtioon ja kuntiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Hallitus päätti julkisen talouden suunnitelmassa vuosille 2026–2029 ammatillisen koulutuksen määrärahan alentamisesta vuodelle 2026 10 miljoonalla eurolla ja vuodesta 2027 eteenpäin 15 miljoonalla eurolla kolmansista maista tulevien opiskelijoiden lukuvuosimaksuista saatavan rahoituksen vuoksi. Niin ikään hallitus päätti julkisen talouden suunnitelmassa lukuvuosimaksujen käyttöönoton vuoksi lukiokoulutuksen rahoituksen vähentämisestä vuodelle 2026 2 miljoonalla eurolla ja vuodesta 2027 eteenpäin 3 miljoonalla eurolla. Vähennykset kohdistuvat ammatillisen koulutuksen momentille 29.20.30 ja lukiokoulutuksen momentille 29.20.35.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ammatillisen koulutuksen määräraha muodostuu momentille 29.20.30 päätettävästä valtion rahoitusosuudesta ja erikseen määrättävästä kuntien rahoitusosuudesta. Opetus- ja kulttuuritoimen rahoituksesta annetun lain (1705/2009), jatkossa rahoituslaki, mukaan kuntien rahoitusosuus ammatillisen koulutuksen rahoituksessa on euromäärä, joka saadaan, kun edellä mainitun lain 9 §:n1 momentissa tarkoitettu valtion määräraha kerrotaan luvulla 1,3461, mutta kuitenkin enintään vuoden 2025 tasossa. Vuonna 2026 sovellettavaksi tulee vuoden 2025 taso indeksitarkistettuna, minkä vuoksi 10 miljoonan euron vähennys kohdistuu kokonaisuudessaan valtion rahoitusosuuteen. Mikäli valtion määrärahan tasossa ei tapahdu merkittävää vähennystä vuonna 2027, myös pysyvä rahoituksen vähennys tulee kohdistumaan kokonaisuudessaan valtion rahoitusosuuteen.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen valtionosuusrahoitus momentilla 29.20.35 muodostuu opiskelijamääräarvion ja opiskelijaa kohti määrätyn keskimääräisen yksikköhinnan perusteella. Rahoituslain mukainen kunnan omarahoitusosuus lukiokoulutuksen käyttökustannuksiin vuonna 2026 on 51,59 %. Lukuvuosimaksujen käyttöönoton vuoksi lukiokoulutuksen rahoitukseen tehtävästä vähennyksestä arvioidaan vuonna 2026 kohdistuvan 960 000 euroa valtion rahoitusosuuteen ja 1 040 000 euroa kuntien rahoitusosuuteen. Vuodesta 2027 lähtien vähennyksestä arvioidaan kohdistuvan reilut 1,4 miljoonaa euroa valtion rahoitusosuuteen ja vajaat 1,6 miljoonaa euroa kuntien rahoitusosuuteen.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen järjestäjien rahoitus määräytyy rahoituslain ja valtioneuvoston asetuksen (1766/2009), jäljempänä rahoitusasetus, perusteella. Lukiokoulutuksen valtionosuus myönnetään laskennallisin perustein. Lukiokoulutuksen järjestäjän rahoitus määräytyy opiskelijamäärän ja opiskelijaa kohti määrätyn yksikköhinnan tulon perusteella.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista opiskelemaan tulevien opiskelijoiden siirtyminen valtionosuusrahoituksen ulkopuolelle hillitsisi näistä opiskelijoista johtuvaa opiskelijamäärien lisääntymistä, mikä vähentäisi tarvetta korottaa kuntien ja valtion maksuosuuksia lukiokoulutuksen ja ammatillisen koulutuksen valtionosuusrahoitukseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Jatkossa kolmansista maista tulevia opiskelijoita ei otettaisi huomioon valtionosuusrahoitusta myönnettäessä eivätkä koulutuksen järjestäjät pysty kerryttämään näillä opiskelijoilla julkisen rahoituksen osuuttaan. Koulutuksen järjestäjät kattaisivat ulkomaisista opiskelijoista syntyvät kustannukset opiskelijoilta perittävillä lukuvuosimaksuilla, ja julkinen rahoitus kohdentuisi nykyistä selkeämmin kotimarkkinoilla pysyvästi asuvien kouluttamiseen.&nbsp;Lukiokoulutuksen osalta uudistus vähentäisi kolmansista maista tulevista opiskelijoista johtuvaa kuntien ja valtion maksuosuuden kasvua. Ammatillisessa koulutuksessa uudistus puolestaan kohdentaisi määrärahan maassa vakituisesti asuvan väestön koulutustarpeisiin. Ulkomaisten osaajien houkuttelu Suomeen on ollut tavoitteena pitkään. Kustannuksia korvaava lukuvuosimaksu lieventäisi taloudellista riskiä, jonka aiheuttaa julkisten varojen käyttäminen henkilöihin, joiden maahan jääminen ja työllistyminen on epävarmaa.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset ammatillisen koulutuksen järjestäjiin \u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Tilauskoulutusta koskevat muutokset\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan muutoksia ammatillisen koulutuksen tilauskoulutusta koskeviin säännöksiin. Esityksessä ehdotetaan täsmennyksiä koulutuksen järjestäjien velvollisuuksiin järjestettäessä tilauskoulutusta. Jatkossa koulutuksen järjestäjien ei olisi mahdollista myydä tilauskoulutusta tilaajalle, jonka rooli on koota yksittäisistä opiskelijoista tilauskoulutusryhmä. Koulutuksen järjestäjän tulisi varmistaa, että tilaajalla on itsellään jokin intressi ostaa tilauskoulutusta, ja että koulutuksen tilaaja on myös koulutuksen maksaja. Jatkossa kunnan tai kuntayhtymän perustama yhtiö ei voisi myöskään toimia tilauskoulutuksen tilaajana, ellei sillä ole tosiasiallista intressiä hankkia tilauskoulutusta tietylle opiskelijaryhmälle. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotettu muutos tilauskoulutuksen avaamisesta EU- ja ETA-kansalaisille vähentäisi koulutuksen järjestäjien työmäärää, sillä koulutuksen järjestäjän ei tarvitsisi enää tarkistaa ovatko tilauskoulutuksen osallistujat lain tarkoittamalla tavalla kolmansista maista tulevia henkilöitä. Koulutuksen järjestäjän ei tarvitsisi myöskään selvittää osallistujien mahdollisia sukulaisuussuhteita EU- ja ETA-valtioiden kansalaisiin, kuten voimassa ollut lainsäädäntö on edellyttänyt. Ehdotettu muutos mahdollistaisi koulutuksen järjestäjille myös laajemmat mahdollisuudet järjestää tilauskoulutusta omalla toiminta-alueellaan yritysten tarpeisiin. Ehdotettu muutos mahdollistaisi myös tilauskoulutuksen myymisen Ahvenanmaalle.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen järjestäminen olisi jatkossakin vapaaehtoista, ja sen järjestäminen olisi edelleen koulutuksen järjestäjän harkinnassa. Tilauskoulutuksen järjestäminen ei voi jatkossakaan heikentää koulutuksen järjestäjän antamaa tutkintokoulutusta, joten koulutuksen järjestäjän on huolehdittava, että sillä on riittävät resurssit ja henkilöstö tilauskoulutusta varten. Ehdotuksilla ei siten ole heikentäviä vaikutuksia koulutuksen järjestäjien perustehtävien hoitamiseen ja opetuksen ja palveluiden laatuun. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen järjestäminen voi laajentaa koulutuksen järjestäjän rahoituspohjaa. Tämä mahdollistaa opetus- ja kulttuuriministeriön myöntämää ammatillisen koulutuksen rahoitusta laajemmat resurssit koulutuksen järjestäjän varsinaiselle toiminnalle mukaan lukien tutkintokoulutus, tutkintokoulutukseen valmentava -koulutus sekä investoinnit tarvittaviin oppimisympäristöihin.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Lukuvuosimaksut\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja kolmansista maista tuleville opiskelijoille. Ammatillisen koulutuksen rahoitus on budjettiperusteista ja suhteellista. Opetus- ja kulttuuriministeriö myöntää koulutuksen järjestäjälle rahoituksen perustuen 24 kuukauden tarkastelujaksona kertyneisiin koulutuksen järjestäjän suoritteisiin 1.1.2026 voimaan tulevan rahoitusmallin mukaisesti. Yksittäisen koulutuksen järjestäjän saama rahoitus riippuu muiden koulutuksen järjestäjien suoritteista kussakin rahoitusmallin indikaattorissa. Yhden koulutuksen järjestäjän rahoituksen lisääntyminen edellyttää rahoituksen siirtymistä rahoitusmallin mukaisesti koulutuksen järjestäjien välillä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esitetyillä muutoksilla ei ole vaikutusta niiden koulutuksen järjestäjien asemaan, jotka eivät ole järjestäneet tilauskoulutusta. Lukuvuosimaksujen käyttöönoton vaikutus niille koulutuksen järjestäjille, jotka eivät ole ottaneet kolmansien maiden kansalaisia opiskelijoiksi, vaikutus on myönteinen. Kun nämä opiskelijat poistuvat valtionosuusrahoituksen piiristä, kohdistuu ammatillisen koulutuksen rahoitus Suomessa vakituisesti asuvan väestön koulutukseen rahoitusmallin mukaisesti. Mahdollisuus järjestää tilauskoulutusta EU- ja ETA-kansalaisille ja mahdollisuus kerätä lukuvuosimaksuja voi vähentää myös tarvetta tilauskoulutuksen järjestämiseen tytär- tai osaomistusyhtiöiden kautta, mikä yksinkertaistaa toiminnan järjestämistä.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukuvuosimaksujen periminen lisää jonkin verran koulutuksen järjestäjien työmäärää. Koulutuksen järjestäjien on selvitettävä ulkomaalaisten opiskelijoiden kohdalla, onko opiskelija lukuvuosimaksuvelvollinen vai vapautettu siitä. Helpoimmillaan lukuvuosimaksuvelvollisuuden selvittäminen selviää tarkastamalla opiskelijan oleskelulupakortti. Joissakin tilanteissa lukuvuosimaksuvelvollisuuden selvittäminen edellyttää opiskelijan ja hänen perheenkokoajansa oleskelulupahistorian tarkistamista Maahanmuuttovirastosta. Lisäksi koulutuksen järjestäjän on perittävä maksut ja seurattava, että opetukseen osallistuu ainoastaan sellaiset lukuvuosimaksuvelvolliset opiskelijat, jotka ovat suorittaneet lukuvuosimaksunsa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Oppisopimuskoulutuksen arvioidaan jonkin verran lisääntyvän, sillä työperäisellä oleskeluluvalla oppisopimuskoulutukseen tulevat henkilöt eivät olisi lukuvuosimaksuvelvollisia. Koulutuksen järjestäjille ei syntyisi lukuvuosimaksujen perimiseen liittyvää hallinnollista työtä, joskin oppisopimuskoulutuksesta sopiminen lisääntyisi. Sitä olisi mahdollista sujuvoittaa, esimerkiksi sopimalla oppisopimuskoulutuksesta suoraan opiskelijan tosiasiallisen työnantajan kanssa vuokratyönantajan sijasta. Vuokratyönantajien käyttö on yleistä erityisesti sosiaali- ja terveysalalla. Tällöin oppisopimuskoulutuksen edellytysten varmistaminen, henkilökohtaisen osaamisen kehittämissuunnitelman laatiminen ja päivittäminen sekä mahdolliset muutokset oppisopimukseen tai oppisopimuskoulutuksen järjestämistä koskevaan sopimukseen voidaan sopia suoraan tosiasiallisen työnantajan ja työpaikan kanssa, ilman välissä olevaa vuokratyönantajaa, joka toimii vain juridisena työnantajana.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Tietojen vaihtamista koskevat säännökset\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan koulutuksen järjestäjille tiedonsaantioikeutta Maahanmuuttoviraston tiettyihin oleskelua koskeviin tietoihin lukuvuosimaksujen keräämistä varten. Hakijoiden ja opiskelijoiden oleskelulupatietojen selvittäminen kasvattaisi koulutuksen järjestäjien työmäärää jonkin verran. Tarvittavien tietojen selvittämisessä hyödynnettäisiin mahdollisimman laajalti automatisointia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Oppivelvollisuuslain muutokset\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Oppivelvollisuuslain soveltamisalaa ehdotetaan muutettavan siten, etteivät Suomessa opiskelutarkoituksessa olevat kolmannen maan kansalaiset olisi oppivelvollisia ja näin ollen oikeutettuja maksuttomaan koulutukseen. Koulutuksen järjestäjien olisi selvitettävä kolmannesta maasta kotoisin olevan henkilön oleskelulupastatus. Suomessa jo oleskelevien henkilöiden osalta lukuvuosimaksuvelvollisuuden selvittäminen selviäisi helpoimmillaan tarkastamalla opiskelijan oleskelulupakortti.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset lukiokoulutuksen järjestäjiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja kolmansista maista tuleville opiskelijoille. Esityksellä ei arvioida olevan merkittäviä vaikutuksia niille lukiokoulutuksen järjestäjille, joilla ei juurikaan ole kolmansista maista tulevia opiskelijoita. Sen sijaan esityksellä voi olla merkittäviä vaikutuksia niille lukiokoulutuksen järjestäjille, joiden opiskelijoista merkittävä osa muodostuu nykyisin kolmansista maista tulevista opiskelijoista. Nämä ovat usein kuntia, jotka sijaitsevat syrjäisillä alueilla tai joiden asukasmäärä on pieni. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmansista maista tulevien opiskelijoiden määrä vaihtelee lukiokohtaisesti. Yksittäisissä lukioissa määrä voi olla jopa 60-70 prosenttia kaikista opiskelijoista. Tällaiselle koulutuksen järjestäjälle vaikutukset oivat olla merkittäviä, mikäli koulutuksen järjestäjä ei lukuvuosimaksujen käyttöönoton jälkeen saa opiskelijoikseen lukuvuosimaksullisia opiskelijoita. On kuitenkin huomioitava, että lukio-opiskelijoiden rekrytoiminen kolmansista maista on uusi, 2020-luvulla syntynyt ilmiö yhtä poikkeusta lukuun ottamatta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriön kyselyn mukaan kyselyyn vastanneista lukiokoulutuksen järjestäjistä 72 ilmoitti, että heillä oli kolmansista maista tulleita opiskelijoita. Heistä 34 vastaajaa ilmoitti markkinoivansa koulutusta kolmansissa maissa. Kyselyn mukaan opiskelijaksi hakeutuneista valittiin vuonna 2023 keskimäärin neljä opiskelijaa ja vuonna 2024 keskimäärin viisi opiskelijaa. Maahanmuuttovirastolta saatujen tilastojen mukaan ylioppilastutkinnon suorittamista varten ensimmäisiä oleskelulupia on myönnetty vuonna 2023 vähintään 289 oleskelulupaa ja vuonna 2024 vähintään 302 oleskelulupaa. Näiden tietojen perusteella voidaan karkeasti arvioida, että Suomessa on noin 1000 lukio-opintoja suorittavaa kolmannen maan kansalaista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Jatkossa lukiokoulutuksen järjestäjän rahoitus muodostuisi valtionosuusrahoituksesta, johon vaikuttavat koulutuksen järjestäjäkohtainen yksikköhinta ja opiskelijamäärä sekä lukuvuosimaksutuotoista, mikäli koulutuksen järjestäjällä olisi kolmansista maista tulevia opiskelijoita. Koska lukuvuosimaksuvelvollisia opiskelijoita ei saisi ilmoittaa valtionosuusrahoituksen perusteeksi, ei heitä myöskään huomioitaisi koulutuksen järjestäjäkohtaista yksikköhintaa määritettäessä. Jos tämä tarkoittaisi koulutuksen järjestäjän valtionosuusrahoituksen piirissä olevien opiskelijoiden määrän pienentymistä, korottaisi se yksikköhintaa koulutuksen järjestäjällä, jonka opiskelijamäärä on alle 200.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukuvuosivelvollisia opiskelijoita ei saisi ilmoittaa valtionosuusrahoituksen perusteeksi. Mikäli lukiokoulutuksen järjestäjän päättämät lukuvuosimaksut olisivat pienempiä kuin valtionosuusrahoitus vastaavaan koulutukseen, koulutuksen järjestäjän saama kokonaisrahoitus vähenisi. Vastaavasti lukiokoulutuksen järjestäjän saama kokonaisrahoitus kasvaisi, mikäli koulutuksen järjestäjän päättämät lukuvuosimaksut olisivat suurempia kuin tähän koulutukseen kohdistuva valtionosuusrahoitus on. On kuitenkin huomioitava, että lukiolain mukaan lukiokoulutusta ei voi järjestää taloudellisen voiton tavoittelemiseksi. Tarkoitus on, että koulutuksen järjestäjän päättäessä lukukausimaksun suuruudesta otettaisiin huomioon lukuvuosimaksullisen koulutuksen järjestämisestä aiheutuvat kustannukset. Sellaisen lukiokoulutuksen järjestäjän, jonka opiskelijamäärät ovat riippuvaisi ulkomailta tulevista opiskelijoista, saama kokonaisrahoitus voisi vähentyä myös, mikäli ulkomailta koulutukseen hakeutuminen vähenee. Tällä hetkellä kolmansista maista tulleet opiskelijat pysyisivät valtionosuusrahoituksen perusteena opintojensa loppuun asti.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansainvälisten opiskelijoiden hakeutuminen lukiokoulutukseen on uusi ilmiö ja heidän osuutensa lukiokoulutuksen opiskelijoista on kokonaisuudessaan vähäinen, vaikka hakeutuminen on ollut kasvussa. Yksittäisen koulutuksen järjestäjän rahoituksessa kolmansista maista tulleiden opiskelijoiden vaikutus koulutuksen järjestäjän talouteen on voinut olla merkittävä opiskelijamäärään perustuvan lukiokoulutuksen valtionosuusrahoituksen vuoksi. Vastaavasti tästä on aiheutunut laskennallisia kustannuksia kaikille kunnille, jotka yhteisvastuullisesti osallistuvat lukiokoulutuksen valtionosuuden kuntarahoitusosuuteen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">On esitetty, että alueiden elinvoiman, lukiokoulutuksen saavutettavuuden ja perusopetuksen monipuolisuuden varmistamiseksi ulkomaisten opiskelijoiden kouluttamista suomalaisessa lukiokoulutuksessa pitäisi tukea julkisin varoin ja toiminta pitäisi mahdollistaa myös jatkossa. Pienemmillä paikkakunnilla ja syrjäisemmillä seuduilla asuvilla nuorilla on oikeus lukiokoulutukseen, jotta kansalaisten sivistykselliset oikeudet voidaan turvata koko maassa. Opiskelijamäärältään pienten lukioiden rahoitusta koskevia säännöksiä muutettiin joulukuussa 2024, kun eduskunta hyväksyi opetus- ja kulttuuritoimen rahoituslain muutoksen, joka vaikuttaa lukiokoulutuksen rahoitusperusteisiin. Muutoksella vahvistettiin syrjäisillä seuduilla sijaitsevien opiskelijamäärältään pienimpien koulutuksen järjestäjien rahoituksellista asemaa. Opiskelijamäärällä on vaikutus lukiokoulutuksen yksikköhintaan siten, että yksikköhinta nousee opiskelijamäärän vähentyessä. Tämänkaltaisella rahoitustavalla pyritään turvaamaan väestöltään vähäisten syrjäisten seutujen lukioita, joiden opiskelijamäärät ovat pieniä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen järjestäminen on kunnille vapaaehtoista ja oikeus järjestää lukiokoulutusta perustuu opetus- ja kulttuuriministeriön järjestämislupaan. Esi- ja perusopetuksen järjestäminen on sen sijaan kunnan velvollisuus. Esi- ja perusopetus rahoitetaan pääasiallisesti osana kuntien peruspalveluiden valtionosuuksia, eikä rahoitus ole koulukohtaista. Pääasiallisena laskentatekijänä ovat kunnan asukasmäärä ja ikärakenne. Peruspalveluiden valtionosuuksiin sisältyy myös laskennallisia kriteereitä, joissa kunta saa rahoitusta muun muassa asukastiheyteen, syrjäisyyteen tai saaristoisuuteen perustuen. Lopullinen kunnan valtionosuus tasataan verotulojen perusteella siten, että verokertymissä hyvin pärjäävät kunnat maksavat osan laskennallisista valtionosuuksistaan heikommin pärjääville. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Pienissä kunnissa, joissa järjestetään perusopetuksen lisäksi myös lukiokoulutusta, on usein tarkoituksenmukaista, että samat aineopettajat opettavat sekä perusopetuksessa että lukiossa. Näin taataan opettajille riittävä määrä työtunteja ja mahdollistetaan oppilaille ja opiskelijoille monipuolisempi koulutustarjonta. Opetus- ja kulttuuriministeriö selvitti rekisteriaineistojen, erityisesti tulorekisterin, avulla sekä yläkoulussa että lukiossa opettavien opettajien määrää Suomessa. Vuoden 2022 lopussa noin 900 opettajaa työskenteli sekä yläkoulussa että lukiossa. Tämä vastaa noin neljää prosenttia kaikista yläkoulun ja lukion opettajista. Opettajien todennäköisyys opettaa molemmilla koulutusasteilla on yleisempää pienemmillä paikkakunnilla ja maaseutumaisissa kunnissa. Kohderyhmän tunnistaminen käytetyistä rekisteriaineistoista ei ole välttämättä täysin luotettavaa, ja riippuu kuntien kirjaus- ja palkanmaksukäytännöistä sekä työn järjestämisen tavoista. Mikäli joissain kunnissa lukiokoulutus vähenisi tai loppuisi kokonaan, vaikuttaisi se näissä kunnissa opettajien työtilanteeseen myös perusopetuksessa. On kuitenkin mahdollista kehittää eri kunnissa toimivien oppilaitosten välistä yhteistyötä esimerkiksi opetushenkilöstön työpanoksen jakamisessa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vaikka perusopetuksen monipuolisuuden turvaaminen ja alueiden elinvoiman parantaminen ovat tärkeitä tavoitteita kunnissa, tavoite tulisi pyrkiä saavuttamaan muilla tavoin kuin lukiokoulutuksen opiskelijamäärää lisäämällä kolmansista maista tuoduilla lapsilla. Lapset saapuvat pääsääntöisesti ilman vanhempia tai laillista huoltajaa, jolloin lasten oikeuksien ja edun toteutuminen riippuu ulkopuolisista tekijöistä, mikä voi altistaa lapsen tämän kehitykselle haitallisiin tilanteisiin. Asiaa käsitellään laajemmin kappaleessa 4.2.10 Vaikutukset lapsiin ja oppivelvollisiin. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukuvuosimaksuja koskevalla esityksellä voi olla vaikutuksia pienissä ja syrjäisissä kunnissa perusopetuksessa tai lukiokoulutuksessa opiskeleviin lapsiin ja oppivelvollisiin, mikäli kuntien opiskelijamäärät vähenevät ja kunnat päättävät tästä syystä vähentää oppiainetarjontaansa. Suomessa asuvien lasten sivistyksellisten oikeuksien toteutumisen näkökulmasta ei kuitenkaan voida katsoa suositeltavaksi, että lukiokoulutuksen opiskelijamäärää lisätään laajamittaisesti kolmansista maista tulevilla lapsilla. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriö on asettanut työryhmän valmistelemaan ratkaisuesityksiä väestökehityksen tuomiin haasteisiin perusopetuksen järjestämisessä. Työryhmän toimikausi on 1.3.2024–31.12.2025. Työryhmän tehtävänä on laatia hallitusohjelman kirjausten pohjalta strateginen näkemys perusopetuksen järjestämiseen liittyvän kehittämisen suunnasta lapsen oikeuksien toteutumisen vahvistamiseksi. Työryhmä valmistelee ehdotuksen opetuksen järjestäjien keskinäisen yhteistyön vahvistamisesta, koulutuksen saavutettavuuden varmistamisesta, perusopetuksen järjestämiseen liittyvistä kriteereistä, perusopetuksen laatukriteereiden uudistamisesta, tarvittavan tietopohjan kehittämisestä sekä muista tarpeellisista uudistuksista. Työryhmän tehtävänä on valmistella esitys koulutusjärjestelmän, lainsäädännön sekä rahoituksen kehittämiseksi vastaamaan väestökehityksen aiheuttamiin haasteisiin. Lisäksi työryhmän tehtävä on laatia hallitusohjelman mukaisesti arvio etäopetuksen hyödyntämisen mahdollisuuksista perusopetuksessa tarkkarajaisesti säädettynä esimerkiksi valinnaisten kielten opetuksessa sekä muista innovatiivisista tavoista järjestää perusopetusta ottaen huomioon lapsen oikeudet ja edun ensisijaisuus. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukuvuosimaksujen periminen lisäisi jonkin verran koulutuksen järjestäjien työmäärää. Koulutuksen järjestäjien on selvitettävä ulkomaalaisten opiskelijoiden kohdalla, onko opiskelija lukuvuosimaksuvelvollinen. Valtaosa lukiokoulutuksessa opiskelevista kolmansista maista tulevista opiskelijoista hakeutuu opiskelemaan Suomeen suoraan ulkomailta, jolloin lukuvuosimaksuvelvollisuuden selvittäminen ei vaatisi koulutuksen järjestäjältä työtä tilanteen ollessa olosuhteiden perusteella selvä. Suomessa jo oleskelevien henkilöiden osalta lukuvuosimaksuvelvollisuuden selvittäminen selviäisi helpoimmillaan tarkastamalla opiskelijan oleskelulupakortti. Koulutuksen järjestäjän olisi lisäksi perittävä lukuvuosimaksut lukuvuosimaksuvelvollisilta opiskelijoilta ja seurattava, että opetukseen osallistuisi ainoastaan sellaiset lukuvuosimaksuvelvolliset opiskelijat, jotka ovat suorittaneet lukuvuosimaksunsa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan koulutuksen järjestäjille tiedonsaantioikeutta Maahanmuuttoviraston tiettyihin oleskelua koskeviin tietoihin lukuvuosimaksujen keräämistä varten. Hakijoiden ja opiskelijoiden oleskelulupatietojen selvittäminen kasvattaisi koulutuksen järjestäjien työmäärää jonkin verran. Tarvittavien tietojen selvittämisessä hyödynnettäisiin mahdollisimman laajalti automatisointia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Oppivelvollisuuslain soveltamisalaa ehdotetaan muutettavan siten, etteivät Suomessa opiskelutarkoituksessa olevat kolmannen maan kansalaiset olisi oppivelvollisia ja näin ollen oikeutettuja maksuttomaan koulutukseen. Koulutuksen järjestäjien olisi selvitettävä kolmannesta maasta kotoisin olevan henkilön oleskelulupastatus, mistä voi aiheutua koulutuksen järjestäjälle jonkin verran lisää työtä. Suomessa jo oleskelevien henkilöiden osalta lukuvuosimaksuvelvollisuuden selvittäminen selviäisi helpoimmillaan tarkastamalla opiskelijan oleskelulupakortti.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset muihin viranomaisiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston tulisi huolehtia tarpeellisesta tietojärjestelmäkehityksestä liittyen koulutuksen järjestäjille säädettävään tietojensaantioikeuteen opiskelijoiden oleskelulupahistorian ja –tietojen selvittämiseksi. Myöhemmin tietopyyntö automatisoidaan, jolloin tarvittavat tiedot siirtyvät koulutuksen järjestäjille ilman manuaalista työtä Maahanmuuttovirastossa. Maahanmuuttoviraston tietojärjestelmän kehittäminen koskien opiskelijoiden oleskelulupahistorian ja –tietojen selvittämistä katetaan Maahanmuuttovirastolle osoitetun määrärahakehyksen puitteissa. Tietojen luovutusvelvollisuutta koulutuksen järjestäjältä Maahanmuuttovirastolle ei toteutettaisi sähköisen käyttöyhteyden kautta, vaan koulutuksen järjestäjät toimittaisivat tietoja esimerkiksi turvasähköpostilla Maahanmuuttovirastolle. Tietojen luovuttamisesta ei aiheudu näin ollen järjestelmämuutoskustannuksia. Koulutuksen järjestäjien toimittamien tietojen käsittely voi aiheuttaa lisätyötä Maahanmuuttovirastossa, mutta suuri osa toimitettavasta tiedosta johtaisi joka tapauksessa oleskelulupaharkintaan jälkivalvontavaiheessa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetushallituksen olisi jatkossa tuotettava kustannuslaskelmia ammatillisen koulutuksen järjestäjien lukuvuosimaksujen laskemisen tueksi. Työmäärän kasvun arvioidaan kuitenkin olevan vähäistä, sillä Opetushallitus seuraa säännöllisesti ammatillisen koulutuksen kustannuksia. Lukuvuosimaksuja koskeva muutos edellyttää Opetushallitukselta myös kattavaa tiedotusta Opintopolku-palvelussa, mikä aiheuttaa jonkin verran työtä Opetushallitukselle.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset elinkeinoihin ja yrityksiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ehdotettu muutos tilauskoulutuksen avaamisesta EU- ja ETA-kansalaisille mahdollistaisi työnantajalle oman työvoiman osaamisen kehittämisen ja sillä olisi myönteisiä vaikutuksia osaavan työvoiman saatavuuteen. Se lisäisi työnantajan mahdollisuuksia kouluttaa henkilöstöä muutostilanteissa ja hankkia osaavaa työvoimaa. Tämä antaisi työnantajalle mahdollisuuden vastata rakennemuutoksiin henkilöstön osaamista uudistamalla ja kehittämällä. Muutos edistäisi myös kansallisen koulutustason nousua ja tukisi jatkuvaa oppimista. Lisäksi se parantaisi ammatillisen koulutuksen saatavuutta. Koulutuksen järjestäjille syntyisi taloudellinen kannuste tiivistää yhteistyötä toiminta-alueensa työnantajien kanssa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotetun säädösmuutoksen voidaan arvioida lisäävän työnantajien kustantamaa tutkintoon johtavaa koulutusta etenkin tilanteissa, joissa työntekijöitä on tarpeen kouluttaa uusiin tehtäviin. Tällainen koulutus on nykytilanteessa jäänyt toteutumatta, jos työntekijä on ollut EU- ja ETA-valtion kansallinen. Tilauskoulutus mahdollistaisi yritysten ja muiden yhteisöjen tarpeista lähtevät osaamisen kehittämisen myös ammatillisten tutkintojen ja tutkinnon osien osalta.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutuksen työllisyyteen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan ammatillisen koulutuksen tilauskoulutuksen laajentamista siten, että myös EU- ja ETA-valtioiden kansalaiset voivat osallistua tilauskoulutukseen osana ryhmää. Muutoksella arvioidaan olevan positiivisia vaikutuksia työllisyyteen, sillä yritykset voivat ostaa työntekijöilleen tarvitsemiaan koulutuksia koulutuksen järjestäjän kanssa sopimallaan tavalla.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja EU- ja ETA-valtioista tuleville opiskelijoille. Ammatillisessa koulutuksessa työperusteisella oleskeluluvalla oppisopimuskoulutukseen saapuvat opiskelijat eivät olisi lukuvuosimaksuvelvollisia ja oppisopimuskoulutukseen siirtyvälle tai tutkinto-opintoja osin oppisopimuksella suorittavalla lukuvuosimaksut voisivat koulutuksen järjestäjän päätöksen mukaisesti olla jonkin verran alemmat kuin muissa oppimisympäristöissä toteutetussa opetuksessa. Oppisopimuskoulutukseen tullaan työntekijän oleskeluluvalla silloin, kun oppisopimuskoulutus muodostaa ajallisesti vähintään puolet tutkinnosta, ja muissa tapauksissa opiskelijan oleskeluluvalla. Esitetyn sääntelyratkaisun arvioidaan mahdollisesti lisäävän oppisopimuskoulutusta työvoimapula-aloilla. Lisäksi ehdotuksen arvioidaan lisäävän koulutustarjonnan suuntaamista työvoimapulasta kärsiville aloille, mikä parantaa valmistuneiden sijoittumista Suomen työmarkkinoille opintojen jälkeen. EU- ja ETA-valtioista tulevien opiskelijoiden määrän arvioidaan vähenevän niillä aloilla, joilta on vaikea työllistyä tai joille ei ole saatavissa saatavuusharkintaan perustuvaa työntekijän oleskelulupaa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutukseen pääsääntöisesti alaikäisenä saapuneiden opiskelijoiden jäämisestä Suomeen esimerkiksi jatko-opintoihin tai työllistymisestä opintojen jälkeen ei ole mahdollista tehdä luotettavia ennusteita. Lukiokoulutuksen tarkoituksena on siirtyä opiskelemaan pääsääntöisesti korkea-asteelle. Työelämään siirrytään vasta korkeakouluopintojen jälkeen. Etukäteen ei ole mahdollista ennustaa, jäävätkö opiskelijat Suomeen suorittamaan korkeakouluopintoja. Etukäteen ei myöskään ole mahdollista ennakoida, työllistyvätkö opiskelijat mahdollisten korkeakouluopintojen jälkeen Suomeen. Suomalainen ylioppilastutkintotodistus on arvostettu tutkintotodistus myös Suomen rajojen ulkopuolella, ja se mahdollistaa jatko-opinnot myös muualla Euroopassa ja maailmalla. Niin ikään suomalainen korkeakoulututkinto on arvostettu muualla Euroopassa ja maailmalla, ja se mahdollistaa työskentelyn myös Suomen ulkopuolella.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset hakijoihin ja opiskelijoihin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan ammatillisen koulutuksen tilauskoulutuksen laajentamista siten, että myös EU- ja ETA-valtioiden kansalaiset voivat osallistua tilauskoulutukseen osana ryhmää. Tilauskoulutusmahdollisuuden avaaminen myös EU- ja ETA-valtioiden kansalaisille toisi suomalaisille, eurooppalaisille ja ns. kolmannen maan kansalaisille yhdenvertaiset mahdollisuudet osallistua tilaajan maksamaan tilauskoulutukseen. Ehdotus ei heikentäisi koulutuksen järjestäjien muussa maksuttomassa tutkintokoulutuksessa opiskelevien asemaa. EU- ja ETA-valtioiden kansalaisilta taikka Suomessa vakituisesti asuvilta EU- ja ETA-valtioiden kansalaisilta ei voisi peritä maksuja tilauskoulutukseen osallistumisesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että ammatillisen koulutuksen tilauskoulutusta koskevia säännöksiä muutetaan siten, että tilauskoulutusopiskelijoiden oikeuksista ja velvollisuuksista sovitaan entistä paremmin tilaajien ja koulutuksen järjestäjien välisillä sopimuksilla. Lisäksi säädetään koulutuksen järjestäjien velvollisuudesta tiedottaa opiskelijoille heidän oikeuksistaan ja velvollisuuksistaan. Muutosehdotus parantaisi tilauskoulutusopiskelijoiden oikeusturvaa ja vähentäisi väärinkäytösten mahdollisuutta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja toiselle asteelle opiskelemaan tuleville kolmansista maista tuleville opiskelijoille. Lukuvuosimaksut lisäisivät kolmansista maista tulevien opiskelijoiden kustannuksia, sillä aikaisemmin opiskelu Suomessa toisella asteella on ollut maksutonta myös kolmansista maista tuleville henkilöille. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukuvuosimaksut tarkoittaisivat, että kaikki kolmansista maista Suomeen erityisesti ammatilliseen koulutukseen opiskelutarkoituksessa saapuvat opiskelijat olisivat koulutuksen maksullisuuden suhteen yhdenvertaisessa asemassa. Nyt osalla opiskelijaksi valittavista on ollut mahdollisuus tulla Suomeen maksuttomaan, valtionosuudella rahoitettuun koulutukseen, mutta osa on joutunut maksamaan koulutuksestaan osallistuessaan tilauskoulutukseen. Opiskelijoiden on ollut vaikea hahmottaa, miksi osa opiskelijoista opiskelee maksuttomassa koulutuksessa, ja miksi osa opiskelijoista joutuu maksamaan tilauskoulutukseen osallistumisesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukuvuosimaksuja koskevalla esityksellä ei ole vaikutuksia lukiokoulutuksessa tai ammatillisessa koulutuksessa opiskeleviin Suomessa vakituisesti oleskeleviin kolmansien maiden kansalaisiin. Esityksellä ei myöskään ole vaikutuksia opintonsa ennen lain voimaantuloa aloittaneisiin kolmansien maiden kansalaisiin. Esitys lukuvuosimaksuista ei koske Suomessa vakituisesti asuvia kolmansien maiden kansalaisia. Esitys koskee ehdotetun sääntelyn voimaan tulon jälkeen opintonsa aloittavia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan tiedonsaantioikeuksia Maahanmuuttoviraston ja toisen asteen koulutuksen järjestäjien välillä. Koulutuksen järjestäjän tiedonsaantioikeutta koskeva muutos vaikuttaa opiskelijoiden tietosuojaan ja yksityisyyden suojaan siten, että opiskelijalla ei ole mahdollisuutta estää koulutuksen järjestäjää saamasta Maahanmuuttovirastolta tarpeellisia tietoja, koska tietoja käsitellään lakiin perustuen. Luovutettavat tiedot sisältäisivät vain tietoja oleskeluoikeutta osoittavan asiakirjan voimassaolosta, perusteesta ja lajista, eivät hakemusasiakirjoista tai päätöksen perusteluista. Tietoja on mahdollista saada vain lukuvuosimaksuvelvollisuuden arvioimista ja opintojen suunnittelemista varten. Opiskelijan perheenkokoajan lupahistoriaa on tarpeen tarkastella niissä tilanteissa, kun se on lukuvuosimaksuttomuuden perusteena. Mikäli opiskelijan perheenkokoaja ei halua, että hänen oleskelulupahistoriaansa tarkastellaan, opiskelija voi olla hakematta vapautusta lukuvuosimaksusta. Ehdotetut säännökset turvaavat opiskelijan ja perheenkokoajan henkilötietojen suojan vaatimukset tietosuoja-asetuksen edellyttämällä tavalla, kuten myös yksityisyyden suojan. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset ulkomaalaisten opiskelijoiden ja työntekijöiden määrään\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja toiselle asteelle opiskelemaan tuleville kolmansista maista tuleville opiskelijoille. Lukuvuosimaksuvelvollisuuden arvioidaan vähentävän halukkuutta tulla opiskelemaan Suomeen kolmansista maista. Vähentävää vaikutusta voi kuitenkin kompensoida se, jos alueellisesti otetaan käyttöön esimerkiksi apuraha- tai stipendijärjestelyitä. Vaikutuksen arvioidaan olevan suurempi lukiokoulutuksessa, johon pääsääntöisesti tullaan alaikäisenä, ja jota on markkinoitu kolmansissa maissa nimenomaan koulutuksen maksuttomuudella. Maailmalla on yleistä, että kansainväliset opiskelijat ja myös oman maan kansalaiset joutuvat maksamaan jo toisen asteen koulutuksesta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">On esitetty, että lukiokoulutuksen muuttuessa maksulliseksi kolmansista maista ei enää hakeuduttaisi Suomeen vaan muihin maihin. Suomen heikkoutena kilpailutilanteessa on suomenkielinen koulutustarjonta, joka edellyttää kieliopintoja. Monessa ns. kilpailijamaassa koulutustarjonta olisi englanninkielistä. Maksuttomuutta lukuun ottamatta Suomeen vahvuuksina esitetyt koulutuksen laatu sekä Suomessa elämiseen liittyvät seikat eivät muuttuisi.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Korkeakouluissa lukuvuosimaksuja alettiin periä 1.8.2017 jälkeen aloittaneilta opiskelijoilta. Korkeakoulujen lukuvuosimaksujen käyttöönoton seuranta- ja arviointityöryhmän loppuraportissa (Opetus- ja kulttuuriministeriön julkaisuja 2022:3) on todettu, ettei lukuvuosimaksujen käyttöönotolla ole ollut pitkäaikaisia haitallisia vaikutuksia korkeakoulujen kansainvälistymiseen tai kolmansista maista tulevien opiskelijoiden halukkuuteen opiskella suomalaisissa korkeakouluissa. Vaikka ulkomaalaisten opiskelijoiden määrät putosivat välittömästi maksujen käyttöönoton jälkeen, hakijoiden ja uusien opiskelijoiden määrät kääntyivät nopeasti kasvuun. Täten pysyvää lovea kansainvälisten opiskelijoiden määrään ei ole syntynyt. Suomen maine korkeatasoisen koulutuksen maana on edelleen tärkeä vetovoimatekijä. Tarkempia tietoja 1.8.2026 voimaan tulevien korkeakoulujen täysikatteisten lukuvuosimaksujen vaikutuksesta opiskelijamääriin ei ole vielä tiedossa. Maahanmuuttoviraston tilastojen mukaan opiskelijoiden oleskelulupien hakumäärät kasvoivat vuodesta 2023 vuoteen 2024 yhteensä kymmenellä prosentilla.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ammatillisessa koulutuksessa vaikutuksen opiskelijamääriin arvioidaan olevan vähäisempi erityisesti osaajapula-aloilla, jonne tullaan opiskelemaan myös työntekijän oleskeluluvalla oppisopimuskoulutukseen, jolloin opiskelija ei olisi lukuvuosimaksuvelvollinen. Ammatillista koulutusta järjestetään tällä hetkellä maksullisesti tilauskoulutuksena, joten henkilöitä, jotka ovat halukkaita maksamaan ammatillisesta koulutuksestaan Suomessa, löytyy jo tällä hetkellä. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset lapsiin ja oppivelvollisiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja toisen asteen opiskelijoille, jotka tulevat kolmansista maista. Esitys koskisi myös alaikäisiä, oppivelvollisia henkilöitä, jotka ovat tulleet Suomeen opiskelutarkoituksessa. Jatkossa Suomeen opiskelutarkoituksessa tulleet kolmansien maiden kansalaiset olisivat lukuvuosimaksuvelvollisia iästä riippumatta. Sen sijaan esitys ei koskisi niitä alaikäisiä, oppivelvollisia henkilöitä, jotka ovat tulleet Suomeen esimerkiksi perhesiteen perusteella riippumatta siitä, mikä perheenkokoajan oleskeluluvan peruste on. Näin ollen esimerkiksi ammatilliseen koulutukseen opiskelemaan tulleiden henkilöiden oppivelvollisuuslain 2 §:n tarkoittamat alaikäiset ja kotikunnan saaneet lapset eivät olisi lukuvuosimaksuvelvollisia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">YK:n lasten oikeuksien yleissopimuksen (SopS 60/1991) 3 artiklan 1 kohta velvoittaa lapsen edun asettamisen ensisijalle kaikessa lasta koskevassa päätöksenteossa ja toiminnassa. Yleissopimuksen 3 artiklan 2 kohdan mukaan, sopimusvaltiot sitoutuvat takaaman lapselle hänen hyvinvoinnilleen välttämättömän suojelun ja huolenpidon ottaen huomioon hänen vanhempiensa, laillisten huoltajiensa tai muiden hänestä oikeudellisessa vastuussa olevien henkilöiden oikeudet ja velvollisuudet. Yleissopimus velvoittaa valtiota, jonka on sekä aktiivisesti edistettävä lasten oikeuksien toteutumista että suojeltava lapsia oikeuksien loukkaamiselta. Lapsen edun periaate on asianmukaisesti huomioitava lainsäädännössä, hallinnossa sekä kaikissa lapsia koskevissa että lapsiin vaikuttavissa päätöksissä ja toiminnassa. Kansallisen lainsäädännön osalta lukiolain 2 §:n sekä samasanaisesti lain ammatillisesta koulutuksesta 2 §:n mukaan, koulutusta alle 18-vuotiaalle opiskelijalle suunniteltaessa, järjestettäessä ja siitä päätettäessä on ensisijaisesti huomioitava lapsen etu.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Suomi on useiden kansainvälisten sopimusten kautta sitoutunut ehkäisemään ja torjumaan ihmiskauppaa ja sen esiintymismuotoja. Tärkeimmät kansainväliset sopimukset Euroopan unionin neuvoston puitepäätökseen ihmiskaupan torjunnasta (2002/629/YOS, EYVL N:o L 203, 1.8.2002) ja kansainvälisen järjestäytyneen rikollisuuden vastaisen Yhdistyneiden Kansakuntien yleissopimuksen lisäpöytäkirjaan ihmiskaupan, erityisesti naisten ja lasten kaupan ehkäisemisestä, torjumisesta ja rankaisemisesta (SopS 70–71/2006) sekä Euroopan neuvoston yleissopimus ihmiskaupan vastaisesta toiminnasta (SopS 44/2012). Ihmiskauppa on säädetty rikoslain (39/1889) 25 luvun 3 §:ssä rangaistavaksi teoksi. Säännöksessä oleva ihmiskaupan määritelmä sisältää kolme osa-aluetta: eri tekotavat, teossa käytetyt keinot ja teon tarkoituksen. Tekotapoina pidetään toisen ottamista valtaan, värväämistä, luovuttamista, kuljettamista, vastaanottamista ja majoittamista. Käytettyjä keinoja ovat muun muassa riippuvaisen aseman tai turvattoman tilan käyttäminen hyväksi. Teon tarkoituksena tulee olla henkilön saattaminen esimerkiksi hyväksikäytön kohteeksi tai muihin ihmisarvoa loukkaaviin olosuhteisiin. Ihmiskaupan kohteen riippuvainen asema voi johtua perhe- ja sukulaisuussuhteen lisäksi muun muassa työ-, vuokra- tai velkasuhteesta taikka oleskelusta jossain laitoksessa. Riippuvuusasema voi syntyä usealla eri tavalla, esimerkiksi jos ihmiskaupan kohden joutuu luovuttamaan passinsa tai muun tärkeän asiakirjan. Turvattomassa tilassa henkilö voi olla esimerkiksi vaikean taloudellisen tilanteen, nuoren iän tai pakolaisuuden vuoksi. Yhdenvertaisuusvaltuutettu on vuonna 2024 julkaistussa selvityksessä korostanut useaan otteeseen, että lapsen erityisestä suojeluntarpeesta johtuen ihmiskaupan tunnusmerkistöjen tulkinnassa on vahvemmin huomioitava lapsen suojelun tarve ja lapsilähtöisyys.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Erityisesti lukiokoulutukseen tullaan kolmansista maista pääsääntöisesti alaikäisenä. Opetus- ja kulttuuriministeriön tietoon on tullut eri viranomaisilta kolmansista maista Suomeen opiskelutarkoituksessa tulleita lapsia koskevia ongelmatilanteita, joissa opiskelijan asuinkunta on ryhtynyt sosiaalihuollollisiin tai lastensuojelullisiin toimenpiteisiin lapsen edun varmistamiseksi. Huolta on erityisesti herättänyt alaikäisten nuorten selviytyminen Suomessa ilman huoltajia, jotka Suomen lain nojalla käyttävät rinnakkaista puhevaltaa lapsien asioissa. Ministeriöön ja muihin viranomaisiin on tullut tiedusteluja toimeentulon riittävyydestä ja mahdollisuudesta työskennellä Suomessa opintojen ja elämisen rahoittamiseksi. Lukuvuosimaksujen tarkoituksena on kattaa kolmansista maista opiskelutarkoituksessa Suomeen saapuvien henkilöiden koulutuksesta syntyviä kustannuksia koulutuksen järjestäjälle. Opiskelijan varallisuutta ei voida käyttää perusteena opiskelijavalinnoissa, mutta on vastuullista varmistaa, että opiskelijaksi tuleva kykenee selviytymään elinkustannuksistaan Suomessa. Esimerkiksi suomalaisille opiskelijoille tarkoitetut sosiaalietuudet eivät kuulu kolmansista maista opiskelutarkoituksessa Suomeen tuleville. Oleskeluluvan myöntämisen edellytyksenä on, että opiskelija on maksanut lukuvuosimaksun ja että hänellä on riittävä toimeentulo. Opiskelutarkoituksessa Suomeen saapuvalla on oltava tarpeelliset varat lukuvuosimaksujen maksamiseksi sekä elinkustannusten kattamiseksi. Edellytysten olemassaolon tarkastaa Maahanmuuttovirasto. Näiden seikkojen voidaan katsoa osoittavan hakijan asianmukaista maksukykyä ja varallisuutta. Muutos ei vaikuttaisi Suomessa tällä hetkellä opiskelevien kolmansien maiden kansalaisten taloudelliseen asemaan.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ministeriön tietoon on tullut, että alaikäisten opiskelijoiden perheet olisivat maksaneet välikäsille merkittäviä summia, jopa 25&nbsp;000 euroa, päästääkseen opiskelemaan lukiokoulutukseen Suomessa. Alaikäiset, ilman huoltajia Suomessa asuvat henkilöt ovat kohonneessa riskissä joutua hyväksikäytetyksi riippuvaisen asemansa vuoksi. Suomi on kansanvälisin sopimuksin sitoutunut puolustamaan lapsen etua sekä ehkäisemään ja torjumaan ihmiskauppaa ja sen ilmenemismuotoja. Alaikäisten opiskelijoiden rekrytointiin kolmansista maista sisältyy riskejä, eikä viranomaisten ja oppilaitosten yhteistyössä ole aina ole pystytty varmistamaan lasten oikeuksien toteutumista kestävällä tavalla. Myös tästä syystä kolmansista maista tulevien lasten rekrytointi lukiokoulutukseen oppilaitosverkon ylläpitämiseksi ei ole kestävä ratkaisu vastaamaan väestönkehityksen haasteisiin Suomessa. Lasten ja nuorten vähentyessä koulutusverkkoa on tarpeen arvioida ja suunnata uudelleen. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sukupuolivaikutukset\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Vaikutukset eri sukupuoliin arvioidaan vähäisiksi sekä ehdotetuilla tilauskoulutusta koskevilla muutoksilla että lukuvuosimaksujen käyttöönotolla. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutukseen ja ammatilliseen koulutukseen osallistujista miesten ja naisten osuus on ollut vakaa 2020-luvulla. Lukiokoulutuksen opiskelijoista ja tutkinnon suorittaneista naisia on ollut noin 58 prosenttia ja miehiä 42 prosenttia. Ammatillisen koulutuksen tutkinnon suorittaneista opiskelijoista naisia on ollut noin 55 prosenttia ja miehiä 45 prosenttia. Naisten ja miesten osuudet ovat kuitenkin hyvin eriytyneitä koulutusaloittain. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.11&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset vammaisiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">YK:n yleissopimus vammaisten henkilöiden oikeuksista (SopS 26–27/2016, vammaisyleissopimus) tuli Suomessa voimaan 1.1.2016. Vammaisyleissopimus velvoittaa Suomea edistämään vammaisten ihmisten oikeuksien toteutumista. Sopimuksen mukaan Suomi on sitoutunut siihen, että vammaiset henkilöt saavat yleisessä koulutusjärjestelmässä tuen, jota tarvitaan helpottamaan heidän tehokasta koulutustaan. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koulutusta koskevassa yleissopimuksen 24 artiklassa todetaan, että vammaisilla henkilöillä on oikeus koulutukseen yhdenvertaisesti muiden kanssa. Vammaisia henkilöitä ei saa sulkea yleisen koulujärjestelmän ulkopuolelle vammaisuutensa perusteella. Vammaisten henkilöiden tulee päästä osallistavaan, hyvälaatuiseen ja maksuttomaan ensimmäisen ja toisen asteen koulutukseen omissa lähiyhteisöissään. Vammaisia henkilöitä varten tulee tehdä heidän yksilöllisten tarpeidensa mukaiset kohtuulliset mukautukset. Heidän tulee saada yleisessä koulutusjärjestelmässä tarvitsemansa tuki.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetuilla muutoksilla ei arvioida olevan vaikutusta vammaisiin. Esityksessä ei ehdoteta muutoksia opiskelijavalintaa tai esimerkiksi erityistä tukea koskeviin säännöksiin. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Muut toteuttamisvaihtoehdot\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaihtoehdot ja niiden vaikutukset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Kolmansista maista tulevilta opiskelijoilta perittäviä lukuvuosimaksuja koskevan valmistelun lähtökohtana on ollut julkisten menojen kasvun hillitseminen. Tästä näkökulmasta vaihtoehtona olisi ollut rajoittaa hakeutumista ammatilliseen koulutukseen ja lukiokoulutukseen kolmansista maista. Tällainen rajoittaminen olisi voitu tehdä niin, että rajaus olisi koskenut opiskelutarkoituksessa Suomeen hakeutuvia henkilöitä. Muusta kuin opiskelusyystä kolmansista maista Suomeen muuttaneet henkilöt olisivat jatkossakin voineet hakeutua koulutukseen. Samoin Suomeen toisen asteen koulutukseen olisi ollut mahdollista tulla niin sanottujen vakiintuneiden vaihto-oppilasohjelmien kautta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Julkisten menojen näkökulmasta tämä vaihtoehto olisi tarkoittanut, että ammatillisen koulutuksen määrärahan mahdollistama koulutustarjonta olisi kohdistunut kokonaisuudessaan maassa jo asuvan väestön kouluttamiseen. Opiskelijamäärien kasvattaminen työelämän osaajatarpeisiin ei olisi ollut mahdollista ottamalla opiskelijoita kolmansista maista ja kouluttamalla heitä Suomen työmarkkinoille muuten kuin tilauskoulutusta järjestämällä. Tällä olisi ollut kielteinen vaikutus yritysten ja työpaikkojen mahdollisuuksiin palkata ammattikoulutettua henkilöstöä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen osalta vaikutus olisi ollut samanlainen eli lukiokoulutukseen olisivat voineet hakeutua ainoastaan sellaiset kolmansien maiden kansalaiset, jotka olisivat asuneet Suomessa tai muualla Euroopan talousalueella ennen opintoihin hakeutumista. Lukiokoulutuksen tilauskoulutus on rajattu vain&nbsp;International Baccalaureate -tutkintoon johtavaan koulutukseen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksujen määrää käsiteltäessä harkinnassa oli lukuvuosimaksun määrän sitominen ammatillisen koulutuksen keskimääräisiin tutkintokohtaisiin kustannuksiin ja lukiokoulutuksessa järjestäjäkohtaiseen yksikköhintaan. Ammatillisen koulutuksen osalta lukuvuosimaksun suuruuden sitominen ammatillisen koulutuksen keskimääräisiin tutkintokohtaisiin kustannuksiin olisi tehnyt järjestelmästä byrokraattisen ja jäykän ja aiheuttanut ministeriölle ja Opetushallitukselle merkittävästi hallinnollista työtä. Lisäksi koulutuksen järjestäjien mahdollisuudet huomioida kustannusvaihtelut yksittäisten opiskelijoiden välillä olisi ollut hankalaa ja vaatinut mahdollisesti erittäin yksityiskohtaista sääntelyä siitä, millä perusteilla lukuvuosimaksua on mahdollista alentaa. Menettelyä olisi puoltanut se, että tuolloin kaikilla koulutuksen järjestäjillä olisi ollut suuruudeltaan yhtäläiset lukuvuosimaksut, mikä olisi mahdollisesti helpottanut opiskelijan valintaa eri koulutuksen järjestäjien välillä. Koulutuksen järjestäjien ei myöskään olisi tarvinnut itse selvittää omia kustannuksiaan. Harkinnassa päädyttiin kuitenkin siihen, että koulutuksen järjestäjillä on paras tuntemus omasta toiminnastaan ja parhaat mahdollisuudet määritellä lukuvuosimaksun suuruus ottaen huomioon opiskelijan henkilökohtaisessa osaamisen kehittämissuunnitelmassa sovitut tavat hankkia osaamista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiokoulutuksessa lukuvuosimaksun suuruuden sitominen järjestäjäkohtaiseen yksikköhintaan olisi tarkoittanut joidenkin lukiokoulutuksen järjestäjien kohdalla huomattavan korkeaa lukuvuosimaksua. Järjestäjäkohtainen yksikköhinta vaihtelee lukion sijainnista ja koosta riippuen n. 8000 eurosta n. 30&nbsp;000 euroon. Opiskelijan olisi ollut kannattavampaa hakeutua sellaisen lukion opiskelijaksi, jonka järjestäjäkohtainen yksikköhinta on mahdollisimman alhainen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Työryhmä harkitsi hakemusmaksujen käyttöönottoa kolmansista maista toiselle asteelle hakeutuville henkilöille. Korkea-asteella hakemusmaksut ovat tulleet käyttöön 1.1.2025 jälkeen alkaneisiin hakuihin ja alustavat arviot hakemusmaksujen käyttöönotosta ovat olleet myönteisiä. Opetus- ja kulttuuriministeriö tiedusteli hakemusmaksujen tarpeellisuudesta koulutuksen järjestäjiltä järjestämissään Webropol-kyselyissä. Hakemusmaksut keräsivät jonkin verran kannatusta, mutta saadun palautteen perusteella niiden käyttöönottoa ei pidetty erityisen tarpeellisena. Toisella asteella ei myöskään ole keskitettyä hakujärjestelmää, vaan esimerkiksi ammatillisessa koulutuksessa kolmansista maista tulevat henkilöt hakevat jatkuvassa haussa olemalla suoraan yhteydessä koulutuksen järjestäjään.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ulkomaiden lainsäädäntö ja muut ulkomailla käytetyt keinot\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksut toisella asteella eivät ole yleisesti käytössä Euroopassa. Pohjoismaissa lukuvuosimaksuja kolmansien maiden opiskelijoilta ei peritä Ruotsissa, Norjassa ja Islannissa. Kyseisissä maissa kuitenkin peritään yleiskatteellisia lukuvuosimaksuja korkeakouluopiskelijoilta, jotka tulevat kolmansista maista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Tanskassa\u003C/span> sen sijaan on käytössä opiskelijamaksut ammatillisen koulutuksen opiskelijoille, jotka tulevat kolmansista maista. Lukuvuosimaksuvelvollisia eivät ole muun muassa sellaiset henkilöt, joilla on pysyvä oleskelulupa Tanskassa tai toisessa Pohjoismaassa, tilapäinen oleskelulupa, joka mahdollistaa myöhemmin pysyvän oleskelun, oleskelulupa suojeluaseman tai perhesiteen perusteella, oleskelulupa on myönnetty Ukrainasta paenneelle henkilölle tai vanhemman oleskelulupa. Tanskan lainsäädännön mukaan maksuvelvollisia opiskelijoita ei oteta lukuun ammatillisen koulutuksen rahoituksessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ulkomaalaiset opiskelijat otetaan huomioon valtion ammatillisen koulutuksen järjestäjille myöntämien tukien laskennassa vain tietyin laissa ammatillisesta koulutuksesta ( \u003Cspan class=\"KursiiviTeksti\">Lov om institutioner for erhvervsrettet uddannelse)\u003C/span> sekä laissa ammatillisista oppilaitoksista säädetyin perustein \u003Cspan class=\"KursiiviTeksti\">(Lov om institutioner for erhvervsrettet uddannelse)\u003C/span> . Tanskan lainsäädännön mukaan ulkomaalaiset oppilaat ja harjoittelijat voidaan ottaa huomioon lainsäädännön mukaiseen laskelmaan vain jos: &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">1) hänelle on myönnetty oleskelulupa tilapäistä oleskelua varten, ulkomaalaislain mukainen, pysyvä oleskelulupa tai tilapäinen oleskelulupa, johon liittyy mahdollisuus pysyvään oleskeluun Tanskassa&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">2) hänelle on myönnetty tilapäinen oleskelulupa tilapäistä oleskelua varten ulkomaalaislain mukaan perustuen perhesiteeseen ulkomaalaiseen, jolle on myönnetty oleskelulupa ulkomaalaislain nojalla; &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">3) hänelle on myönnetty ulkomaalaislain mukainen oleskelulupa sellaisen ulkomaalaisen mukana tulevana lapsena, joka ei ole Euroopan unionin jäsenvaltion tai ETA-sopimuksen osapuolivaltion kansalainen, ja hänelle on myönnetty oleskelulupa ulkomaalaislaista johdu; &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">5) hänelle on myönnetty oleskelulupa Ukrainasta paenneena henkilönä tilapäisistä oleskeluluvista annetun lain nojalla,&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">6) ulkomaalainen opiskelija tai harjoittelija osallistuu vaihto-ohjelmaan, jossa tanskalainen oppilaitos ja ulkomainen oppilaitos keskinäisellä sopimuksella vaihtavat opiskelijoita tai harjoittelijoita, &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">7) heillä on oikeus yhdenvertaisuuteen Tanskan kansalaisten kanssa EU:n lainsäädännön, ETA-sopimuksen, tai Tanskan tekemien kansainvälisten sopimusten nojalla, tai&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">8) hän on hakenut tai saanut oleskeluluvan ulkomaalaislain mukaisesti, ja ennen kuin heille myönnettiin oleskelulupa edellä mainittujen säännösten mukaisesti, kuuluivat he kohtien 1–7 piiriin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäksi ulkomaalainen opiskelija kuuluu 3 kohdan soveltamisalaan, vaikka vanhemman oleskelulupa päättyisi koulutuksen alkamisen jälkeen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ammatillinen koulutus on ilmainen ulkomaalaiselle opiskelijalle, mikäli hän täyttää jonkin edellä mainituista ehdoista. Oppilaitosten koulutustarjonta muulle, kuin ehdot täyttävälle opiskelijalle tapahtuu tuloa tuottavana toimintana ja opiskelijalta veloitetaan opiskelusta erillinen maksu. Koulutuksen tarjoava oppilaitos tekee tarkemman arvion yksittäisistä kustannuksista, jotka sisällytetään koulutukseen ja määrittää koulutuksen hinnan. Oppilaitosten tuloa tuottavaa toimintaa harjoittaessaan on noudatettava hyvää markkinointitapaa, eivätkä ne saa toiminnallaan aiheuttaa epäreilua hintakilpailua. Koulutusten hinnasta ulkomaalaiselle opiskelijalle ei ole tarjolla tilastoitua tietoa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ulkomaalaisen opiskelijan oleskeluluvan perusteella on merkitystä sen kannalta, voidaanko ulkomaalaisille ammatilliseen koulutukseen osallistuville opiskelijoille myöntää valtiontukea vai pitääkö heidän maksaa koulutuksensa itse. Erilaisten ulkomaalaislain mukaisten oleskelulupamuotojen lisäksi ulkomaalaiset opiskelijat huomioidaan laskennassa, jos he ovat saapuneet opiskelemaan osana tanskalaisen ja ulkomaisen oppilaitoksen sopimukseen perustuvaa opiskelijavaihtoa tai jos EU-lainsäädännön mukaan, mukaan lukien ETA-sopimus, tai Tanskan tekemät kansainväliset sopimukset edellyttävät tasa-arvoa Tanskan kansalaisten kanssa. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lausuntopalaute\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lausuntokierros\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ammatillisen koulutuksen tilauskoulutus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että jatkossa tilauskoulutusta voisi järjestää myös EU- ja ETA-kansalaisille ja niihin rinnastettaville. Ehdotusta kannatettiin laajasti. Sen arvioitiin parantavan suomalaisten ja muiden EU- ja ETA-valtioiden kansalaisten mahdollisuuksia osallistua tilaajan maksamaan koulutukseen. Lisäksi ehdotuksen arvioitiin avaavan Suomessa toimiville työnantajille paremmat mahdollisuudet kehittää henkilöstönsä osaamista tilauskoulutuksen avulla.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että ammatillisen koulutuksen tilauskoulutusta koskevia säännöksiä muutetaan siten, että tilauskoulutusopiskelijoiden oikeuksista ja velvollisuuksista sovitaan entistä paremmin tilaajien ja koulutuksen järjestäjien välisillä sopimuksilla. Lisäksi säädetään koulutuksen järjestäjien velvollisuudesta tiedottaa opiskelijoille heidän oikeuksistaan ja velvollisuuksistaan. Ehdotuksia kannatettiin laajasti ja niitä pidettiin perusteluina. Opetushallituksen yhteydessä toimivat tutkintovientitoimikunta nosti lausunnossaan esille, että esityksessä on vaikutuksia tarkasteltu ainoastaan osaajatuonnin näkökulmasta, eikä vaikutuksissa ole huomioitu yrityksiä, jotka toteuttavat tutkintovientiä tilauskoulutuksena EU- ja ETA-valtioiden ulkopuolelle.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että kuntajärjestäjien ei tarvitsisi jatkossa yhtiöittää toimintaansa järjestäessään ammatillisen koulutuksen tilauskoulutusta. Ehdotus sai sekä kannatusta että vastustusta. Useat lausunnonantajat katsoivat, että ehdotus selkeyttää kuntataustaisten koulutuksen järjestäjien asemaa tilauskoulutuksen järjestäjinä. Useat esitystä vastustavat lausunnonantajat katsoivat esityksen heikentävät pienten ja keskisuurten yritysten mahdollisuutta ostaa tilauskoulutusta sekä aiheuttavan liiallista taloudellista riskiä koulutuksen järjestäjille.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Moni ehdotusta vastustanut lausunnonantaja totesi, että ehdotettu muutos olisi ammatillisen koulutuksen osaamisperusteisuuden vuoksi ammatillisen koulutuksen periaatteiden ja ammatillisesta koulutuksesta annetun lain 30 §:n vastainen (muun muassa Suomen ammattikoulutuksen johtajat SAJO Ry, tutkintovientitoimikunta). Lausunnonantajien tulkinta osaamisperusteisuuden merkityksestä ja koulutuksen hankinnasta 30 §:n perusteella on kuitenkin virheellinen. Ammatillisesta koulutuksesta annetun lain 30 §:n mukaan koulutuksen järjestäjä voi hankkia järjestämisluvassa määrättyjen tutkintojen osia sekä niihin valmistavaa tutkintokoulutusta, järjestämisluvan mukaista muuta koulutusta sekä 27 §:n 1 momentissa tarkoitettua oppisopimuskoulutusta toiselta ammatillisen tai muun koulutuksen järjestäjältä, muulta julkiselta taholta taikka muulta yksityiseltä yhteisöltä tai säätiöltä. Säännöksen tarkoitusta on täsmennetty hallituksen esityksessä (HE 39/2017 s. 207) todetaan, että koulutuspalveluiden hankkimisella täydennettäisiin koulutuksen järjestäjän itse järjestämää koulutusta. Säännös ei kuitenkaan mahdollistaisi, että järjestämisluvan saanut koulutuksen järjestäjä itse luopuisi koulutuksen järjestämisestä. Lisäksi hallituksen esityksessä todetaan, että mahdollisuus hankkia järjestämisluvassa määrättyjen tutkintojen osia tarkoittaisi sitä, että koulutuksen järjestäjän ei tarvitsisi itse järjestää esimerkiksi kaikkia tutkinnon perusteiden mukaisia valinnaisia tutkinnon osia, vaan se voisi hankkia niitä myös toiselta koulutuksen järjestäjältä. Säännöksen perusteella voitaisiin hankkia koko tutkinnon osa tai tutkinnon perusteiden ammattitaitovaatimusten ja osaamistavoitteiden mukaista koulutusta ainoastaan tutkinnon osan tietyltä osa-alueelta. Säännöksessä ei säädettäisi mitään tarkkaa rajaa sille, minkä osuuden tutkinnon osista koulutuksen järjestäjä voisi hankkia toiselta koulutuksen järjestäjältä. Pääsääntöisesti koulutuksen järjestäjän tulisi kuitenkin itse järjestää ainakin tutkinnon perusteiden mukaiset pakolliset osat. Opetus- ja kulttuuriministeriö on antanut koulutuksen hankinnasta ohjeen, joka löytyy ministeriön verkkosivuilta osoitteesta minedu.fi/ ohjeita-ammatillisen-koulutuksen-jarjestajille. Näin ollen ammatillisesta koulutuksesta annetun lain 30 § ei mahdollista koko tutkinnon ostamista toiselta koulutuksen järjestäjältä taikka muulta pykälässä mainitulta taholta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotetun sääntelyn aikataulua pidettiin useassa lausunnossa liian tiukkana ja säädettäväksi ehdotettiin muutaman vuoden mittaista siirtymäaikaa, jotta koulutuksen järjestäjät ja yritykset ehtivät sopeuttaa toimintansa. Esityksen jatkovalmistelussa todettiin, ettei siirtymäajan säätäminen ole mahdollista, koska nykytila on ongelmallinen voimassa olevan lainsäädännön kanssa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Muun muassa Opetushallitus ja tutkintovientitoimikunta toteavat lausunnoissaan, että EU- ja ETA-valtioiden ulkopuolinen tilauskoulutus ja tutkintovienti on vaativaa kansainvälistä liiketoimintaa, joka edellyttää sopimusosaamista ja riskienhallintaa. Lakiehdotus siirtäisi riskin suoraan koulutuksen järjestäjille ja vähenevien resurssien myötä ei ole nähtävissä, että koulutuksen järjestäjillä olisi tosiasiasiallista mahdollisuutta tai halukkuutta panostaa EU- ja ETA-valtioiden ulkopuolelle tapahtuvaan tutkintovientiin ja tilauskoulutukseen. Olisi hyvä täsmentää, että muutos koskee vain Suomessa toteutettavaa oleskelulupaa edellyttävää tilauskoulutusta. Kilpailu – ja kuluttajavirasto (KKV) toteaa lausunnossaan, että paras toimintamalli kilpailuneutraliteetin kannalta olisi mahdollistaa kuntien ja kuntayhtymien yhtiömuotoinen toiminta tilauskoulutuksen järjestämisessä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kuten hallituksen esityksessä todetaan, kuntien ja kuntayhtymien nykymuotoinen toiminta on juridisesti ongelmallista, sillä yhtiöillä ei ole ammatillisen koulutuksen järjestämislupaa. Järjestämislupaa ei voimassa olevan lain mukaan voida myöntää pelkästään tilauskoulutuksen järjestämistä varten. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lisäksi KKV toteaa, että lausunnon mukaan jatkovalmistelussa voi olla tarpeen vielä harkita kuntien ja kuntayhtymien yhtiöittämispoikkeuksen piirissä tuottamien tilauskoulutusten määrän rajoittamista jonkin liikevaihto- tai prosenttiosuusrajan alle. KKV:n näkemyksen mukaan perusteluja tulisi joka tapauksessa tarkentaa konkreettisin esimerkein siitä, millaisissa olosuhteissa tilauskoulutuksen voitaisiin katsoa olevan oikeasuhtaista sekä millä tavoin yksityinen tarjonta tulee käytännössä ottaa huomioon, jotta kunnat ja kuntayhtymät pystyisivät arvioimaan, milloin yhtiöittämispoikkeus soveltuisi niiden toimintaan. Jatkovalmistelussa liikevaihto- tai prosenttirajasta säätämisen sijaan päädyttiin esittämään opiskelijavuosiin sidottua määritelmää liittyen oikeasuhtaisuuteen. Pykäläehdotusta myös täsmennettiin siten, ettei siinä viitata yksityisten koulutuksen järjestäjien tarjoamiin tilauskoulutuspalveluihin koulutuksen järjestäjän toiminta-alueella. Säännöksellä tavoiteltu päämäärä saavutetaan jo markkinaperusteisen hinnoittelun vaatimuksella.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Työ- ja elinkeinoministeriö korostaa lausunnossaan, että kilpailuneutraliteettia vääristävien etujen poistamiseksi kilpailutilanteessa markkinoilla tapahtuvaa taloudellista toimintaa tulisi harjoittaa yhtiömuodossa ja yhtiöittämisvelvoitteeseen säädettäviin poikkeuksiin tulee suhtautua pidättyvästi. Mikäli poikkeuksen säätäminen katsottaisiin välttämättömäksi, poikkeuksen tulee olla tarkasti rajattu sekä hyvin perusteltu. Ministeriö pitää myös tarpeellisena, että asiassa pyydetään yritystukineuvottelukunnan lausunto.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kuntaliitto ehdotti lausunnossaan, että vastaava sääntely tulisi vielä myös lukiolainsäädäntöön. Esityksen jatkovalmistelussa päätettiin, ettei vastaavaa sääntelyä lukiokoulutukseen valmistella tässä vaiheessa, vaan asian tarpeellisuutta arvioidaan myöhemmässä vaiheessa.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukiokoulutuksen tilauskoulutus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan täsmennyksiä lukiokoulutuksen tilauskoulutusta koskeviin säännöksiin. Ehdotettuihin muutoksiin suhtauduttiin pääsääntöisesti myönteisesti, sillä niiden katsottiin yhtenäistävän tilauskoulutusta koskevia säännöksiä.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukuvuosimaksut\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lukuvuosimaksuja toiselle asteelle kolmansista maista opiskelemaan tuleville opiskelijoille. Lukuvuosimaksuja sekä kannatettiin että vastustettiin. Esitystä kannattivat muun muassa Ammattiosaamisen kehittämisyhdistys AMKE ry, Areena-verkosto ja suurimmat koulutuksen järjestäjät, Elinkeinoelämän keskusliitto EK, Finlands svenska lärarförbund FSL, Keskuskauppakamari, Kuntaliitto, Opetushallitus, Pro Lukio Ry, Suomen ammattikoulutuksen johtajat SAJO Ry, Sivistysala Ry ja Teknologiateollisuus Ry. Usea lausunnonantaja yhtyi ehdotuksen taustalla olevaan huoleen julkisen talouden tilasta yleisesti sekä lisäksi kuntatalouden tilasta. Useat esitystä kannattaneet tunnistivat tarpeen huolehtia Suomeen alaikäisenä opiskelemaan tulevien lasten oikeuksista ja jakoivat huolen lapsiin kohdistuvasta hyväksikäyttöriskistä. Usea esitystä kannattanut lausunnon antaja totesi huolensa osaavan työvoiman saatavuudesta Suomessa tulevaisuudessa ja tarpeen seurata lukuvuosimaksujen vaikutuksia tilanteeseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esitystä vastustivat erityisesti sellaiset koulutuksen järjestäjät, joiden opiskelijoina on kolmansista maista tulleita henkilöitä. Esitystä vastustivat muun muassa myös, Suomen ammattiin opiskelevien liitto SAKKI Ry, Suomen ekonomit, Suomen lukiolaisten liitto, Suomen lähilukioyhdistys Ry ja Suomen yrittäjät ry. Esitystä vastustavat tahot totesivat muun muassa esityksen heikentävän osaavan työvoiman saatavuutta. Esityksen pelättiin lisäävän koulutuksellista eriarvoisuutta alueiden välillä ja koulutuksen keskittyvän kasvukeskuksiin. Lausunnoissa todettiin, että vaikutuksia erilaisiin koulutuksen järjestäjiin erityisesti lukiokoulutuksen osalta ei ole arvioitu riittävästi. Vaikutusten arvioinnin toivottiin sisältävän myös kokonaisarvioinnin. Useat esitystä vastustavat lausunnon antajat totesivat, että kolmansista maista tulevat opiskelijat tulee säilyttää valtionosuusrahoituksen piirissä, jotta Suomeen saadaan koulutettua lisää osaavaa työvoimaa. Esityksen jatkovalmistelussa lukiokoulutuksen osalta vaikutusarvioinnissa pyrittiin huomioimaan erilaisten koulutuksen järjestäjien näkökulma. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen lukuvuosimaksujen osalta usea lausunnonantaja esitti huolensa siitä, että ehdotus voi heikentää joidenkin kuntien mahdollisuutta järjestää lukiokoulutusta. Lausunnoissa todettiin, että lukion olemassaololla on ratkaisevan tärkeä merkitys paitsi lukiokoulutuksen saavutettavuudelle, myös perusopetuksen laadulle pienessä kunnassa. Kuntaliitto ehdottaa rahoituksellisina keinoina yksikköhinnan harkinnanvaraisen korotuksen hyödyntämistä, rahoituslaissa olevan lukiokoulutuksen keskimääräisen yksikköhinnan leikkauksen poistaminen sekä lukiokoulutuksen rahoitusjärjestelmän uudistamista kokonaisuudessaan. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotettuja rajauksia lukuvuosimaksujen ulkopuolelle jäävistä pidettiin lausunnoissa laajasti tarkoituksenmukaisena. Ehdotettua sääntelyä lukuvuosimaksujen suuruudesta pääasiallisesti kannatettiin tai siitä ei annettu palautetta. Kuntaliitto piti kuitenkin ennakoitavuuden ja opiskelijan oikeusturvan sekä koulutuksen järjestäjän hinnoittelun kannalta jossakin määrin ongelmallisena, että valtioneuvosto määrittää tosiasiallisesti lukuvuosimaksun minimitason vain yhdeksi kalenterivuodeksi kerrallaan. Jatkovalmistelussa ehdotusta päätettiin täsmentää siten, että lukuvuosimaksu olisi opiskelijalle sama opiskelujen keston ajan. Opetushallitus esitti lausunnossaan, että pitäisikö säätää vaihteluvälejä, joiden sisällä koulutuksen järjestäjän lukuvuosimaksu suhteessa keskimääräiseen kustannukseen voidaan perustellusta syystä päättää. Tarpeellista voisi olla säätää asetuksella periaatteista, miten kustannustieto ajantasaistetaan esimerkiksi ammatillisen koulutuksen indeksiin perustuen kullekin varainhoitovuodelle viimeisimmän kustannustiedon perusteella. Lisäksi olisi hyvä täsmentää millaista opiskelijavuosikertymää kohden lukuvuosimaksu määritetään.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lausunnoissa kiinnitettiin huomiota siihen, ettei lukuvuosimaksuihin siirtymisestä ole siirtymäsäännöstä, ja jää näin ollen epäselväksi keitä kaikkia lukuvuosimaksuvelvollisuus koskee. Jatkovalmistelussa lain voimaantulopykälään lisättiin säännös, jonka mukaan lukuvuosimaksuvelvollisuus koske opintonsa lain voimaan tulon jälkeen aloittavia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Työ- ja elinkeinoministeriö ja Sallan kunta toivat lausunnoissaan esille tarpeen arvioida esitystä yhdistelmälupadirektiivin (2011/98/EU) vaatimusten näkökulmasta. Esityksen jatkovalmistelussa esityksen lisättiin yhdistelmälupadirektiiviä koskeva kappale Nykytilaan sekä direktiivin vaikutusten arviointi säännöskohtaisiin perusteluihin koskien lukuvuosimaksuja koskevia säännöksiä. Lukiokoulutuksen osalta päädyttiin direktiivin vaatimusten vuoksi ehdottamaan, että lukuvuosimaksuvelvollisuus koskisi vain opiskelijan oleskeluluvalla Suomessa oleskelevia ja mainitulla oleskeluluvalla Suomeen tulevia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ylioppilastutkintolautakunta ja Opetusalan keskusjärjestö OAJ toivat lausunnoissaan esille, että esityksessä ei oteta kantaa lukuvuosimaksuvelvollisuuden vaikutusta ylioppilastutkintomaksuihin. Esityksen jatkovalmistelussa lukiolain säännöskohtaisiin perusteluihin lisättiin ylioppilastutkintomaksuja koskevaa perustelutekstiä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetushallitus totesi lausunnossaan, että vaikka oppilaitokset vastaavat itse lukuvuosimaksuvelvollisuuden tarkistamisesta ja hoitamisesta, ne tarvitsevat tukea mm. maksuvelvollisuuden tarkistamiseen liittyvissä asioissa. Korkeakoulupuolella on ollut toiminnassa lukuvuosimaksuvelvollisuuden tarkistamiseen liittyvä LUVE-verkosto. Samankaltaisia tukirakenteita voisi olla hyödyllistä miettiä myös toiselle asteelle.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Joissakin lausunnoissa ehdotettiin hakemusmaksun käyttöönottoa, jos lukuvuosimaksuista huolimatta hakemusmäärät pysyvät korkealla. Joissakin lausunnoissa ehdotettiin menettelyä, jossa lukuvuosimaksuvelvollinen voisi myöhemmin Suomessa työllistyttyään vähentää verotuksessaan maksamansa lukuvuosimaksut. Lisäksi joissakin lausunnoissa ehdotettiin lukuvuosimaksun sijaan useamman vuoden työvelvollisuuden asettamista kolmansien maiden kansalaisille koulutusta vastaan. Myös korkeakouluissa käytössä olevan stipendijärjestelmän perustamista toiselle asteelle ehdotettiin. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Joissakin lausunnoissa ehdotettiin lukuvuosimaksun rajaamista vain englannin kielellä järjestettävään koulutukseen. Kolmansista maista toisen asteen koulutukseen tulevat opiskelijat opiskelevat Suomessa pääsääntöisesti kansalliskielillä. Lukiokoulutukseen tulevat kolmansien maiden kansalaiset voivat opiskella Suomessa yksinomaan kansalliskielillä järjestetyssä koulutuksessa, kuten lukion lukuvuosimaksujen säännöskohtaisissa perusteluissa todetaan. Esityksen valtiontaloudellisiin tavoitteisiin ei näin ollen päästäisi, jos lukuvuosimaksut rajattaisiin englanninkielisiin koulutuksiin. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tiedonsaantioikeudet\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan tiedonsaantioikeuksia Maahanmuuttoviraston ja toisen asteen koulutuksen järjestäjien välille. Ehdotettua muutosta pääasiallisesti kannatettiin. Lausuntopalaute oli pääsääntöisesti myönteistä tai neutraalia. Useissa lausunnoissa korostettiin tarvetta tehdä tiedonvaihdosta niin sujuvaa, ettei siitä koidu koulutuksen järjestäjille suurta työmäärää ja kustannuksia. Sakki Ry totesi lausunnossaan, että tiedonsaantioikeuksien laajentaminen herättää huolta opiskelijoiden yksityisyydensuojasta ja tietoturvasta. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rahoituslain muutokset\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Rahoituslain muutokset liittyvät ehdotukseen lukuvuosimaksuista. Lausuntopalaute muutoksista oli sekä myönteistä että kielteistä. Tahot, jotka
