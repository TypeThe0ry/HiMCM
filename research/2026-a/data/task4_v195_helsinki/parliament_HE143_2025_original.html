an, että jatkossa Suomeen opiskelutarkoituksessa tulevat kolmansien maiden kansalaiset olisivat lukuvuosimaksuvelvollisia. Lukuvuosimaksuvelvollisuus koskisi myös oppivelvollisuusikäisiä henkilöitä, jotka ovat tulleet Suomeen opiskelutarkoituksessa. Lukuvuosimaksuvelvollisuudesta säädettäisiin lukiolaissa sekä laissa ammatillisesta koulutuksesta. Sääntelyn selkeyden ja yhtenäisyyden vuoksi olisi näin ollen tarpeellista muuttaa myös oppivelvollisuuslakia siten, etteivät opiskelutarkoituksessa Suomeen kolmansista maista tulleet henkilöt olisi oppivelvollisia. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Laki kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">7 a §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Kansallisen oleskeluluvan myöntäminen opiskelua varten.\u003C/span> Voimassa olevan 2 momentin mukaan kolmannen maan kansalaiselle myönnetään kansallinen oleskelulupa opiskelua varten, jos hänet on hyväksytty opiskelijaksi Suomessa sijaitsevaan muuhun oppilaitokseen kuin korkeakouluun, jos opiskelu johtaa tutkintoon tai ammattiin, tai hänet on hyväksytty opiskelijaksi Suomessa sijaitsevaan korkeakouluun tai muuhun oppilaitokseen myös muihin kuin tutkintoon johtaviin opintoihin, jos oleskeluluvan myöntämiselle on perusteltu syy. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momenttia ehdotetaan muutettavan siten, että 2 momentin 1 kohtaan, joka koskee tutkintoon tai ammattiin johtavaa opiskelua muussa oppilaitoksessa kuin korkeakoulussa, lisättäisiin luvan myöntämisen edellytykseksi koulutuksen järjestäjän vaatimien maksujen maksaminen. Muutoksen myötä kohta vastaisi pykälän 1 momenttia koulun vaatimien maksujen osalta korkeakouluopinnoissa. Tyypillisin tällainen maksu olisi lukio- ja ammatillista koulutusta koskeva lukukausimaksu, jonka maksamista koskevasta velvollisuudesta tämän esityksen yhteydessä esitetään säädettävän. Koulutuksen järjestäjät määrittäisivät, miten ja missä aikataulussa lukukausimaksu olisi suoritettava. Maahanmuuttovirastolla tulisi olla tiedossa, onko tämä edellytys oleskeluluvan myöntämisen kannalta täytetty siten kuin oppilaitos edellyttää ja että kolmannen maan kansalainen on hyväksytty opiskelijaksi ilman ehdollisuuksia. Vaadittavien maksujen maksaminen olisi edellytys opiskelijan oleskeluluvalle sen aikataulun ja niiden menettelyiden mukaisesti, miten kyseinen oppilaitos vaatii maksuja suoritettaviksi, ja mikäli opiskelija ei täyttäisi säädettyjä edellytyksiä luvan myöntämisen jälkeen, olisi se peruste oleskeluluvan peruuttamiselle tai uusimatta jättämiselle. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lakia alemman asteinen sääntely\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan ammatillisesta koulutuksesta annetun lain 123 §:n muuttamista siten, että koulutuksen järjestäjän tiedotettaviin asioihin lisättäisiin lukuvuosimaksut. Ehdotettavan säännöksen mukaan koulutuksen järjestäjän on huolehdittava siitä, että tutkinnon suorittamismahdollisuuksista, annettavasta koulutuksesta, koulutukseen hakeutumisesta ja Euroopan unionin ja Euroopan talousalueen ulkopuolisten valtioiden kansalaisilta perittävistä lukuvuosimaksuista on tietoa yleisesti saatavilla. Pykälän toisen momentin mukaan tiedotettavista asioista voidaan säätää tarkemmin valtioneuvoston asetuksella. Ammatillisesta koulutuksesta annetun valtioneuvoston asetuksen (673/2017) 23 §:ää muutettaisiin siten, että siihen lisättäisiin lukuvuosimaksuja koskeva uusi kohta yhdeksän.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan muutettavan rahoituslain 24 §:ää, joka koskee lukiokoulutuksen yksikköhintoja. Pykälää ehdotetaan muutettavan siten, että lukiokoulutuksen yksikköhintoja laskettaessa ei oteta huomioon tilauskoulutuksen opiskelijoita eikä lukuvuosimaksuvelvollisia opiskelijoita. Pykälän 7 momentin mukaan yksikköhintojen laskemisesta säädetään tarkemmin valtioneuvoston asetuksella. Opetus- ja kulttuuritoimen rahoituksesta annetun valtioneuvoston asetuksen (1766/2009) 19 §:ssä säädetään lukion opiskelijamäärien laskemisesta. Kyseiseen momenttiin lisättäisiin tilauskoulutuksen opiskelijat ja lukuvuosimaksuvelvolliset opiskelijat.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Voimaantulo\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Ehdotetaan, että lait tulevat voimaan 1.8.2026. Lukuvuosimaksuja ja tiedonsaantioikeuksia koskevia ammatillisesta koulutuksesta annetun lain 105 a ja 109 b §:ää sekä lukiolain 34 a ja 60 §:ää esitetään sovellettavan lain voimaan tulon jälkeen opintonsa aloittaviin. Lukuvuosimaksuja ja tiedonsaantioikeuksia koskevia säännöksiä voidaan soveltaa jo ennen lain voimaan tuloa niihin opiskelijoihin, jotka aloittavat opintonsa 1.8.2026 tai sen jälkeen. &nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Toimeenpano ja seuranta\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriö seuraa ehdotetun lukuvuosimaksuja koskevan esityksen vaikutuksia koulutuksen saatavuuteen ja saavutettavuuteen sekä osaavan työvoiman saatavuuteen eri puolella maata. Opetus- ja kulttuuriministeriö seuraa koulutuksen järjestäjien määrittämien lukuvuosimaksujen hinnoittelua ja puuttuu tarvittaessa epätarkoituksenmukaisiin hinnoittelu- ja kilpailutilanteisiin.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Suhde talousarvioesitykseen\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Esitys liittyy valtion vuoden 2026 talousarvioon ja se on tarkoitettu käsiteltäväksi sen yhteydessä.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">12&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Suhde perustuslakiin ja säätämisjärjestys\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">12.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdenvertaisuus ja sivistykselliset oikeudet\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan säädettäväksi lukuvuosimaksuista kolmansista maista tuleville opiskelijoille lukiokoulutuksessa ja ammatillisessa koulutuksessa. Esityksessä ehdotetaan oppivelvollisuuslain muuttamista siten, että kolmansien maiden kansalaiset, jotka oleskelevat Suomessa opiskelutarkoituksessa, eivät olisi oppivelvollisia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetuilla muutoksilla olisi erityisesti merkitystä perustuslain 6 §:n yhdenvertaisuuden ja 16 §:n sivistyksellisten oikeuksien kannalta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 6 §:n 1 momentin mukaan ihmiset ovat yhdenvertaisia lain edessä. Pykälän 2 momentin syrjintäkiellon mukaan ketään ei saa ilman hyväksyttävää perustetta asettaa eri asemaan sukupuolen, iän, alkuperän, kielen, uskonnon, vakaumuksen, mielipiteen, terveydentilan, vammaisuuden tai muun henkilöön liittyvän syyn perusteella. Pykälän 3 momentin mukaan lapsia on kohdeltava tasa-arvoisesti yksilöinä, ja heidän tulee saada vaikuttaa itseään koskeviin asioihin kehitystään vastaavasti. Perustuslain yhdenvertaisuussääntely ja syrjintäkielto eivät kiellä kaikenlaista erottelua ihmisten välillä. Olennaista on, voidaanko kulloinenkin sääntely henkilöiden asettamisesta eri asemaan perustella perusoikeusjärjestelmän kannalta hyväksyttävällä tavalla (esim. PeVL 44/2010 vp, PeVL 18/2010 vp ja PeVL 46/2006 vp). Hyväksyttävän perusteen olemassaolo tekee eri asemaan asettamisen sallituksi perustuslain näkökulmasta niin välittömän kuin välillisen syrjinnän kieltoon nähden (PeVL 10/2003 vp). Eduskunnan perustuslakivaliokunnan käytännössä on keskeisenä hyväksyttävänä perusteena pidetty erottelun tavoitteen liittymistä jonkun toisen perusoikeuden toteutumiseen. Hyväksyttävänä perusteena on pidetty myös muita merkittäviä julkisia tai yhteiskunnallisia intressejä. Erilaisen kohtelun arvioinnissa on kiinnitettävä huomiota sääntelyn oikeasuhtaisuuteen. Eduskunnan perustuslakivaliokunta on tässä yhteydessä korostanut hyväksyttävän syyn asiallista ja kiinteää yhteyttä säädettävän lain tarkoitukseen (PeVL 44/2010). Perustuslakivaliokunta on myös todennut vakiintuneessa lausuntokäytännössään, ettei yleisestä yhdenvertaisuusperiaatteesta johdu tiukkoja rajoja lainsäätäjän harkinnalle pyrittäessä kulloisenkin yhteiskuntakehityksen vaatimaan sääntelyyn (esim. PeVL 47/2018 vp.). Erottelut eivät kuitenkaan saa olla mielivaltaisia eivätkä ne saa muodostua kohtuuttomiksi (esim. PeVL 47/2018 vp.).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 16 §:n 1 momentin mukaan jokaisella on oikeus maksuttomaan perusopetukseen. YK:n lapsen oikeuksien yleissopimuksen (SopS 60/1991) 28 artiklan mukaan sopimusvaltiot tunnustavat jokaisen lapsen oikeuden saada opetusta. Oikeuden toteuttamiseksi asteittain ja yhtäläisesti kaikille, jäsenvaltiot artiklan 1 kohdan a alakohdan mukaan tekevät pakolliseksi perusasteen koulutuksen, jonka tulee olla maksutta kaikkien saatavilla. Vastaavasta oikeudesta maksuttomaan alkeisopetukseen määrätään myös taloudellisia, sosiaalisia ja sivistyksellisiä oikeuksia koskevassa kansainvälisessä yleissopimuksessa (TSS-sopimus, SopS 6/1976, 13 artiklan 2 kohdan a alakohta) sekä Unescon yleissopimuksessa syrjinnän vastustamiseksi opetuksen alalla (59/71, 4 artikla). Voimassa oleva perusopetuslain sääntely turvaa kansainvälisissä ihmisoikeussopimuksissa mainitun oikeuden maksuttomaan perusopetukseen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 16 §:n 1 momentin toisen virkkeen mukaan, oppivelvollisuudesta säädetään lailla. Perustuslakivaliokunta on todennut oppivelvollisuuden laajentamiseen antamassaan lausunnossa, että oppivelvollisuuteen kuuluva opetus on perustuslain 16 §:n 1 momentissa tarkoitettua perusopetusta (PeVL 43/2020 vp, s. 4, ks. myös PeVL 48/2021 vp, s. 2). Oppivelvollisuuden laajentamiseen annetussa lausunnossa todetaan lisäksi perustuslain 16 §:n 1 momentista seuraavan, että siinä tarkoitettu oppivelvollisuus on voitava suorittaa maksuttomassa perusopetuksessa (PeVL 43/2020 vp, s. 4). Oppivelvollisuuden laajentamista toiselle asteelle koskevassa lausunnossaan perustuslakivaliokunta on todennut, että vaikka perustuslakivaliokunta pitää hallituksen esityksestä poiketen oppivelvollisuuteen kuuluvaksi säädettyä koulutusta kokonaisuudessaan perustuslain 16 §:n 1 momentissa tarkoitettuna perusopetuksena, ei perustuslaista valiokunnan mielestä johdu, että perusopetuksen maksuttomuutta on tarkasteltava kaikilta osin yhteneväisesti koko opetuksen ajalta. Maksuttomuus voi siten sisällöltään olla erilaista esimerkiksi perusopetuslaissa tarkoitetussa opetuksessa kuin sen jälkeisessä koulutuksessa. Syynä tälle ovat paitsi oppivelvollisen ikä myös vapaa hakeutumisoikeus ja siitä seuraava eriytyminen osaamisen hankkimistavoissa (PeVL 43/2020 vp, s. 5). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on aiemmassa lausuntokäytännössään todennut, että valtiontalouden säästötavoitteet taloudellisen laskusuhdanteen aikana voivat sinänsä muodostaa hyväksyttävän perusteen puuttua jossain määrin myös perustuslaissa turvattujen oikeuksien tasoon. (PeVL 32/2014 vp, s. 2 ja PeVL 25/2012 vp, s. 3/I, PeVL 44/2014 vp). Sääntely ei kuitenkaan saa kokonaisuutena arvioiden vaarantaa perustuslaissa asetettujen velvoitteiden toteutumista. Valiokunta on myös huomauttanut, että niin sanotut perustuslailliset toimeksiannot ovat merkityksellisiä erityisesti lainsäätäjän toiminnassa ja ne on otettava huomioon myös budjettivaltaa käytettäessä. Tähän tulisi kiinnittää huomiota valtiontalouden säästöjä kohdennettaessa (PeVL 32/2014 vp, s. 2/II, ks. myös PeVM 25/1994 vp, s. 3/II ja s. 6).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksut koskisivat perustuslain 16 §:n 1 momentin piirissä olevaa toisen asteen opetusta, jolloin opetuksesta tulisi maksullista kolmannesta maasta saapuvalle opiskelijalle. Oppivelvollisuuslain 2 §:n 1 momentin mukaan Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia. Lapsi katsotaan tätä lakia sovellettaessa Suomessa vakinaisesti asuvaksi, jos hänellä on kotikuntalaissa (201/1994) tarkoitettu kotikunta Suomessa. Henkilöllä on oikeus vapautua oppivelvollisuudesta, jos hänen maassa oleskelunsa peruste on opiskelu. Asuinkunta päättää oppivelvollisuudesta vapauttamisesta hakemuksesta. Oppivelvollisuuslain 16 §:n mukaan koulutus, jolla oppivelvollisuutta suoritetaan, on maksutonta sen kalenterivuoden loppuun saakka, jolloin opiskelija täyttää 20 vuotta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan tarkennettavaksi ja laajennettavaksi toisen asteen koulutukseen osallistuvien opiskelijoiden osalta sitä alaikäisten opiskelijoiden joukkoa, jotka rajautuisivat oppivelvollisuuslain soveltamisalan ulkopuolelle. Tämä tarkoittaisi Suomessa opiskelutarkoituksessa oleskelevien kolmansien maiden kansalaisten kohdalla sitä, että heillä ei olisi oikeutta oppivelvollisuuslain 16 §:ssä säädettyyn maksuttomaan koulutukseen, vaan heidän koulutuksensa kustannukset katettaisiin opiskelijoilta perittävillä lukuvuosimaksuilla.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perusopetuksen jälkeiseen koulutukseen osallistuu jo voimassa olevan sääntelyn nojalla alaikäisiä opiskelijoita, joita ei katsota oppivelvollisuuslain mukaan oppivelvollisiksi ja jotka eivät täten ole oikeutettuja oppivelvollisuuslain 16 §:ssä säädettyyn maksuttomaan koulutukseen. Oppivelvollisuuslain soveltamisalan ulkopuolella ovat jo tällä hetkellä ne Suomessa opiskelutarkoituksessa oleskelevat henkilöt, joilla ei ole kotikuntalaissa tarkoitettua kotikuntaa. Ehdotetulla muutoksella Suomessa opiskelutarkoituksessa oleskelevat alaikäiset kolmansien maiden kansalaiset asetettaisiin yhdenvertaiseen asemaan siitä riippumatta, onko heillä kotikuntalaissa tarkoitettu kotikunta vai ei. Kotikunnan saaminen perustuu hakemukseen ja Suomessa voi oleskella tilapäisesti myös ilman kotikuntaa. Tätä opiskelijaryhmää ei asetettaisi erilaiseen asemaan perustuslain 6 §:n 2 momentissa säädetyillä lähtökohtaisesti kielletyillä erotteluperusteilla. Erottelu opiskelijoiden välillä ei perustuisi hakijan tai opiskelija alkuperään vaan Suomessa oleskelun perusteeseen. Perustuslakivaliokunnan oppivelvollisuutta ja siihen liittyvää maksuttomuutta koskeva tulkintakäytäntö huomioiden perusopetuksen jälkeisen koulutuksen voidaan katsoa olevan perustuslain 16 §:n 1 momentissa säädetyn opetuksen maksuttomuuden piirissä vain oppivelvollisuuteen kuuluvan koulutuksen osalta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslaissa tarkoitettujen sivistyksellisten oikeuksien turvaaminen ei tarkoita sivistyksellisten oikeuksien ulottamista koskemaan kaikkia maailman kansalaisia. Ehdotettu sääntely koskee Suomeen opiskelutarkoituksessa muuttaneita kolmansien maiden kansalaisia. Kolmansista maista saapuvien nuorten tulo Suomeen erityisesti lukiokoulutuksen on uusi, 2020-luvulla käynnistynyt ilmiö, jonka taustalla on suomalaisen ilmaisen koulutuksen markkinointi kolmansissa maissa sekä Suomen demografinen kehitys ja opiskelijamäärien väheneminen erityisesti väestötaantuma-alueilla. Toisen asteen koulutukseen järjestämiseen on rajalliset resurssit ja valtiontalouden tilanteesta johtuen toisen asteen koulutukseen on kohdistettu merkittäviä säästötoimenpiteitä. Lukuvuosimaksujen säätämisen taustalla on valtiontalouden tasapainottamiseen liittyvät tavoitteet, joka perustuslakivaliokunnan vakiintuneen tulkintakäytännön mukaan on hyväksyttävä peruste puuttua jossain määrin perustuslaissa turvattujen oikeuksien tasoon. Perustuslakivaliokunta on myös todennut vakiintuneessa lausuntokäytännössään, ettei yleisestä yhdenvertaisuusperiaatteesta johdu tiukkoja rajoja lainsäätäjän harkinnalle pyrittäessä kulloisenkin yhteiskuntakehityksen vaatimaan sääntelyyn. Yhteenvetona ehdotetun lainsäädännön voidaan katsoa olevan sopusoinnussa perustuslain yhdenvertaisuutta ja sivistyksellisiä oikeuksia koskevien vaatimusten kanssa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lisäksi, että ammatillisessa koulutuksessa tilauskoulutuksen järjestäminen mahdollistettaisiin EU- ja ETA-valtioiden kansalaisille ja näihin rinnastettaville. Koulutuksen tilaaja ei kuitenkaan voisi periä koulutuksen kustannuksia tilauskoulutukseen osallistuvalta opiskelijalta, joka on EU- ja ETA-valtion kansalainen tai näihin rinnastettava. Näin ollen, esityksen mukaan EU- ja ETA-valtioiden kansalaiset ja heihin rinnastettavat asetetaan muiden valtioiden kansalaisia edullisempaan asemaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tilauskoulutuksen järjestäminen muille kuin EU- ja ETA-valtion kansalaisille on ollut mahdollista ammatillisesta koulutuksesta annetun lain mukaisesti vuodesta 2018 alkaen. Nykyisin voimassa oleva tilauskoulutuslainsäädäntö erottelee opiskelijoita kansalaisuuden perusteella siten, että EU- ja ETA-valtioiden kansalaiset eivät voi osallistua ammatillisen koulutuksen tilauskoulutukseen. Esityksessä tälle ryhmälle avattaisiin yhtäläinen mahdollisuus osallistua ammatilliseen koulutukseen myös tilauskoulutuksessa. EU- ja ETA-valtioiden kansalaiset ja heihin rinnastettavat olisivat kuitenkin eri asemassa kuin muut, koska tilaaja ei voisi periä näiltä opiskelijoilta tilauskoulutuksen kustannuksia. Kustannuksista vastaisi kokonaisuudessaan tilaaja. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaltiokunta on lausuntokäytännössään katsonut, että EU- ja ETA-valtioiden ja muiden valtioiden kansalaisuuteen perustuvalle erottelulle on perustuslain 6 §:n 2 momentin edellyttämä hyväksyttävä syy. Se liittyy Suomea Euroopan unionin jäsenenä sitoviin säädöksiin ja velvoitteisiin ja rakentuu tavallaan vastavuoroisuuden varaan (PeVL 11/2009 vp s.7, PeVL 13/2009 vp s. 2). Perustuslain 6 §:n takaaman yhdenvertaisuuden kannalta ei siis ole ongelmallista, ettei tilaaja voi periä tilauskoulutuksen kustannuksia EU- ja ETA-valtion kansalaiselta tai näihin rinnastettavalta, vaikka kustannukset voi periä kolmannen maan kansalaiselta. Tätä erottelua voi perustella myös keskeisellä koulutuspoliittisella periaatteella: tutkintoon johtavan koulutuksen maksuttomuudella suomalaisille ja muille EU- jaETA-valtioiden kansalaisille. Erottelun tavoite liittyy perusoikeuksien yhteensovittamiseen ja julkisen tai yhteiskunnallisen intressin toteuttamiseen, mitä on pidetty merkityksellisenä erottelun hyväksyttävyyden kannalta (PeVL 44/2010 vp, PeVL 18/2010 vp, PeVL 46/2006 vp). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tilauskoulutusjärjestelmän laajentamisella koskemaan EU- ja ETA-valtioiden kansalaisia ja näihin rinnastettavia vastataan kansalliseen osaajapulaan. Tavoitetta voidaan pitää perusoikeuksien kannalta hyväksyttävänä. Tilauskoulutukseen osallistuvilta EU- ja ETA-valtion kansalaisilta ja näihin rinnastettavilta ei voi periä koulutuksen kustannuksia, joten tilauskoulutukseen osallistumisen mahdollistaminen myös tälle ryhmälle ei merkitse muutosta toisen asteen koulutuksen maksuttomuuteen. EU- ja ETA-valtioiden kansalaisilta ei myöskään perittäisi lukuvuosimaksuja. jolloin mahdollisuus osallistua maksuttomaan tilauskoulutukseen on yhdenmukainen muiden esitettyjen muutosten kanssa. Eduskunta on korkeakoulujen osalta hyväksynyt vastaavanlaisen säännöksen (HE 152/2018 vp.), jossa mahdollistettiin EU- ja ETA- kansalaisten osallistuminen tilauskoulutukseen. Asiasta ei tuolloin pyydetty perustuslakivaliokunnan lausuntoa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjillä ei olisi edelleenkään velvollisuutta tilauskoulutuksen järjestämiseen, vaan ne voivat järjestää sitä harkintansa mukaan. Harkinnassa on erityisesti otettava huomioon laissa säädetty tutkintokoulutuksen heikentämiskielto ja kielto järjestää koulutusta sellaiselle tilaajataholle, jolla ei ole aitoa intressiä huolehtia opiskelijoiden oikeusturvasta ja kouluttautumisesta. Tilauskoulutuksen järjestäminen säilyy jatkossakin vapaaehtoisena toimintana koulutuksen järjestäjälle. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä mainituilla perusteilla lakiehdotukset voidaan käsitellä tavallisessa lainsäätämisjärjestyksessä. Hallitus pitää kuitenkin suotavana, että perustuslakivaliokunta antaisi oppivelvollisuuslain muuttamisen osalta asiassa lausunnon.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">12.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Henkilötietojen suoja \u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan tiedonsaantioikeuksia koulutuksen järjestäjien ja Maahanmuuttoviraston välille. Hallituksen esitys on valtiosääntöoikeudellisesti merkityksellinen perustuslain 10 §:ssä turvatun yksityiselämän ja henkilötietojen suojan kannalta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 10 §:n 1 momentin mukaan henkilötietojen suojasta on säädettävä lailla. Perustuslakivaliokunnan käytännön mukaan lainsäätäjän liikkumavaraa rajoittaa lisäksi se, että henkilötietojen suoja osittain sisältyy samassa säännöksessä turvatun yksityiselämän suojan piiriin (esim. PeVL 71/2014 vp, s. 2). Perustuslakivaliokunta on vakiintuneesti katsonut, että lainsäätäjän on turvattava henkilötietojen suoja tavalla, jota voidaan pitää hyväksyttävänä perusoikeusjärjestelmän kokonaisuudessa (esim. PeVL 18/2012 vp, s. 2 ja PeVL 71/2012, s. 2). Henkilötietojen suojaa ja yksityiselämän suojaa voidaan rajoittaa perusoikeuksien yleisten rajoitusedellytysten puitteissa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on tarkistanut käytäntöään henkilötietojen suojaa koskevasta sääntelystä. Perustuslakivaliokunta on uudemmassa käytännössään pitänyt lähtökohtaisesti riittävänä perustuslain 10 §:n 1 momentin kannalta, että sääntely täyttää tietosuoja-asetuksessa asetetut vaatimukset (ks. PeVL 14/ 2018 vp, s. 3—5, PeVL 15/2018 vp, PeVL 2/2018 vp). Perustuslakivaliokunta on todennut, että henkilötietojen suojan toteuttaminen tulisi jatkossa ensisijaisesti taata tietosuoja-asetuksen ja säädettävän kansallisen yleislain nojalla. Tähän liittyen tulisi välttää kansallisen erityislainsäädännön säätämistä sekä varata sellaisen säätäminen vain tilanteisiin, joissa se on yhtäältä sallittua tietosuoja-asetuksen kannalta ja toisaalta välttämätöntä henkilötietojen suojan toteuttamiseksi (PeVL 2/2018 vp, s. 5). Perustuslakivaliokunnan mukaan lähtökohtaisesti riittävää on, että henkilötietojen suojaa ja käsittelyä koskeva sääntely on yhteensopivaa tietosuoja-asetuksen kanssa. Valiokunnan käsityksen mukaan tietosuoja-asetuksen yksityiskohtainen sääntely mahdollistaa myös viranomaistoiminnan sääntelyn osalta nykyistä kansallista sääntelymallia huomattavasti yleisemmän, henkilötietojen suojaa ja käsittelyn perusteita sääntelevän lakitasoisen sääntelyn. Valiokunta on arvioinut nykyisen henkilötietojen sääntelymallin varsin raskaaksi ja monimutkaiseksi ja viitannut siihen, että valiokunnan käytännön mukaan sääntelyn selkeyteen on syytä kiinnittää erityistä huomiota perusoikeuskytkentäisessä sääntelyssä, joka koskee luonnollisia henkilöitä heidän tavanomaiseen elämäänsä kuuluvissa toiminnoissa (ks. PeVL 31/2017 vp, PeVL 45/2016 vp, s. 3 ja PeVL 41/2006 vp, s. 4/II). Myös sääntelyn selkeyden vuoksi kansallisen erityislainsäädännön säätämiseen tulee jatkossa suhtautua pidättyvästi ja rajata sellaisen säätäminen vain välttämättömään tietosuoja-asetuksen antaman kansallisen liikkumavaran puitteissa (PeVL 14/ 2018 vp, s. 3—5). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esitettyjen lakien tarkoituksena on osaltaan palauttaa kumotussa ulkomaalaisrekisteristä annetussa laissa ollut oikeus, joka mukaan ulkomaalaisrekisteristä sai luovuttaa tietoa oppilaitoksille opiskelijoiden oleskeluluvista. Toisaalta on tarkoitus mahdollistaa toisen asteen koulutuksen järjestäjien toiminnalle tarpeellinen lukuvuosimaksullisuuden ja maksuttomuuden selvittäminen ja valvonta, ja Maahanmuuttoviraston toimintaan kuuluva maahantuloa ja maassaoleskelua koskevien ehtojen täyttymisen harkinta. Tietojen saaminen lukuvuosimaksuvelvollisuuden arvioimiseksi ja opetusryhmien järjestämiseksi on tarpeellista koulutuksen järjestäjien toiminnalle. Opiskelijalle myönnettävien oikeuksien, kuten lukuvuosimaksuttomuuden, edellytyksenä on niiden perustana olevista tosiseikoista varmistuminen. Henkilötietojen luotettavuus edellyttää niiden saamista suoraan asiaa käsittelevältä tai päätöksen tehneeltä viranomaiselta. Pykälässä käytetään tietosuoja-asetuksen 6 artiklan 3 kohdan mukaista sääntelyliikkumavaraa erityisten säännösten antamiseksi henkilötietojen luovuttamisesta. Mainitun kohdan mukaan Edellä olevan 1 kohdan c ja e alakohdassa tarkoitetun käsittelyn perustasta on säädettävä joko a) unionin oikeudessa; tai b) rekisterinpitäjään sovellettavassa jäsenvaltion lainsäädännössä. Käsittelyn tarkoitus määritellään kyseisessä käsittelyn oikeusperusteessa tai, 1 kohdan e alakohdassa tarkoitetussa käsittelyssä, sen on oltava tarpeen yleistä etua koskevan tehtävän suorittamiseksi tai rekisterinpitäjälle kuuluvan julkisen vallan käyttämiseksi. Kyseinen käsittelyn oikeusperuste voi sisältää erityisiä säännöksiä, joilla mukautetaan tämän asetuksen sääntöjen soveltamista, muun muassa: yleisiä edellytyksiä, jotka koskevat rekisterinpitäjän suorittaman tietojenkäsittelyn lainmukaisuutta; käsiteltävien tietojen tyyppiä; asianomaisia rekisteröityjä, yhteisöjä, joille ja tarkoituksia joihin henkilötietoja voidaan luovuttaa; käyttötarkoitussidonnaisuutta; säilytysaikoja; sekä käsittelytoimia ja -menettelyjä, mukaan lukien laillisen ja asianmukaisen tietojenkäsittelyn varmistamiseen tarkoitetut toimenpiteet, kuten toimenpiteet muita IX luvussa esitettyjä erityisiä tietojenkäsittelytilanteita varten. Unionin oikeuden tai jäsenvaltion lainsäädännön on täytettävä yleisen edun mukainen tavoite ja oltava oikeasuhteinen sillä tavoiteltuun oikeutettuun päämäärään nähden. Ehdotetulla sääntelyllä on edellä mainitussa kohdassa tarkoitetulla tavalla yleisen edun mukainen tavoite ja se on oikeasuhteinen sillä tavoiteltuun oikeutettuun päämäärään nähden. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto sekä lukiokoulutuksen ja ammatillisen koulutuksen järjestäjät voisivat luovuttaa toisilleen tiettyjä koulutukseen hakijan ja opiskelijan sekä ammatillisen koulutuksen osalta näiden ulkomaalaislaissa tarkoitetun perheenkokoajan oleskelulupaa koskevia tietoja. Tiedot, joita tämän lain perusteella luovutetaan, eivät sisällä tietosuoja-asetuksen 9 artiklassa tarkoitettuja erityisiä henkilötietoja. Koulutuksen järjestäjillä ei ole laajamittaisesti opiskelijoiden erityisiä henkilötietoja koskevia tietoja. Tällaisia voisivat olla lähinnä opiskeluoikeuden myöntämisen ja peruuttamisen edellytyksenä olevat terveyteen ja toimintakykyyn liittyvät tiedot ammatillisessa koulutuksessa. Mikäli Maahanmuuttovirasto tarvitsee ammatillisen koulutuksen järjestäjiltä erityisiä henkilötietoja, kuten opiskelijan terveyteen liittyvää tietoa, se voi pyytää niitä maahanmuuttohallinnon henkilötietolain 13 §:n 4 momentin 7 kohdan perusteella. Tällainen tilanne voisi tulla kyseeseen, esimerkiksi, jos koulutuksen järjestäjä on ilmoittanut Maahanmuuttovirastolle opiskelijan opintojen päättyneen ja Maahanmuuttovirasto pyytää koulutuksen järjestäjältä lisätietoja, koska opiskelija on esittänyt sen johtuneen terveydentilaan liittyneestä syystä. Koulutuksen järjestäjien ei ole tarpeen oma-aloitteisesti ilmoittaa miksi opinnot ovat päättyneet silloin kun sen tekeminen edellyttäisi erityisten henkilötietojen luovuttamista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ammatillisen koulutuksen järjestäjillä ei ole tarvetta ilmoittaa Maahanmuuttovirastolle siitä, että hakijaa ei ole valittu opintoihin terveydellisestä syystä, koska oleskelulupahakemus tehdään vasta opiskelupaikkatarjouksen jälkeen. Tässä esityksessä ehdotettu tiedonluovutusoikeus koulutuksen järjestäjiltä Maahanmuuttovirastolle on maahanmuuttohallinnon henkilötietolain säännöksistä huolimatta tarpeellinen, koska koulutuksen järjestäjät voivat sen avulla tuoda Maahanmuuttoviraston tietoon seikkoja, joita se ei muuten saisi tietoonsa tai saisi ne tietoonsa myöhemmin, jolloin valvontatoimenpiteet viivästyisivät. Vaikka tiedot eivät sisällä erityisiä henkilötietoja, ne voivat kuitenkin sisältää tiedon siitä, että henkilö on saanut Suomesta turvapaikan tai toissijaista suojelua. Tämän tiedon saaminen on koulutuksen järjestäjille tarpeellista, koska henkilön oleskeluluvan peruste vaikuttaa suoraan hänen lukuvuosimaksuvelvollisuuteensa. Henkilö, jolla on oleskelulupa kansainvälisen suojelun perusteella ei ole lukuvuosimaksuvelvollinen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen ja ammatillisen koulutuksen järjestäjä voisi saada Maahanmuuttovirastolta hakijan, opiskelijan ja perheenkokoajan voimassa olevan ja aiemmin myönnetyn oleskeluoikeutta osoittavan asiakirjan voimassaoloa, perustetta ja lajia sekä oleskeluoikeutta osoittavaa asiakirjaa koskevan hakemuksen käsittelyn tilaa koskevat tarpeelliset tiedot. Luovutettavat tiedot on lueteltu ehdotetuissa laeissa yksityiskohtaisesti ja tyhjentävästi. Luovutettavat tiedot eivät sisällä muita oleskelulupapäätöksen tietoja, kuten oleskelulupahakemusta tai oleskelulupapäätöksen perusteluja. Koulutuksen järjestäjä arvioi tietojen tarpeellisuuden sen perustella, mitä lukuvuosimaksuvelvollisuudesta vapautuminen tai henkilön oleskeluoikeuden selvittäminen edellyttää. Ammatillisen koulutuksen osalta perheenkokoajan tietojen tarkastelu on tarpeellista vain silloin, kun hakijan tai opiskelijan oleskelulupa tai lukuvuosimaksusta vapautuminen perustuu perheenkokoajan oleskelulupaan. Käsittelytilannetta ja aiempia oleskelulupia koskevaa tietoa lukuun ottamatta kaikki välitettävät tiedot käyvät ilmi oleskelulupakortista, jonka esittäminen on useissa muissakin tilanteissa asioinnin edellytyksenä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjille esitetään oikeutta sen lisäksi, mitä viranomaisten toiminnan julkisuudesta annetussa laissa tai muussa laissa säädetään, antaa salassapitosäännösten estämättä omasta aloitteestaan Maahanmuuttovirastolle oleskeluoikeutta osoittavan asiakirjan hakijan tai oleskeluoikeutta osoittavan asiakirjan haltijan maahantuloon ja maassa oleskeluun liittyviä väärinkäytösepäilyjä koskevia tietoja, jos ne ovat välttämättömiä Maahanmuuttoviraston tehtävän hoitamiseksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tiedonanto-oikeutta säädettäessä on kiinnitetty huomiota korkeimman oikeuden ennakkopäätökseen KKO:2023:24, jonka mukaan viranomaisella ei ollut oikeutta luovuttaa tietoa oma-aloitteisesti toiselle viranomaiselle edes sen lakisääteisten tehtävien hoitamista varten, kun tiedonluovutusoikeudesta ei oltu erikseen säädetty.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on arvioinut viranomaisten tietojen saamista ja luovuttamista salassapitovelvollisuuden estämättä koskevaa sääntelyä perustuslain 10 §:n 1 momentissa säädetyn yksityiselämän ja henkilötietojen suojan kannalta ja kiinnittänyt huomiota muun muassa siihen, mihin ja ketä koskeviin tietoihin tiedonsaantioikeus ulottuu ja miten tiedonsaantioikeus sidotaan tietojen välttämättömyyteen. Viranomaisen tietojensaantioikeus ja tietojenluovuttamismahdollisuus ovat voineet liittyä jonkin tarkoituksen kannalta \"tarpeellisiin tietoihin\", jos tarkoitetut tietosisällöt on pyritty luettelemaan laissa tyhjentävästi. Jos taas tietosisältöjä ei ole samalla tavoin luetteloitu, sääntelyyn on pitänyt sisällyttää vaatimus \"tietojen välttämättömyydestä\" jonkin tarkoituksen kannalta (ks. esim. PeVL 17/2016 vp, s. 2—3 ja siinä viitatut lausunnot).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunnan mielestä näiden seikkojen lisäksi on syytä kiinnittää huomiota siihen, että yksityiselämän suojaan kohdistuvia rajoituksia on arvioitava perusoikeuksien yleisten rajoitusedellytysten valossa. Valiokunta on tämän vuoksi aikaisemmin arvioinut esimerkiksi arkaluonteisten tietojen käsittelyn sallimisen koskevan yksityiselämään kuuluvan henkilötietojen suojan ydintä (PeVL 37/2013 vp, s. 2/I), minkä johdosta esimerkiksi tällaisia tietoja sisältävien rekisterien perustamista on arvioitava perusoikeuksien rajoitusedellytysten, erityisesti rajoitusten hyväksyttävyyden ja oikeasuhtaisuuden kannalta (PeVL 29/2016 vp, s. 4—5 ja esimerkiksi PeVL 21/2012 vp, PeVL 47/2010 vp sekä PeVL 14/2009 vp). Valiokunta kiinnittää huomiota siihen, että tällainen arvio on mahdollinen vain, jos hallituksen esityksessä eritellään riittävällä seikkaperäisyydellä ne syyt, joiden johdosta henkilötietojen käsittely katsotaan lakiehdotuksessa välttämättömäksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on painottanut, että erottelussa tietojen saamisen tai luovuttamisen tarpeellisuuden ja välttämättömyyden välillä on kyse tietosisältöjen laajuuden ohella myös siitä, että salassapitosäännösten edelle menevässä tietojensaantioikeudessa on viime kädessä kysymys siitä, että tietoihin oikeutettu viranomainen omine tarpeineen syrjäyttää ne perusteet ja intressit, joita tiedot omaavaan viranomaiseen kohdistuvan salassapidon avulla suojataan. Mitä yleisluonteisempi tietojensaantiin oikeuttava sääntely on, sitä suurempi on vaara, että tällaiset intressit voivat syrjäytyä hyvin automaattisesti. Mitä täydellisemmin tietojensaantioikeus kytketään säännöksissä asiallisiin edellytyksiin, sitä todennäköisemmin yksittäistä tietojensaantipyyntöä joudutaan käytännössä perustelemaan. Myös tietojen luovuttajan on tällöin mahdollista arvioida pyyntöä luovuttamisen laillisten edellytysten kannalta. Tietojen luovuttaja voi lisäksi kieltäytymällä tosiasiallisesti tietojen antamisesta saada aikaan tilanteen, jossa tietojen luovuttamisvelvollisuus eli säännösten tulkinta saattaa tulla ulkopuolisen viranomaisen tutkittavaksi. Tämä mahdollisuus on tärkeä tiedonsaannin ja salassapitointressin yhteensovittamiseksi (ks. esim. PeVL 7/2019 vp, PeVL 15/2018 vp ja PeVL 17/2016 vp, s. 6 ja siinä viitatut lausunnot).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tietosisällöt on ehdotettavien lakien tiedonsaamista koskevien pykälien 1 momenteissa kuvattu tyhjentävästi, jolloin riittävää olisi se, että tiedot ovat tarpeellisia. Oma-aloitteista tiedonluovutusta koskevissa 2 momenteissa luovutus sallittaisiin maahantulon ja maassa oleskelun ehtoihin liittyviä väärinkäytösepäilyjä koskevien tietojen osalta. Tällaisia tietoja ovat esimerkiksi tieto väärennetystä asiakirjasta tai toimeentuloedellytyksen täyttymättömyydestä. Edellytyksenä olisi lisäksi, että tiedot ovat välttämättömiä Maahanmuuttoviraston tehtävän hoitamiseksi, koska mahdollisen maahantulon ja maassa oleskelun ehtoja koskevan väärinkäytöksen osoittavia tietoja ei ole tarkoituksenmukaista luetella tyhjentävästi, sillä tavat toteuttaa väärinkäytöksiä kehittyvät jatkuvasti. Toisen momentin osalta laki on niin täsmällinen ja tarkkarajainen kun on mahdollista sen toimivuuden kannalta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirastosta annetun lain (156/1995) 2 §:ssä säädetään, että Maahanmuuttovirasto käsittelee ja ratkaisee ne ulkomaalaisia ja Suomen kansalaisuutta koskevat asiat, jotka laissa tai sen nojalla säädetään sen tehtäviksi. Kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annettua lakia muutettiin vuonna 2022 (277/2022). Kyseisen muutoksen jälkeen kolmannen maan kansalaiselle myönnetään ensimmäinen oleskelulupa opiskelun perusteella suoraan koko tutkinnon tai opintojen suorittamisen keston ajalle, jolloin oleskelulupaa ei ole tarvetta uusia määräajoin. Opiskelijoiden ei tarvitse esittää todisteita oleskeluluvan edellytysten täyttymisestä jatko-oleskeluluvan hakemisen yhteydessä, minkä vuoksi oleskeluluvan jälkivalvonta on yhä merkittävämpi oleskelun jatkuvan lainmukaisuuden varmistaja. Tehokas jälkivalvonta edellyttää riittävää tietopohjaa. Maahantuloon ja maassa oleskeluun liittyviä väärinkäytösepäilyjä koskevien tietojen luovuttaminen on välttämätöntä opiskelijoiden oleskeluluvan jatkuvan valvonnan toteuttamista varten. Maahanmuuttoviraston toiminnan kannalta välttämättöminä tietoina tulisi tiedonluovutusta koskevien momenttien osalta pitää ainakin tietoja, jotka voivat johtaa oleskeluoikeutta koskevan asiakirjan myöntämättä jättämistä, peruuttamista tai raukeamista koskevaan harkintaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tietojen luovuttaminen ei loukkaa perusoikeuden ydinalueen koskemattomuutta, huomioitavina olevien henkilötietojen ja yksityiselämän suojan osalta. Kaikki oma-aloitteisesti luovutettaviksi säädettävät tiedot ovat tietoja, joita Maahanmuuttovirasto voi tavanomaisesti saada oman toimintansa yhteydessä, mutta jotka eivät välttämättä tulisi sen tietoon, jos koulutuksen järjestäjä ei voi niitä välittää. Samoin koulutuksen järjestäjä voi saada kyseiset tiedot pyytämällä niitä hakijalta tai opiskelijalta, mutta tietojen luotettavuus sekä tietojen toimituksen nopeus ja kattavuus eivät tuolloin ole kaikissa tapauksissa turvattuja. Kaikki kyseessä olevat tiedot ovat siis tietoja, joita koulutuksen järjestäjät ja Maahanmuuttovirasto jo käsittelevät tavanomaisesti. Maahanmuuttovirasto ja koulutuksen järjestäjät ovat aiemmin jakaneet kyseisiä tietoja ennen kuin maahanmuuttohallinnon tiedonhallintalain säätäminen jätti aukon tiedonluovutusoikeuksia koskevaan lainsäädäntöön. Tarkoituksena olisi, että havaittuihin ongelmiin voitaisiin puuttua nopeammin ja kattavammin. Maahantuloa ja maassa oleskelua koskevien säännösten noudattamisen valvominen edellyttää viranomaisten ja muita julkista hallintotehtävää hoitavien yhteistyötä. Ei ole perusteltua, että väärinkäytökset jäisivät huomioimatta oleskelulupaharkinnassa sen vuoksi, että koulutuksen järjestäjillä ei olisi oikeutta tuoda toimivaltaisen viranomaisen tietoon saamiaan tietoja. Opiskelijat, joiden oleskeluoikeuden perustana olevat asiakirjat ja toimeentulo eivät ole kunnossa, ovat huomattavassa riskissä joutua ihmiskaupan ja muun hyväksikäytön uhreiksi. Heidän tilanteensa nopea selvittäminen on sekä yleisen turvallisuuden ja järjestyksen että henkilöiden oman perustuslaissa suojatun turvallisuuden vuoksi perusteltua, eikä se ole vastoin perustuslain mukaista henkilötietojen suojaa tai yksityiselämän suojaa. Ehdotetusta sääntelystä seuraavaa henkilötietojen ja yksityiselämän suojaan kohdistuvaa rajoitusta on näin ollen pidettävä hyväksyttävänä. Koulutuksen järjestäjien ja Maahanmuuttoviraston ei ole mahdollista saada esityksessä luovutettavaksi esitettyjä henkilötietoja luotettavasti, nopeasti ja resurssitehokkaasti muilla tavoilla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tietojen luovuttaminen koulutuksen järjestäjille toteutettaisiin automatisoidun tietopyynnön kautta. Vastaus tietopyyntöön voisi sisältää vain esitetyissä laeissa luetellut tiedot. Valiokunnan käsityksen mukaan katseluyhteys ei sovellu sellaiseen luovutukseen, jossa viranomaisen on arvioitava luovutettavan tiedon tapauskohtaista välttämättömyyttä (PeVL 73/2018 vp, s. 10). Lisäksi tietojen saaminen perustuu ehdotettujen lakien tiedonsaantia koskevissa pykälissä tiedon luovutuksen tarpeellisuuteen. Tietojen oma-aloitteista luovuttamista koulutuksen järjestäjiltä Maahanmuuttovirastolle ei toteutettaisi teknisen rajapinnan avulla, vaan koulutuksen järjestäjät toimittaisivat tietoja esimerkiksi turvasähköpostilla Maahanmuuttovirastolle. Valitussa toimittamistavassa ei ole katseluyhteyttä vastaavaa riskiä siitä, että luovutuksen saaja saisi liian laajasti rekisterinpitäjän tietoja nähtävilleen, vaan lähetettäväksi voidaan valita ainoastaan välttämätön tieto. Ehdotettavat lait toteuttavat perustuslain 10 §:n 1 momentin mukaisen vaatimuksen säätää henkilötietojen suojasta lailla. Vaatimus täyttyy asianmukaisesti koulutuksen järjestäjien ja Maahanmuuttoviraston välillä. Lait täyttävät myös luvussa 7 kuvatulla tavalla tietosuoja-asetuksen edellytykset. Edellä mainituilla perusteilla lakiehdotukset voidaan käsitellä tavallisessa lainsäätämisjärjestyksessä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Eduskunta on käsitellyt saman sisältöisen hallituksen esityksen HE 51/2024 vp koskien tiedonsiirtoa korkeakoulujen ja Maahanmuuttoviraston välillä. Perustuslakivaliokunta totesi tuolloin (PeVL 32/2024 vp), ettei asian käsittely perustuslakivaliokunnassa ole tarpeellinen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä mainituilla perusteilla lakiehdotukset voidaan käsitellä tavallisessa säätämisjärjestyksessä.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n   \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n   \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Ponsi\u003C/span> &nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Edellä esitetyn perusteella annetaan eduskunnan hyväksyttäviksi seuraavat lakiehdotukset:&nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv id=\"SaadosOsa\" class=\"SaadosOsa\">\n   \u003Cspan class=\"edk-title-h3\">\u003C/span>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">1.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">ammatillisesta koulutuksesta annetun lain muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span> ammatillisesta koulutuksesta annetun lain (531/2017) 33 §, 34 §:n 1 momentti, 36 §, 100 §:n 2 momentti, 104 §:n 4 momentti ja 123 §:n 1 momentti, sellaisina kuin niistä ovat 33 § osaksi laissa 233/2024 sekä 100 §:n 2 momentti, 104 §:n 4 momentti ja 123 §:n 1 momentti laissa 1078/2024, sekä &nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään \u003C/span> 73 §:ään uusi 4 momentti, 102 §:ään, sellaisena kuin se on osaksi laissa 1218/2020, uusi 6 momentti sekä lakiin uusi 105 a ja 109 b § seuraavasti: &nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">33 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Tilauskoulutus&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">\n       Koulutuksen järjestäjä voi järjestää opiskelijaryhmälle järjestämislupansa mukaista tutkintokoulutusta niin, että koulutuksen tilaa ja rahoittaa Suomen valtio, toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö ( \u003Cspan class=\"SaadosKursiiviKooste\">tilauskoulutus\u003C/span> ). &nbsp;\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjä ei saa järjestää tilauskoulutusta, jos tilaajan tarkoituksena on välittää opiskelijoita tutkinto-opiskelijoiksi siten, että opiskelijoiden välittäminen on voittoa tavoittelevaa liiketoimintaa. Koulutuksen järjestäjän on huolehdittava siitä, että tilauskoulutusta koskevassa sopimuksessa on määritelty tilauskoulutukseen osallistuvan oikeudet ja velvollisuudet ja että tilauskoulutukseen osallistuvat tuntevat ne.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">34 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Tilauskoulutukseen sovellettavat säännökset&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Tilauskoulutukseen ei sovelleta24 §:ää opetus- ja tutkintokielestä, 25 §:ää toiminta-alueesta, 26 §:ää opiskelijavuosien vähimmäismäärästä eikä 28 §:ää tutkintojen järjestämisestä taloudellisen voiton tavoittelemiseksi.&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">36 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Tilauskoulutuksen ja Euroopan talousalueen ulkopuolella järjestettävän koulutuksen rahoitus ja perittävät maksut&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Tilauskoulutus tai 35 §:ssä tarkoitettu Euroopan talousalueen ulkopuolella järjestettävä koulutus eivät saa heikentää koulutuksen järjestäjän järjestämisluvassa määrättyjen tutkintojen ja koulutuksen järjestämisedellytyksiä.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjän on perittävä 33 §:n 1 momentissa tarkoitetulta koulutuksen tilaajalta tai 35 §:n 1 momentissa tarkoitettuun koulutukseen osallistuvalta opiskelijalta vähintään koulutuksen järjestämisestä aiheutuvat kustannukset kattava maksu. Koulutuksen järjestäjän on kohdennettava tilauskoulutuksen tuotto omaan koulutustoimintaansa. Koulutuksen tilaajalla on oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta tilaajan sijaintivaltion lainsäädännön tai oman käytäntönsä mukaisia opiskelijan lähtömaan elinkustannuksiin nähden kohtuullisia maksuja.&nbsp;\u003C/div>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Tilaaja ei voi kuitenkaan periä 2 momentissa tarkoitettua maksua:&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) siltä, joka on Euroopan talousalueeseen kuuluvan valtion kansalainen eikä siltä, joka Euroopan unionin ja sen jäsenvaltioiden muun sopimuspuolen kanssa tekemän sopimuksen mukaan rinnastetaan Euroopan unionin kansalaiseen eikä tämän ulkomaalaislaissa (301/2004) tarkoitetulta perheenjäseneltä;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) siltä. jolla on ulkomaalaislaissa tarkoitettu Euroopan unionin sininen kortti eikä tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3)&nbsp;siltä, jolla on ulkomaalaislaissa tarkoitettu pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa eikä tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) siltä, jolla on jatkuva oleskelulupa;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) siltä, jolla on pysyvä oleskelulupa; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) siltä, jolla on ollut opiskelun alkaessa ulkomaalaislaissa tarkoitettu oleskelulupa tilapäisen suojelun perusteella, ja lupaa ole myöhemmin peruutettu mainitun lain 58 §:n 4 momentin perusteella. \u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Poiketen siitä mitä 3 momentin 4 kohdassa säädetään, maksu peritään kuitenkin opiskelijalta, jonka ensimmäinen oleskelulupa on myönnetty opiskelun perusteella sekä opiskelijalta, joka oleskelee Suomessa perhesiteeseen perustuvalla jatkuvalla oleskeluluvalla tilanteessa, jossa perheenkokoaja oleskelee Suomessa opiskeluun perustuvalla oleskeluluvalla tai perheenkokoaja oleskelee Suomessa jatkuvalla oleskeluluvalla, mutta hänen oleskelulupansa on myönnetty ensimmäisen kerran opiskelun perusteella.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">73 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Koulutuskorvaukset&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 1—3 momentissa säädetään, ei sovelleta 105 a §:ssä tarkoitetussa lukuvuosimaksullisessa koulutuksessa olevaan opiskelijaan. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">100 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Oikeus maksuttomaan ruokailuun&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 1 momentissa säädetään, ei sovelleta oppisopimuskoulutuksessa, työvoimakoulutuksessa eikä 105 a §:ssä tarkoitetussa lukuvuosimaksullisessa koulutuksessa olevaan opiskelijaan.&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">102 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Opintososiaaliset etuudet oppisopimuskoulutuksessa&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 1—4 momentissa säädetään, ei sovelleta 105 a §:ssä tarkoitetussa lukuvuosimaksullisessa koulutuksessa olevaan opiskelijaan.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">104 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Asuntolapaikan myöntäminen ja oikeus asuntolapaikkaan &nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 103 §:n 2 momentissa ja tämän pykälän 1 momentissa säädetään, ei sovelleta työvoimakoulutuksessa olevaan eikä 105 a §:ssä tarkoitetussa lukuvuosimaksullisessa koulutuksessa olevaan opiskelijaan.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">105 a § &nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Koulutuksesta kolmansien maiden kansalaisilta perittävä lukuvuosimaksu&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Koulutuksen järjestäjän on perittävä vähintään koulutuksen järjestämisestä keskimäärin aiheutuvat kustannukset kattava lukuvuosimaksu tässä laissa tarkoitettuun koulutukseen hyväksytyltä opiskelijalta, joka on kolmannen maan valtion kansalainen. Opiskelemaan hakeutuvalle on tiedotettava lukuvuosimaksun määräytymisestä koko opintojen keston ajalta. Lukuvuosimaksun suorittaminen on edellytys opetukseen osallistumiselle. Maksua ei kuitenkaan peritä opiskelijalta;&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) jolla on ulkomaalaislaissa tarkoitettu Euroopan unionin sininen kortti;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) jolla on ulkomaalaislaissa tarkoitettu pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa eikä tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) jolla on jatkuva oleskelulupa;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) jolla on pysyvä oleskelulupa; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) jolla on ollut opiskelun alkaessa ulkomaalaislaissa tarkoitettu oleskelulupa tilapäisen suojelun perusteella, ja lupaa ole myöhemmin peruutettu mainitun lain 58 §:n 4 momentin perusteella; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) joka osallistuu tilauskoulutukseen; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) joka on oppivelvollisuuslain 2 §:ssä tarkoitettu oppivelvollinen; taikka\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">8) jolla on tilapäinen korkeintaan vuoden mittainen oleskelulupa vaihto-opiskeluohjelmaan osallistumisen perusteella.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Poiketen siitä mitä 1 momentin 3 kohdassa säädetään, maksu peritään kuitenkin opiskelijalta, jonka ensimmäinen oleskelulupa on myönnetty opiskelun perusteella sekä opiskelijalta, joka oleskelee Suomessa perhesiteeseen perustuvalla jatkuvalla oleskeluluvalla tilanteessa, jossa perheenkokoaja oleskelee Suomessa opiskeluun perustuvalla oleskeluluvalla tai perheenkokoaja oleskelee Suomessa jatkuvalla oleskeluluvalla, mutta hänen oleskelulupansa on myönnetty ensimmäisen kerran opiskelun perusteella.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Opetus- ja kulttuuriministeriön asetuksella voidaan antaa tarkempia säännöksiä 1 momentissa tarkoitettujen lukuvuosimaksujen määräytymisen perusteista. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">109 b §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Oleskelulupia koskeva tiedonsaantioikeus&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjällä on oikeus salassapitosäännösten estämättä saada maksutta 105 a §:ssä tarkoitetun maksuvelvollisuuden arvioimista ja koulutuksen suunnittelemista varten Maahanmuuttovirastolta hakijan tai opiskelijan sekä näiden ulkomaalaislaissa tarkoitetun perheenkokoajan hakeman, voimassa olevan ja aiemmin myönnetyn oleskeluoikeutta osoittavan asiakirjan voimassaoloa, perustetta ja lajia sekä oleskeluoikeutta osoittavaa asiakirjaa koskevan hakemuksen käsittelyn tilaa koskevat tarpeelliset tiedot.&nbsp;\u003C/div>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Sen lisäksi, mitä viranomaisten toiminnan julkisuudesta annetussa laissa (621/1999) tai muussa laissa säädetään, koulutuksen järjestäjällä on salassapitosäännösten estämättä oikeus antaa Maahanmuuttovirastolle tietoja koskien maahantulon ja maassa oleskelun ehtoihin liittyviä väärinkäytösepäilyjä: &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) oleskeluoikeutta osoittavan asiakirjan hakijasta; tai\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) oleskeluoikeutta osoittavan asiakirjan haltijasta, joka on koulutuksen järjestäjän hakija tai opiskelija tai näiden ulkomaalaislaissa, tarkoitettu perheenkokoaja, \u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Edellä 2 momentissa tarkoitetun tiedonanto-oikeuden edellytyksenä on lisäksi, että tiedot ovat välttämättömiä Maahanmuuttoviraston ulkomaalaislaissa, kansalaisuuslaissa (359/2003) tai kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annetussa laissa (719/2018) säädettyjen tehtävien hoitamista varten.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">123 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Tutkinnon suorittamismahdollisuuksista ja koulutuksesta tiedottaminen&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjän on huolehdittava siitä, että tutkinnon suorittamismahdollisuuksista, annettavasta koulutuksesta, koulutukseen hakeutumisesta ja kolmansien maiden kansalaisilta perittävistä lukuvuosimaksuista on tietoa yleisesti saatavilla.&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 . Lukuvuosimaksuja koskevaa 105 a §:ää ja tiedonsaantioikeuksia koskevaa 109 b §:ää sovelletaan opiskelijoihin, jotka aloittavan opintonsa 1 elokuuta 2026 tai sen jälkeen. &nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">2.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">lukiolain muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span> lukiolain (714/2018) 9 §:n 1 ja 4 momentti, sellaisena kuin niistä on 9 §:n 1 momentti laissa 801/2024, sekä &nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään \u003C/span> lakiin uusi 34 a §, 35 §:ään, sellaisena kuin se on laissa 1217/2020, uusi 3 momentti, sekä lakiin siitä lailla 1236/2021 kumotun 60 §:n tilalle uusi 60 § seuraavasti: &nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">9 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Tilauskoulutus&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">\n       Koulutuksen järjestäjä, jonka 3 §:ssä tarkoitettuun lupaan sisältyy lupa järjestää ylioppilastutkinnosta annetun lain 25 §:ssä tarkoitettua International Baccalaureate -tutkintoon johtavaa koulutusta, saa järjestää Suomeen tuleville opiskelijoille kyseiseen tutkintoon johtavaa opetusta, jos koulutuksen tilaa ja rahoittaa toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö ( \u003Cspan class=\"SaadosKursiiviKooste\">tilauskoulutus\u003C/span> ). Koulutuksen järjestäjä ei saa järjestää tilauskoulutusta, jos tilaajan tarkoituksena on välittää opiskelijoita tutkinto-opiskelijoiksi siten, että opiskelijoiden välittäminen on voittoa tavoittelevaa liiketoimintaa. Koulutuksen järjestäjän on huolehdittava siitä, että tilauskoulutusta koskevassa sopimuksessa on määritelty tilauskoulutukseen osallistuvan oikeudet ja velvollisuudet ja että tilauskoulutukseen osallistuvat tuntevat ne. &nbsp;\n      \u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjän on perittävä koulutuksen tilaajalta tilauskoulutuksen järjestämisestä vähintään siitä aiheutuvat kustannukset kattava maksu. Maksun tulee kattaa myös 35 §:n mukaisista opintososiaalisista eduista aiheutuvat kustannukset. Koulutuksen järjestäjän on kohdennettava tilauskoulutuksesta saamansa tuotto omaan koulutustoimintaansa. Koulutuksen tilaajalla on oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta sijaintivaltionsa lainsäädännön tai oman käytäntönsä mukaisia opiskelijan lähtömaan elinkustannuksiin nähden kohtuullisia maksuja. Tilauskoulutuksena järjestettävään opetukseen ei sovelleta opetus- ja kulttuuritoimen rahoituksesta annettua lakia (1705/2009).&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">34 a §&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">\n       \u003Cspan class=\"SaadosKursiiviKooste\">Koulutuksesta kolmansien maiden kansalaisilta perittävä lukuvuosimaksu\u003C/span> &nbsp;\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjän on perittävä kolmannen maan kansalaiselta lukuvuosimaksu tässä laissa tarkoitettuun koulutukseen hyväksytyltä opiskelijalta, joka hakee oleskelulupaa opiskelun perusteella tai oleskelee maassa opiskelun perusteella myönnetyllä oleskeluluvalla. Lukuvuosimaksu peritään myös kolmannen maan kansalaiselta, joka suorittaa tässä laissa tarkoitettuja opintoja etäopetuksessa. Lukuvuosimaksun suuruus on vähintään lukiokoulutuksen keskimääräinen yksikköhinta. Jos koulutuksen järjestäjän yksikköhinta on alempi kuin lukiokoulutuksen keskimääräinen yksikköhinta, on lukuvuosimaksun suuruus vähintään koulutuksen järjestäjän yksikköhinta. Yhtä tai useampaa oppiainetta suorittamaan otetuilta opiskelijoilta perittävän maksun määrä on opintopistettä kohden keskimääräinen yksikköhinta tai sitä alempi järjestäjäkohtainen yksikköhinta jaettuna luvulla 30. Lukuvuosimaksun suorittaminen on edellytys opetukseen osallistumiselle. Lukuvuosimaksu määräytyy ensimmäisenä opiskeluvuotena voimassa olleen yksikköhinnan perusteella koko opintojen ajalle. Maksua ei kuitenkaan peritä opiskelijalta;&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">1) joka osallistuu tilauskoulutukseen; taikka&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">2) jolla on tilapäinen korkeintaan vuoden mittainen oleskelulupa vaihto-opiskeluohjelmaan osallistumisen perusteella.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">35 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Opintososiaaliset edut&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 1—2 momentissa säädetään ei sovelleta 34 a §:ssä tarkoitetussa lukuvuosimaksullisessa koulutuksessa olevaan opiskelijaan.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">60 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Oleskelulupia koskeva tiedonsaantioikeus&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Koulutuksen järjestäjällä on oikeus salassapitosäännösten estämättä saada maksutta 34 a §:ssä tarkoitetun maksuvelvollisuuden arvioimista ja koulutuksen suunnittelemista varten Maahanmuuttovirastolta hakijan tai opiskelijan hakeman ja voimassa olevan oleskeluoikeutta osoittavan asiakirjan voimassaoloa, perustetta ja lajia sekä oleskeluoikeutta osoittavaa asiakirjaa koskevan hakemuksen käsittelyn tilaa koskevat tarpeelliset tiedot.&nbsp;\u003C/div>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Sen lisäksi, mitä viranomaisten toiminnan julkisuudesta annetussa laissa (621/1999) tai muussa laissa säädetään, koulutuksen järjestäjällä on salassapitosäännösten estämättä oikeus antaa Maahanmuuttovirastolle tietoja koskien maahantulon ja maassa oleskelun ehtoihin liittyviä väärinkäytösepäilyjä: &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) oleskeluoikeutta osoittavan asiakirjan hakijasta; tai\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) oleskeluoikeutta osoittavan asiakirjan haltijasta, joka on koulutuksen järjestäjän hakija tai opiskelija.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Edellä 2 momentissa tarkoitetun tiedonanto-oikeuden edellytyksenä on lisäksi, että tiedot ovat välttämättömiä Maahanmuuttoviraston ulkomaalaislaissa, kansalaisuuslaissa (359/2003) tai kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annetussa laissa (719/2018) säädettyjen tehtävien hoitamista varten.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 . Lukuvuosimaksuja koskevaa 34 a §:ää ja tiedonsaantioikeuksia koskevaa 60 §:ää sovelletaan lain voimaan tulon jälkeen opintonsa aloittaviin.&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">3.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">opetus- ja kulttuuritoimen rahoituksesta annetun lain muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span> opetus- ja kulttuuritoimen rahoituksesta annetun lain (1705/2009) 24 §:n 1 momentti, 31 §:n 1 momentin 7 ja 8 kohta ja 49 §:n 1 momentti, sellaisina kuin ne ovat, 24 §:n 1 momentti laissa 803/2024, 31 §:n 1 momentin 7 ja 8 kohta laissa 1410/2014 sekä 49 §:n 1 momentti laissa 532/2017, sekä &nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään\u003C/span> 31 §:n 1 momenttiin, sellaisena kuin se on laeissa 1410/2014, 532/2017 ja 1114/2021, uusi 9 kohta seuraavasti: &nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">24 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Lukiokoulutuksen yksikköhinnat&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Lukiokoulutuksen yksikköhinnat opiskelijaa kohden lasketaan vuosittain kaikille koulutuksen järjestäjille lukiolaissa ja oppivelvollisuuslaissa tarkoitetun lukiokoulutuksen sekä lukiokoulutuksen järjestäjän järjestämän tutkintokoulutukseen valmentavan koulutuksen järjestämisestä yksikköhintojen määräämistä edeltänyttä vuotta edeltäneenä vuonna aiheutuneiden valtakunnallisten kokonaiskustannusten perusteella, joista on ensin vähennetty 1,44 prosenttia lukion erityisen koulutustehtävän lisärahoitusta varten. Yksikköhintoja laskettaessa ei kuitenkaan oteta huomioon ulkomailla järjestetystä opetuksesta aiheutuneita menoja eikä mainittua opetusta saavia opiskelijoita. Yksikköhintoja laskettaessa ei myöskään oteta huomioon lukiolain 9 §:ssä tarkoitetun tilauskoulutuksen opiskelijoita eikä lukiolain 34 a §:ssä tarkoitettuja lukuvuosimaksuvelvollisia opiskelijoita. Yksikköhintoja laskettaessa niiden opiskelijoiden lukumäärä, jotka opiskelevat tutkintokoulutukseen valmentavassa koulutuksessa, painotetaan kertoimella 1,17. Yksikköhintoja laskettaessa niiden opiskelijoiden lukumäärää, jotka opiskelevat aikuisille tarkoitetussa lukiokoulutuksessa, painotetaan kertoimella 0,615 lukuun ottamatta sisäoppilaitoksessa koulutusta saavia opiskelijoita.&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">31 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Yksikköhintoja laskettaessa huomiotta jätettävät kustannukset &nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Lukion ja opetustuntiperusteisesti rahoitettavan taiteen perusopetuksen käyttökustannuksina ei pidetä:&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) 1 §:ssä mainittujen lakien mukaisen toiminnan järjestäjän maksullisen palvelutoiminnan kustannuksia; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">8) muita kuin välittömästi 1 §:ssä mainittujen lakien mukaisen toiminnan järjestämisestä aiheutuneita hallintokustannuksia; eikä\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">9) lukiolain 9 §:ssä tarkoitetun tilauskoulutuksen tai lukiolain 34 a §:ssä tarkoitetun lukuvuosimaksullisen koulutuksen järjestämisestä aiheutuneita kustannuksia.\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">49 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Rahoituksen laskemisessa käytettävien suoritteiden määrän vahvistaminen&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Opetus- ja kulttuuriministeriö vahvistaa ammatillisen koulutuksen seuraavan varainhoitovuoden 32 a §:n 2 momentin perusteella määräytyvän laskennallisen perusrahoituksen perusteena käytettävien suoritteiden määrän sekä 32 i §:n 1 momentissa tarkoitettujen arvonlisäverokorvausten euromäärän koulutuksen järjestäjien 58 §:n nojalla toimittamien tietojen perusteella. Suoritteita ei oteta huomioon rahoituksessa, jos opiskelija on ammatillisesta koulutuksesta annetun lain 105 a §:ssä tarkoitettu lukuvuosimaksuvelvollinen opiskelija tai koulutus on muutoin kuin laskennallisella perusrahoituksella tai harkinnanvaraisella rahoituksella rahoitettu. Ne suoritteet, joita ei ole ilmoitettu säädetyssä määräajassa, voidaan jättää rahoituksen perusteena huomioon ottamatta.&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">4.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">oppivelvollisuuslain 2 §:n muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span> oppivelvollisuuslain (1214/2020) 2 §:n 1 momentti, sellaisena kun se on laissa (715/2022), seuraavasti: &nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">2 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Oppivelvollisuuden alkaminen ja päättyminen&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia. Lapsi katsotaan tätä lakia sovellettaessa Suomessa vakinaisesti asuvaksi, jos hänellä on kotikuntalaissa (201/1994) tarkoitettu kotikunta Suomessa. Kolmansien maiden kansalaiset, jotka oleskelevat Suomessa opiskelutarkoituksessa, eivät kuitenkaan ole Suomessa oppivelvollisia. Muutoin henkilöllä on oikeus vapautua oppivelvollisuudesta, jos hänen maassa oleskelunsa peruste on opiskelu. Asuinkunta päättää oppivelvollisuudesta vapauttamisesta hakemuksesta.&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">5.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annetun lain 7 a §:n muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span> kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annetun lain (719/2018) 7 a §:n 2 momentin 1 kohta, sellaisena kuin se on laissa 277/2022, \u003Cspan class=\"SaadosKursiiviKooste\"> \u003C/span> seuraavasti: &nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">7 a §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansallisen oleskeluluvan myöntäminen opiskelua varten&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Kolmannen maan kansalaiselle myönnetään kansallinen oleskelulupa opiskelua varten, jos hänet on hyväksytty opiskelijaksi Suomessa sijaitsevaan:&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">1) muuhun oppilaitokseen kuin korkeakouluun, jos opiskelu johtaa tutkintoon tai ammattiin ja hän on suorittanut koulutuksen järjestäjän vaatimat maksut; tai&nbsp;\u003C/div>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"AllekirjoitusOsa\" class=\"AllekirjoitusOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingissä 9.10.2025&nbsp;\u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">Pääministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Petteri&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Orpo&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">Opetusministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Anders&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Adlercreutz&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2025-AK-60592",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\">Pysyväisosoitteet\u003C/span>\n \u003Cul class=\"navbar-nav nav\">\n  \u003Cli>\u003Cbutton value=\"/valtiopaivaasiakirjat/HE+143/2025\" id=\"copy-html-permalink\">Kopioi HTML-osoite\u003C/button>\u003C/li>\n  \u003Cli>\u003Cbutton value=\"/pdf/HE+143/2025\" id=\"copy-pdf-permalink\">Kopioi PDF-osoite\u003C/button>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"SisallysluetteloTitle\">Sisällysluettelo\u003C/span>\n \u003Cul id=\"Sisallysluettelo\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"#IdentifiointiOsa\">Identifiointiosa\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#SisaltoKuvaus\">Asian kuvaus\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PerusteluOsaPerustelut\">Perustelut\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PonsiOsa\">Ponsiosa\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#SaadosOsa\">Säädösosa\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#AllekirjoitusOsa\">Allekirjoittajat\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n \u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/edktunnus/EDK-2025-AK-60592/pdf\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/riksdagshandlingar/RP+143/2025\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"KasittelytiedotTitle\">Käsittelytiedot\u003C/span>\n \u003Cul id=\"Kasittelytiedot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%20143%2F2025%20vp\" class=\"navilink\">HE 143/2025 vp\u003C/a>\u003C/li>\n \u003C/ul>\n\u003C/nav>"},uses:{params:["edktunnus"]}}],
							form: null,
							error: null
						});
					});
				}
