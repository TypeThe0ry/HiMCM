 vastustivat lukuvuosimaksujen käyttöönottoa, vastustivat usein myös rahoituslain muutoksia.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oppivelvollisuuslain muutokset \u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Oppivelvollisuuslain muutokset liittyvät ehdotukseen lukuvuosimaksuista. Lausuntopalaute muutoksista oli sekä myönteistä että kielteistä. Tahot, jotka vastustivat lukuvuosimaksujen käyttöönottoa, vastustivat usein myös oppivelvollisuuslain muutoksia. Opetusalan keskusliitto OAJ ja Tampereen kaupunki nostivat esille, että oppivelvollisuuden piiriin kuuluvista opiskelijoista tulisi säätää tyhjentävästi oppivelvollisuuslaissa. Viittaus ammatillisesta koulutuksesta annetun lain ja lukiolain lukuvuosimaksuvelvollisuutta koskeviin säännöksiin tekee sääntelystä epäselvän. Esityksen jatkovalmistelussa esitystä muutettiin siten, että oppivelvollisuuden soveltamisalasta säädetään yksinomaan oppivelvollisuuslaissa. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Muut huomiot\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Vammaisfoorumi totesi lausunnossaan, ettei esityksessä ole arvioitu vaikutuksia vammaisiin lainkaan. Esityksen jatkovalmistelussa vaikutusarviointiin lisättiin kappale koskien vaikutuksia vammaisiin.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yritystukineuvottelukunnan lausunto\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Hallituksen esityksestä pyydettiin yritystukineuvottelukunnan lausunto siltä osin, kuin esitys koskee ammatillisen koulutuksen tilauskoulutusta ja poikkeusta kuntien ja kuntayhtymien velvoitteeseen yhtiöittää toimintansa järjestäessään tilauskoulutusta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yritystukineuvottelukunta totesi lausunnossaan, että Euroopan unionin toiminnasta tehdyn sopimuksen (SEUT) 107 artiklan 1 kodan valtiontuen määritelmän katsotaan koostuvan neljästä kumulatiivisesta kriteeristä. Kriteerien mukaan valtiontuesta on kysymys silloin, kun julkisia varoja kanavoidaan julkisiin tai yksityisiin, taloudellista toimintaa harjoittaviin yrityksiin; etu on valikoiva, eli kohdistuu vain tiettyihin yrityksiin tai tuotannonalaan; toimenpide vääristää tai uhkaa vääristää kilpailua suosimalla tuensaajaa; ja toimenpide vaikuttaa jäsenvaltioiden väliseen kauppaan. Euroopan komission julkaiseman käsitetiedonannon mukaan valtiontukisääntöjä sovelletaan ainoastaan, kun tuensaaja on yritys. Lausunnossa todetaan, että yrityksen määrittely on laaja-alainen. Yrityksellä tarkoitetaan taloudellista toimintaa markkinoilla harjoittavaa yksikköä riippumatta sen oikeudellisesta muodosta tai rahoitustavasta. Määritelmän mukaan myös julkisen sektorin toimija voi täyttää valtiontukisääntöjen mukaisen yrityksen määritelmän, mikäli se harjoittaa taloudellista toimintaa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lausunnossa todetaan, että valtiontukisääntöjä ei sovelleta tilanteessa, jossa valtio toimii julkisen vallan käyttäjänä. Valtion rahoittaman ja valvoman kansallisen koulutusjärjestelmän puitteissa järjestettyä julkista koulutusta voidaan pitää muun kuin taloudellisena toimintana. Julkisten koulutuspalveluiden järjestäminen ei kuitenkaan lausunnon mukaan tarkoita sitä, ettei niiden järjestäjä voisi harjoittaa myös taloudellista toimintaa markkinoilla. Valtiontuen käsitetiedonannon mukaan julkiset koulutuspalvelut on erotettava palveluista, jotka rahoitetaan pääasiassa oppilaiden tai heidän vanhempiensa maksuilla tai kaupallisilla tuloilla. Joissakin jäsenvaltioissa julkisyhteisöt voivat tarjota koulutuspalveluja, joita on niiden rahoitusrakenteen ja kilpailevien yksityisten laitosten olemassaolon vuoksi pidettävä taloudellisina palveluina Koska tilauskoulutus rahoitetaan kokonaisuudessaan koulutuksen tilaajalta perityillä maksuilla, ja markkinoilla toimii myös yksityisiä tahoja, jotka tarjoavat vastaavia tilattavia koulutuspalveluita, on kuntien ja kuntayhtymien tilauskoulutusta pidettävä taloudellisena toimintana.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Jäsenvaltion myöntämä taikka valtion varoista myönnettävä tuki voi olla suoraa avustusta, lainaa tai takausta sekä tilanne, jossa valtio luopuu sille tuloutettavista varoista. Etuna voidaan pitää mitä tahansa taloudellista hyötyä, jota yritys ei olisi voinut saada tavanomaisissa markkinaolosuhteissa. Lausunnossa todetaan, että koska kuntien ja kuntayhtymien toiminnan perustuu pääsääntöisesti kokonaisuudessaan julkiseen rahoitukseen ja ne nauttivat konkurssisuojasta sekä yhteisöveroeduista, muodostaisi tämä kunnille ja kuntayhtymille sellaisen edun, jota niiden kanssa kilpailevilla yksityisillä tilauskoulutuksen järjestäjillä ei ole. Euroopan komissio on katsonut esimerkiksi valtionliikelaitos Destian saamaa valtiontukea koskevassa päätöksessään liikelaitoksen konkurssisuojan sekä veroedut kielletyksi valtiontueksi. Lisäksi lausunnossa todetaan, että ehdotettu lainsäädäntömuutos kohdistuisi kaikista tilauskoulutuksen järjestäjistä vain kuntiin ja kuntayhtymiin, jotka järjestävät tilauskoulutusta. Muutos olisi lausunnon mukaan valikoiva. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhtiöittämispoikkeuksesta säätämisen tulee lausunnon mukaan täyttää myös kilpailu- ja kauppavaikutuskriteerit, jotta valtiontuen kriteerit täyttyvät. Lausunnossa todetaan, että valtiontukisääntöjen mukaan kilpailu- ja kauppavaikutuskriteerien täyttymiseen riittää, että tukitoimenpide on omiaan vaikuttamaan kauppaan ja parantamaan tuensaajan kilpailuasemaa verrattuna sen kanssa kilpaileviin yrityksiin. Tämä tarkoittaa lausunnon mukaan käytännössä tilannetta, jossa valtio myöntää taloudellista etua yritykselle kilpailulle vapautetulla alalla, jolla on tai voisi olla kilpailua. Kauppavaikutuskriteerin osalta lausunnossa todetaan, että tuen on katsottava vaikuttavan jäsenvaltioiden väliseen kauppaan, kun tuki vahvistaa yrityksen asemaa jäsenvaltioiden välisessä kaupassa verrattuna muihin kilpaileviin yrityksiin. Tuen määrällä ei lausunnon mukaan ole merkitystä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäksi lausunnossa todetaan olevan keskeistä valtiontuen kilpailu- ja kauppavaikutuskriteerien täyttymisen arvioimisessa olevan toimenpiteen rajat ylittävä elementti. Toimenpiteen on siis kytkeydyttävä yhtä jäsenvaltiota laajemmin EU:n jäsenvaltioiden väliseen kauppaan ja kilpailuun. Ehdotetun lakimuutoksen jälkeen tilauskoulutusta voi suunnata kotimaan ja kolmansien maiden lisäksi myös muihin EU- ja ETA-valtioihin. Lausunnossa todetaan, että kunnat ja kuntayhtymät kilpailevat tällaisessa tilanteessa koulutuksen järjestämisessä yksityisten järjestäjien kanssa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lausunnossa arvioidaan, että esitetyssä muodossaan lainsäädäntömuutos ”Yhtiöittämisvelvoitteesta vapauttaminen” täyttänee EU:n lainsäädännön mukaiset valtiontuen edellytykset ennen kaikkea silloin, jos kunnat tai kuntayhtymät järjestävät yhtiöittämättömässä muodossa tilauskoulutuksia muissa EU-maissa. Ehdotettu lainsäädäntömuutos edellyttää Euroopan komission informointia ja sen varmistusta, että toimenpide on yhteensopiva EU:n valtiontukisääntöjen kanssa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lausunnon perusteella ehdotus yhtiöittämisvelvoitteesta luopumisesta poistettiin hallituksen esityksestä ja asian käsittelyä jatketaan myöhemmässä vaiheessa. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Säännöskohtaiset perustelut\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Laki ammatillisesta koulutuksesta\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">33 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Tilauskoulutus.\u003C/span> Voimassa olevan 1 momentin mukaan koulutuksen järjestäjä voi järjestää opiskelijaryhmälle järjestämisluvassa määrättyjä tutkintoja ja tutkinnon osia sekä niihin valmistavaa tutkintokoulutusta niin, että koulutuksen tilaa ja rahoittaa Suomen valtio, toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö ( \u003Cspan class=\"KursiiviTeksti\">tilauskoulutus\u003C/span> ). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän \u003Cspan class=\"KursiiviTeksti\">1 momenttia\u003C/span> ehdotetaan muutettavan siten, että tutkintojen, tutkinnon osien ja niihin valmistavan tutkintokoulutuksen sijaan momentissa viitataan ”järjestämisluvan mukaiseen tutkintokoulutukseen”. Muutoksella on tarkoitus täsmentää, että tilauskoulutus on sidottu nimenomaan ammatillisesta koulutuksesta annetun lain 22 §:ssä tarkoitettuun järjestämislupaan. Muutoksella olisi myös tarkoitus täsmentää sitä, että tilauskoulutuksena voidaan järjestää nimenomaisesti tutkintokoulutusta, ei esimerkiksi valmentavia koulutuksia tai lain 8 §:ssä tarkoitettuja koulutuksia. Ammatillisesta koulutuksesta annetun lain 3 §:ssä säädetään määritelmistä, ja sen 2 kohdan mukaan tutkintokoulutuksella tarkoitetaan ammatillisen osaamisen hankkimiseksi tarvittavaa koulutusta, jonka tavoitteena on ammatillisen tutkinnon taikka ammatillisen tutkinnon osan tai osien suorittaminen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Voimassa olevan 2 momentin mukaan tilauskoulutusta ei voida järjestää Euroopan talousalueeseen kuuluvien valtioiden kansalaisille eikä niille, jotka Euroopan unionin ja sen jäsenvaltioiden muun sopimuspuolen kanssa tekemän sopimuksen mukaan rinnastetaan Euroopan unionin kansalaisiin, eikä edellä mainittujen perheenjäsenille. Tilauskoulutusta ei myöskään voida järjestää niille, joilla on ulkomaalaislaissa (301/2004) tarkoitettu Euroopan unionin sininen kortti, jatkuva tai pysyvä oleskelulupa tai pitkään oleskelleen kolmannen maan kansalaisen EU oleskelulupa, eikä edellä mainittujen perheenjäsenille. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että jatkossa tilauskoulutusta voisi järjestää myös EU- ja ETA-valtioiden kansalaisille ja muille voimassa olevassa 2 momentissa tarkoitetuille henkilöille. Voimassa olevan 2 momentin sisältö ehdotetaan näin ollen poistettavaksi. Tilauskoulutuksen kohderyhmän laajentaminen toisi uusia mahdollisuuksia tilaajan tarpeisiin sopivan tutkinnon hankkimiseen. Ratkaisu varmistaisi suomalaisten ja muiden EU- ja ETA-valtion kansalaisten sekä EU- ja ETA-valtioiden ulkopuolisten maiden kansalaisten yhdenvertaiset mahdollisuudet osallistua tilaajan maksamaan koulutukseen. EU- ja ETA- valtioiden kansalaisilta ei kuitenkaan edelleenkään voisi periä maksuja tilauskoulutukseen osallistumisesta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 2 momentin mukaan koulutuksen järjestäjä ei saa järjestää tilauskoulutusta, jos tilaajan tarkoituksena on välittää opiskelijoita tutkinto-opiskelijoiksi siten, että opiskelijoiden välittäminen on voittoa tavoittelevaa liiketoimintaa. Lisäksi pykälään ehdotetaan lisättävän, että koulutuksen järjestäjän on huolehdittava siitä, että tilauskoulutusta koskevassa sopimuksessa on määritelty tilauskoulutukseen osallistuvan oikeudet ja velvollisuudet, ja että tilauskoulutukseen osallistuvat ovat niistä tietoisia. Lisäysten tarkoituksena on selventää voimassa olevaa sääntelyä. Täsmennyksillä pyritään puuttumaan tilauskoulutuksessa havaittuihin epäkohtiin muun muassa tilauskoulutussopimusten sisällössä ja opiskelijoiden tietoisuudesta omasta asemastaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 1 momentin mukaan koulutuksen tilaajana voi toimia Suomen valtio, EU:n tai ETA:n jäsenvaltio, ETA:n ulkopuolinen valtio, kansainvälinen järjestö, suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö. Tilaajana ja rahoittajana voisi tyypillisesti olla Euroopan ulkopuolinen valtio, joka haluaa kouluttaa ryhmän kansalaisiaan suomalaisessa ammatillisessa koulutuksessa tiettyyn tutkintoon. Mahdollista olisi myös järjestää tilauskoulutusta kehitysavun tai muun kansainvälisen taloudellisen avun yhteydessä niin, että tilaajana olisi Suomen valtio, joku muu valtio taikka kansainvälinen järjestö. Lisäksi olisi mahdollista, että koulutuksen tilaisi missä tahansa kotipaikan omaava yksityinen yritys omalle henkilöstölleen. Tilauskoulutuksen tarkoituksena on näin ollen, että tilaaja on joko taho, jolla on intressi koulutusta tilaamalla saada osaajia omaan käyttöönsä, kuten yritys, joka kouluttaa työntekijöitään taikka julkinen taho tai järjestösektorin toimija, jolla on intressi yleisesti edistää ihmisten kouluttautumista. Tilauskoulutuksen määritelmään kuuluu myös se, että tilaaja rahoittaa koulutuksen. Tilaajan ammatillisesta koulutuksesta annetun lain mukainen hyväksyttävä intressi ei voisi olla yleinen intressi, kuten työvoiman saaminen työvoimapula-aloille tai heikoista taloudellisista tai yhteiskunnallisista oloista tulevien henkilöiden aseman parantaminen. Tilaajan intressin tulisi lähtökohtaisesti liittyä sen omaan toimintaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tilauskoulutusta on lain voimassa olon aikana järjestetty tavalla, jossa tilaajana toimii taho, jonka liiketoimintaa on nimenomaisesti opiskelijoiden välittäminen ammatilliseen koulutukseen ja mahdollisesti lisäksi siihen liittyvien palveluiden myyminen, kuten haku- ja maahantulojärjestelyissä avustaminen. Tällaiset tilaajat ovat myös perineet koulutuksen järjestäjälle maksamansa maksut täysimääräisesti tai merkittäviltä osin koulutukseen osallistuvilta opiskelijoilta. Tilauskoulutuksen ryhmät ovat koostuneet henkilöistä, joilla ei ole yhdistävää tekijää, kuten tilaajan palveluksessa toimimista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ammatillisen koulutuksen järjestäjillä säilyisi edelleen mahdollisuus käyttää erilaisia koulutusagentteja ja -toimijoita koulutuksensa markkinoimiseen. Tällainen agentti ei kuitenkaan voi toimia koulutuksen tilaajana, vaan opiskelijan tulee joko hakeutua koulutukseen omaehtoisesti vapaan hakeutumisen kautta tai tilaajan tulee olla laissa kuvattu hyväksyttävä taho. Esimerkiksi tilaajana voisi olla hyvinvointialue. Se voisi käyttää tilauskoulutusryhmää kootessaan apuna konsulttia, joka hoitaisi koulutuksen markkinoinnin ja osallistujien etsimisen, mikä jälkeen hyvinvointialue valitsisi opiskelijaryhmän. Koulutuksen järjestäjän solmisi tilauskoulutusta koskevan sopimuksen hyvinvointialueen kanssa, varmistaisi opiskelijoiden kelpoisuuden ja mahdollinen maksuliikenne kulkisi ilman välittäjän tai konsultin osallistumista. On kuitenkin huomioitava, että lähtökohtana on silti, että tilaaja rahoittaa koulutuksen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lain tärkeänä tavoitteena on opiskelijoiden varojen turvaaminen epäluotettavilta välikäsiltä. Huomioitavaa on myös, että vaikka tilaaja voi periä opiskelijoilta lainsäädäntönsä sallimia maksuja, tilaajan pitäisi pääsääntöisesti osallistua myös taloudellisin panostuksin opiskelijoiden kouluttamiseen. Tilaajan hyväksyttävä intressi ei voi yrityksen toimiessa tilaajana olla yleinen intressi, kuten työvoiman saaminen työvoimapula-aloille tai heikoista taloudellisista tai yhteiskunnallisista oloista tulevien henkilöiden aseman parantaminen, jos tilaaja perii koulutuksen järjestäjälle maksamansa maksut merkittäviltä osin takaisin opiskelijoilta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Voimassa olevan pykälän 3 momentissa todetaan, että tilauskoulutukseen ei sovelleta, mitä 70–79 ja 95 §:ssä säädetään, jos tilauskoulutus järjestetään muualla kuin Suomessa. Tilauskoulutukseen ei muutoin sovelleta, mitä 10 luvussa säädetään. Kyseinen momentti ehdotetaan poistettavan tarpeettomana, sillä saman sisältöinen momentti löytyy ammatillisesta koulutuksesta annetun lain 34 §:n viimeisestä momentista, johon ei ehdoteta muutoksia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">34 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Tilauskoulutukseen sovellettavat säännökset.\u003C/span> Pykälässä säädetään tilauskoulutukseen sovellettavista säännöksistä. Pykälän 1 momentin mukaan tilauskoulutukseen ei sovelleta, mitä 24 §:ssä säädetään opetus- ja tutkintokielestä, 25 §:ssä toiminta-alueesta ja 26 §:ssä opiskelijavuosien vähimmäismäärästä. Pykälään ehdotetaan lisättävän, että tilauskoulutukseen ei myöskään sovelleta mitä lain 28 §:ssä säädetään tutkintojen tai koulutuksen järjestämisestä taloudellisen voiton tavoittelemiseksi. Ehdotettu muutos vastaa nykytilaa, jossa tilauskoulutusta järjestetään liiketaloudellisin periaattein, ja se lisätään lakiin selkeyden vuoksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">36 §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Tilauskoulutuksen ja Euroopan talousalueen ulkopuolella järjestettävän koulutuksen rahoitus ja perittävät maksut. \u003C/span> Pykälässä säädetään tilauskoulutuksesta perittävistä maksuista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän \u003Cspan class=\"KursiiviTeksti\">1 momentin\u003C/span> mukaan tilauskoulutus tai 35 §:ssä tarkoitettu Euroopan talousalueen ulkopuolella järjestettävä koulutus eivät saa heikentää koulutuksen järjestäjän järjestämisluvassa määrättyjen tutkintojen ja koulutuksen järjestämisedellytyksiä. Momenttiin ei ehdoteta muutoksia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän \u003Cspan class=\"KursiiviTeksti\">2 momentin \u003C/span> mukaan koulutuksen järjestäjän on perittävä tilauskoulutuksen tilaajalta vähintään koulutuksen järjestämisestä aiheutuvat kustannukset kattava maksu. Koulutuksen tilaajalla on oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta tilaajan sijaintivaltion lainsäädännön tai oman käytäntönsä mukaisia maksuja. Momenttia ehdotetaan täsmennettävän siten, että koulutuksen tilaajalla olisi oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta tilaajan sijaintivaltion lainsäädännön tai oman käytäntönsä mukaisia opiskelijan lähtömaan elinkustannuksiin nähden kohtuullisia maksuja. Maksujen suuruuden osalta viitattaisiin siis lähtömaan elinkustannuksiin, joihin nähden opiskelijalta perittävien maksujen tulisi olla kohtuullisia. Momenttia ehdotetaan lisäksi täsmennettävän siten, että koulutuksen järjestäjän on kohdennettava tilauskoulutuksesta saamansa tuotto omaan koulutustoimintaansa. Säännös vastaa lukiolain tilauskoulutusta koskevaa säännöstä ja yhtenäistäisi näin tilauskoulutuksen sääntelyä toisella asteella. Tilauskoulutus itsessään voi olla voittoa tavoittelevaa toimintaa, mutta mahdolliset voitot tulisi kohdentaa koulutuksen järjestäjän omaan koulutustoimintaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälään ehdotetaan lisättävän uusi \u003Cspan class=\"KursiiviTeksti\">3 momentti\u003C/span> , jonka mukaan tilaaja ei voisi kuitenkaan periä 2 momentissa tarkoitettua maksua EU- ja ETA-valtioiden kansalaisilta, eikä tietyiltä muiltakaan momentissa mainituilta tahoilta. Sääntely vastaisi jäljempänä ehdotettavaa 105 a §:ää, jossa säädetään kolmansien maiden kansalaisten lukuvuosimaksuvelvollisuudesta. Ehdotettavan momentin mukaan 2 momentissa tarkoitettua maksua ei voisi periä siltä, joka on Euroopan talousalueeseen kuuluvan valtion kansalainen eikä siltä, joka Euroopan unionin ja sen jäsenvaltioiden muun sopimuspuolen kanssa tekemän sopimuksen mukaan rinnastetaan Euroopan unionin kansalaiseen tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Maksua ei voisi periä siltä. jolla on ulkomaalaislaissa tarkoitettu Euroopan unionin sininen kortti tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Maksua ei myöskään voisi periä siltä, joka on Suomen kansalaisen ulkomaalaislaissa tarkoitettu perheenjäsen tai siltä, jolla on ulkomaalaislaissa tarkoitettu pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Maksua ei voisi periä siltä, jolla on pysyvä tai jatkuva oleskelulupa, eikä siltä, jolla on ollut opiskelun alkaessa ulkomaalaislaissa tarkoitettu oleskelulupa tilapäisen suojelun perusteella, eikä lupaa ole myöhemmin peruutettu mainitun lain 58 §:n 4 momentin perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Säännös varmistaisi sen, että suomalaisille tai muille EU- ja ETA-valtioiden kansalaisille tutkintokoulutus olisi tilauskoulutuksenakin järjestettynä aina maksutonta. Tilaajan vastuulla olisi varmistaa, että se perisi maksuja vain niiltä, joilta maksuja lain mukaan saa periä. Koulutuksen järjestäjän ja tilaajan väliseen sopimukseen olisi mahdollista sisällyttää määräykset sanktioista, mikäli koulutuksen järjestäjän tietoon tulee, että tilaaja ei noudata lain määräyksiä maksujen perimisestä. Ammatillista koulutusta koskevalla lainsäädännöllä ei voida rajoittaa työnantajan ja työntekijän vapautta sopia keskenään siitä, että työntekijä sitoutuu koulutuksen saamisen vastineeksi esimerkiksi pysymään määräajan työnantajan palveluksessa ja maksamaan korvauksen, ellei hän täytä sitoumustaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">73&nbsp;§.\u003C/span> &nbsp; \u003Cspan class=\"KursiiviTeksti\">Koulutuskorvaukset.\u003C/span> Pykälässä säädetään työnantajalle maksettavista koulutuskorvauksista. Pykälään ehdotetaan lisättävän uusi 4 momentti, jonka mukaan 105 a §:ssä tarkoitettuun lukuvuosimaksulliseen koulutukseen osallistuvista opiskelijoista ei olisi mahdollista saada koulutuskorvauksia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">100 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Oikeus maksuttomaan ruokailuun. \u003C/span> Pykälässä säädetään perustutkinto-opiskelijoiden ja työhön ja itsenäiseen elämään valmentavassa koulutuksessa olevien opiskelijoiden oikeudesta maksuttomaan ateriaan. Pykälän 2 momenttia ehdotetaan muutettavan siten, että siihen lisätään viittaus ehdotettuun 105 a §:ään. Pykälässä tarkoitettuun lukuvuosimaksulliseen koulutukseen osallistuvilla ei olisi oikeutta maksuttomaan ruokailuun. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">102&nbsp;§.\u003C/span> &nbsp; \u003Cspan class=\"KursiiviTeksti\">Opintososiaaliset etuudet oppisopimuskoulutuksessa. \u003C/span> Pykälässä säädetään opintososiaalisista eduista oppisopimuskoulutuksessa. Pykälään ehdotetaan lisättävän uusi 6 momentti, jonka mukaan 105 a §:ssä tarkoitettuun lukuvuosimaksulliseen koulutukseen osallistuvilla opiskelijoilla ei olisi oikeutta opintososiaalisiin etuuksiin oppisopimuskoulutuksessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">104&nbsp;§.\u003C/span> &nbsp; \u003Cspan class=\"KursiiviTeksti\">Asuntolapaikan myöntäminen ja oikeus asuntolapaikkaan. \u003C/span> Pykälässä säädetään asuntolapaikan myöntämisen perusteista ja opiskelijoiden oikeudesta asuntolapaikkaan. Pykälän 4 momenttia ehdotetaan muutettavan siten, että 105 a §:ssä tarkoitettuun lukuvuosimaksulliseen koulutukseen osallistuvilla opiskelijoilla ei olisi oikeutta maksuttomaan asuntolapaikkaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">105 a §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Koulutuksesta kolmansien maiden valtioiden kansalaisilta perittävä lukuvuosimaksu. \u003C/span> Ammatillisesta koulutuksesta annettuun lakiin lisättäisiin uusi 105 a §, jossa säädettäisiin koulutuksesta kolmansien maiden kansalaisilta perittävistä lukuvuosimaksuista. Lukuvuosimaksuvelvollisuus koskisi pääsääntöisesti henkilöitä, jotka oleskelevat Suomessa opiskelun perusteella myönnetyllä oleskeluluvalla. Jatkuvan oleskeluluvan (A-lupa) saaneita ovat esimerkiksi korkeakouluopiskelijaksi maahan tulleet henkilöt. Tilapäisen oleskeluluvan (B-lupa) saaneita ovat esimerkiksi ne, jotka saapuvat maahan suorittaakseen ammatillisen tutkinnon. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan \u003Cspan class=\"KursiiviTeksti\">1 momentin\u003C/span> mukaan koulutuksen järjestäjän olisi perittävä vähintään koulutuksen järjestämisestä keskimäärin aiheutuvat kustannukset kattava lukuvuosimaksu tässä laissa tarkoitettuun koulutukseen hyväksytyltä opiskelijalta, joka on kolmannen maan kansalainen. Kolmannen maan kansalaisella tarkoitetaan muun maan kuin Euroopan unionin jäsenvaltion tai Islannin, Liechtensteinin, Norjan ja Sveitsin kansalaista. Ehdotetun 1 momentin mukaan lukuvuosimaksun suorittaminen olisi edellytys opetukseen osallistumiselle. Koulutuksen järjestäjän tehtävä olisi seurata, onko opiskelija suorittanut lukuvuosimaksunsa. Jos henkilö ei suorittaisi lukuvuosimaksua, hän ei olisi oikeutettu osallistumaan opetukseen ja muuhun koulutukseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kiinteän tutkintokohtaisen lukuvuosimaksun laskeminen ei olisi tarkoituksenmukaista, sillä saman koulutuksen järjestämisen kustannukset voivat vaihdella merkittävästi eri koulutuksen järjestäjien välillä. Tarkoitus on, että Opetushallitus tuottaisi koulutuksen järjestäjille vuosittain materiaalia koulutusalojen ja tutkintojen keskimääräisistä kustannuksista koulutuksen järjestäjän oman kustannuslaskennan tueksi. Ammatillisen koulutuksen järjestäjä voisi näin ollen päättää oman harkintavaltansa puitteissa maksun määrästä, kunhan maksu keskimäärin vastaisi koulutuksen järjestäjän omia, vaihtelevia kustannuksia. Opetushallituksen laskelmilla annettaisiin viitteellisesti tietoa kustannuksista koulutuksen järjestäjän omien laskelmien tueksi. Lukuvuosimaksun suuruutta määriteltäessä olisi huomioitava myös ammatillisen koulutuksen järjestäjälle syntyvät kiinteät kustannukset, jotta valtionosuusrahoitusta ei käytettäisi kolmansista maista tulevien henkilöiden kouluttamiseen. Näin ollen lukuvuosimaksun määrä ei voisi perustua pelkästään rajakustannuksiin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksun suuruus voisi siis vaihdella koulutuksen järjestäjäkohtaisesti samassakin tutkinnossa. Koulutuksen järjestäjä voisi esimerkiksi todeta työpaikalla järjestettävän koulutuksen kustannukset alhaisemmaksi kuin oppilaitosympäristössä järjestetyssä koulutuksessa ja tällä perusteella se voisi periä opiskelijalta pienemmän lukuvuosimaksun. Lukuvuosimaksun suuruus voisi siis näin ollen vaihdella opiskelijakohtaisesti riippuen siitä, mitä opintoja kukin lukuvuosimaksuvelvollinen opiskelija suorittaa, ja kuinka suuren osan opinnoista opiskelija suorittaisi työpaikalla järjestettävässä koulutuksessa. Ammatillisessa koulutuksessa ennen opintojen alkamista päätetty ja opiskelijan maksama lukuvuosimaksu saatetaan todeta opiskelun aikana ylimitoitetuksi ja koulutuksen järjestetyn kustannustehokkaammin esimerkiksi työpaikalla järjestetyn koulutuksen vuoksi. Koulutuksen järjestäjän olisi mahdollista palauttaa opiskelijalle osan jo tämän maksamasta lukuvuosimaksusta tai vaihtoehtoisesti se voisi hyvittää osan seuraavasta lukuvuosimaksusta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Opiskelemaan hakeutuvalle on tiedotettava lukuvuosimaksun määräytymisestä koko opintojen ajalta. Tällä tarkoitettaisiin sitä, että koulutuksen järjestäjä olisi velvollinen ilmoittamaan lukuvuosimaksujen määrät ja laatimaan hinnoittelun periaatteet lukuvuosimaksuille ja tiedottamaan niistä opiskelijoita. Säännöksellä tavoitellaan opiskelijoiden oikeusturvan parantamista siten, että heillä on mahdollisuus arvioida opiskelun kustannuksia koko opiskelun ajalta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjät laatisivat toimintaperiaatteet, joita se soveltaa maksettujen lukuvuosimaksujen palauttamiseen, lukuvuosimaksujen hyvityksiin sekä lukuvuosimaksujen palauttamiseen esimerkiksi opintojen keskeytyessä tai opiskelijan erotessa. Lukuvuosimaksujen perintä sekä mahdolliset maksujen palautukset ja hyvitykset koulutuksen järjestäjän tulisi toteuttaa siten, että niissä kohdellaan opiskelijoita tasapuolisesti. Opiskelijalta jo perittyä lukuvuosimaksua ei olisi mahdollista taannehtivasti korottaa. Koulutuksen järjestäjän tulisi tiedottaa lukuvuosimaksuistaan ja periaatteista, joilla lukuvuosimaksu voi alentua opintojen aikana. Velvollisuudesta tiedottaa lukuvuosimaksuista säädettäisiin ammatillisesta koulutuksesta annetun lain 123 §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjän ei tulisi periä lukuvuosimaksua siten, että opiskelijalta perittäisiin opiskelujen alkuvaiheessa selvästi pienempää lukuvuosimaksua, kuin hänen tulisi keskimäärin maksaa, jotta tutkinnon kustannukset tulisivat katettua, ilman edellä esitettyjä perusteita, jotta lukuvuosimaksujen ajantasaisesta perinnästä voitaisiin varmistua ja opiskelijalle koituvat kulut eivät kohdistuisi liian epätasaisesti ja jälkikätisesti. Esimerkiksi lukuvuosimaksuja ei tulisi määrittää niin, että ensimmäisen lukuvuoden maksu olisi pienempi kuin muiden. Lukuvuosimaksukertymän on oltava johdonmukainen ja mahdollisten kevennysten kohdistuttava erityisesti aikaan, jolloin suurin osa tutkinnon kustannuksista on jo maksettu. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksullisessa opiskelussa ei ole kysymys kilpailluilla markkinoilla tapahtuvasta toiminnasta tai EU:n valtiontukisääntöjen tarkoittamasta taloudellisesta toiminnasta. Asiaa käsitellään kappaleen 4.2.7 EU:n valtiontuen edellytysten täyttymisen arviointi ja kilpailuvaikutukset lopussa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">1 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on ulkomaalaislaissa tarkoitettu Euroopan unionin sininen kortti tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Euroopan unionin sininen kortti on tarkoitettu henkilöille, jotka tulevat työskentelemään suomeen korkeaa pätevyyttä vaativaan asiantuntijatehtävään. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">2 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on ulkomaalaislaissa tarkoitettu pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">3 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on jatkuva oleskelulupa. Jatkuvana (A) oleskelulupana myönnetään esimerkiksi työntekijän oleskeluluvat (ellei kysymys tilapäisestä työskentelystä), oleskeluluvat kansainvälisen suojelun (turvapaikka ja toissijainen suojelu) perusteella, oleskeluluvat korkeakoulututkinnon opiskelua varten ja oleskeluluvat perhesiteen perusteella tilanteessa, joissa perheenkokoajan oleskelulupa on jatkuva. Ammatillisessa koulutuksessa opiskelua varten oleskelulupa myönnetään tilapäisenä (B) oleskelulupana ja vastaava tilapäinen lupa myönnetään myös näiden opiskelijoiden perheenjäsenille. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Säännös tarkoittaisi, että Suomesta turvapaikan tai toissijaista suojelua saaneet henkilöt eivätkä heidän perheenjäsenensä olisi lukuvuosimaksuvelvollisia. Suomen kansalaisten perheenjäsenet, jotka oleskelevat Suomessa perhesiteeseen perustuvalla jatkuvalla oleskeluluvalla, eivät niin ikään olisi lukuvuosimaksuvelvollisia. Opiskelijat, jotka tulevat Suomeen opiskelemaan oppisopimuskoulutuksessa, tarvitsevat työperusteisen oleskeluluvan. Näin ollen ne opiskelijat, jotka tulevat Suomeen opiskelemaan oppisopimuskoulutuksessa työnteon perusteella myönnetyllä jatkuvalla oleskeluluvalla, eivät olisi lukuvuosimaksuvelvollisia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">4 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on pysyvä oleskelulupa. Pysyvän oleskeluluvan saamista voidaan perustellusti pitää sellaisena vahvana siteenä Suomeen, minkä seurauksena henkilö on oikeutettu maksuttomaan koulutukseen. Pysyvällä oleskeluluvalla Suomessa oleskelevan henkilön perheenjäsenet, joille on myönnetty oleskelulupa Suomeen perhesiteen perusteella, eivät myöskään olisi lukuvuosimaksuvelvollisia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">5 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on ollut opiskelun alkaessa ulkomaalaislaissa tarkoitettu oleskelulupa tilapäisen suojelun perusteella, eikä lupaa ole myöhemmin peruutettu mainitun lain 58 §:n 4 momentin perusteella. Tilapäistä suojelua saaneet eivät olisi lukuvuosimaksuvelvollisia. Nykytilanteessa tilapäinen suojelu tulee sovellettavaksi liittyen Venäjän hyökkäyssotaan Ukrainassa. Säännös vastaisi korkeakoulujen vastaavia säännöksiä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">6 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, joka osallistuu tilauskoulutukseen. Tilauskoulutuksen maksaa koulutuksen tilaaja. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">7 kohdan \u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, joka on oppivelvollisuuslain 2 §:n tarkoittama oppivelvollinen. Tässä esityksessä ehdotetaan oppivelvollisuuslain 2 §:n muuttamista siten, että jatkossa oppivelvollisia eivät olisi kolmansista maista tulevat alaikäiset lapset tai nuoret, jotka oleskelevat Suomessa opiskelutarkoituksessa. Henkilön täytettyä 18-vuotta, eli oppivelvollisuuden päätyttyä, olisi hän oikeutettu jatkamaan maksuttomassa koulutuksessa oppivelvollisuuslain 16 §:ssä säädetyllä tavalla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">8 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on tilapäinen korkeintaan vuoden mittainen oleskelulupa vaihto-opiskeluohjelmaan osallistumisen perusteella. Suomessa opiskelee joka vuosi useita henkilöitä toisella asteella vaihto-opiskelijaohjelmissa. Vaihto-opiskeluohjelmilla tarkoitetaan vakiintuneiden toimijoiden, kuten Rotary-järjestön tai AFS:n järjestämiä vaihto-ohjelmia, joissa henkilöllä on varsinainen opiskelupaikka kotimaassaan, ja jossa henkilön on tarkoitus osana opintojaan oleskella Suomessa korkeintaan yhden vuoden verran. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan \u003Cspan class=\"KursiiviTeksti\">2 momentin\u003C/span> mukaan poiketen siitä mitä 1 momentin 3 kohdassa säädetään, maksu peritään kuitenkin opiskelijalta, jonka ensimmäinen oleskelulupa on myönnetty opiskelun perusteella. Ehdotetun momentin mukaan lukuvuosimaksuvelvollisuus säilyisi, mikäli opiskelija vaihtaisi oleskelulupansa esimerkiksi työntekoon tarkoitettuun oleskelulupaan. Käytännössä säännös tarkoittaisi aikuisia opiskelijoita sillä oppivelvollisuusikäiset eivät olisi lukuvuosimaksuvelvollisia saatuaan Suomesta kotikunnan. Ainoastaan ne oppivelvollisuusikäiset henkilöt, jotka tulevat Suomeen opiskelutarkoituksessa, olisivat lukuvuosimaksuvelvollisia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lupaperusteen vaihtaminen opiskelijan oleskeluluvasta työntekijän oleskelulupaan on ollut merkittävin havaittu lukuvuosimaksujen kiertämistapa korkea-asteella, joten sen estäminen myös toisella asteella on perusteltua. Lukuvuosimaksujen määräytymisen kannalta ratkaisevaa olisi siis se, että henkilö on saapunut Suomeen ensimmäisen kerran opiskelutarkoituksessa opiskelijan oleskeluluvalla. Korkeakoululaeissa vastaavat säännökset tulevat voimaan 1.8.2026 alkaen. Lukuvuosimaksuvelvollisuus säilyisi myös siinä tapauksessa, että opiskelija vaihtaisi opiskelupaikkaa koulutuksen järjestäjien kesken tai ryhtyisi suorittamaan toista tutkintoa keskeytettyään ensimmäisen tutkinnon suorittamisen. Lukuvuosimaksuvelvollisuus säilyisi myös siinä tapauksessa, että henkilö valmistuu, työskentelee ja hakeutuu myöhemmin uudelleen opiskelijaksi. Edellä kuvattu tilanne ei kuitenkaan tulisi kovin usein sovellettavaksi, koska henkilölle tällaisessa tilanteessa ehtisi kertyä riittävä asumisaika pysyvän oleskeluluvan saamiseen. Lukuvuosimaksuvelvollisuus päättyisi kaikissa tapauksissa viimeistään silloin kun henkilö saa pysyvän oleskeluvan. Pysyvän oleskeluluvan saamista voidaan perustellusti pitää sellaisena vahvana siteenä Suomeen, minkä seurauksena henkilö on oikeutettu maksuttomaan koulutukseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetun momentin mukaan maksu peritään myös opiskelijalta, joka oleskelee Suomessa perhesiteeseen perustuvalla jatkuvalla oleskeluluvalla tilanteessa, jossa perheenkokoaja oleskelee Suomessa opiskeluun perustuvalla oleskeluluvalla tai perheenkokoaja oleskelee Suomessa jatkuvalla oleskeluluvalla, mutta hänen oleskelulupansa on myönnetty ensimmäisen kerran opiskelun perusteella. Säännöksellä tarkoitettaisiin käytännössä tilanteita, joissa perheenkokoaja oleskelee Suomessa korkeakouluopintoja varten myönnetyllä jatkuvalla oleskeluluvalla tai perheenkokoajan oleskelulupa on myönnetty ensimmäisen kerran korkeakouluopintoja varten. Ehdotettu säännös koskisi pääsääntöisesti korkeakoulussa opiskelevan tai opiskelleen henkilön puolisoa, sillä oppivelvollisuusikäiset eivät olisi lukuvuosimaksuvelvollisia kotikunnan saatuaan perheenkokoajan oleskelulupaperusteesta riippumatta. Säännöksellä tavoitellaan yhdenvertaista kohtelua korkea-asteella ja toisella asteella opiskelevien perheenjäsenille. Voimassa olevan lainsäädännön mukaan korkea-asteella opiskelevien perheenjäsenet saavat jatkuvan (A) oleskeluluvan ja toisella asteella opiskelevien perheenjäsenet tilapäisen (B) oleskeluluvan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetun pykälän 3 momentin mukaan opetus- ja kulttuuriministeriö voisi asetuksella antaa tarkempia säännöksiä 1 momentissa tarkoitettujen lukuvuosimaksujen määräytymisen perusteista. Tällä mahdollistettaisiin lukuvuosimaksujen määräytymisen yksityiskohtaisempi sääntely, mikäli havaitaan tarvetta ohjata lukuvuosimaksuista tehtäviä päätöksiä esimerkiksi toimintatapojen yhdenmukaistamiseksi joiltakin osin tai opiskelijoiden oikeusturvan parantamiseksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhdistelmälupadirektiivi, jota käsitellään kappaleessa 2.3.7., turvaa kolmansista maista tuleville työntekijöille jäsenvaltion kansalaisten kanssa yhdenvertaisen kohtelun direktiivissä määritellyillä, esimerkiksi työelämän, koulutuksen ja sosiaaliturvan alueilla. Direktiivin ’kolmannesta maasta tulleella työntekijällä’ tarkoitetaan kolmannen maan kansalaista, jolle on myönnetty pääsy jonkin jäsenvaltion alueelle ja joka oleskelee siellä laillisesti ja joka kansallisen oikeuden tai käytännön mukaisesti saa työskennellä palkatussa työsuhteessa olevana tuossa jäsenvaltiossa (2 artikla, 1 kohta, b alakohta). Yhdenvertainen kohtelu koskee myös kolmansien maiden kansalaisia, joille on unionin tai kansallisen oikeuden mukaisesti myönnetty pääsy jäsenvaltioon muuta tarkoitusta kuin työntekoa varten, jotka saavat työskennellä (12 artikla, 1 kohta). Jäsenvaltiot voivat rajoittaa yhdenvertaista kohtelua koulutuksen ja ammatillisen koulutuksen osalta rajoittamalla sen soveltamisen sellaisiin kolmansista maista tulleisiin työntekijöihin, jotka ovat työsuhteessa tai jotka ovat olleet työsuhteessa ja rekisteröityneet työttömiksi työnhakijoiksi (12 artikla 2 kohta, a (i) alakohta) ja asettamalla kansallisen oikeuden mukaisesti erityisiä vaatimuksia korkeakoulutason koulutukseen ja toisen asteen jälkeiseen koulutukseen sekä ammatilliseen koulutukseen, joka ei liity suoraan tiettyyn työllistymiseen tähtäävään toimintaan pääsyn edellytykseksi; näitä voivat olla kielitaitovaatimukset ja lukukausimaksujen maksaminen (12 artikla 2 kohta, a(iv) alakohta). Ammatillisen koulutuksen osalta direktiivi mahdollistaa rajauksen, mikäli ammatillinen koulutus ei liity suoraan tiettyyn työllistymiseen tähtäävään toimintaan (englanninkielisessä versiossa ”directly linked to the specific employment activity”), Erillisen ammatillisen tutkinnon suorittamista ei voida pitää tiettyyn työllistymiseen tähtäävänä toimintana. Suomeen ammatilliseen koulutukseen saapuvilla opiskelijoilla ei pääsääntöisesti ole tietyn työllistämisen edellyttämää työllistäjää, eikä ammatillisen tutkinnon suorittamista yleisesti tulkita olevan tiettyyn työllistymiseen tähtäävää, vaikkakin ammatillisen tutkinnon suorittaminen lisää edellytyksiä työllistyä Suomessa. Tiettyyn työhön työllistyville oleskeluluvan peruste on pääsääntöisesti työskentely. Tällaisen oleskeluluvan haltijoille osaamisen hankkiminen tutkintokoulutuksessa on maksutonta. Näin ollen direktiivi ei rajoita lukuvuosimaksujen perimistä ammatillisesta koulutuksesta Euroopan unionin tai Euroopan talousalueen ulkopuolisen valtion kansalaiselta, vaikka kyseessä olisi tilapäisellä oleskeluluvalla tai opiskelijan perheenjäsenen oleskeluluvalla oleskelevasta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">123 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Tutkinnon suorittamismahdollisuuksista ja koulutuksesta tiedottaminen. \u003C/span> Pykälän 1 momenttia ehdotetaan muutettavan siten, että koulutuksen järjestäjä olisi velvollinen tiedottamaan myös 105 a §:ssä ehdotettavista lukuvuosimaksuista. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lukiolaki\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">9 §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Tilauskoulutus. \u003C/span> Pykälä koskee tilauskoulutuksen järjestämistä lukiokoulutuksessa. Pykälän 1 ja 4 momenttia ehdotetaan muutettavan. Voimassa olevan 1 momentin mukaan koulutuksen järjestäjä, jonka järjestämisluvassa on oikeus järjestää International Baccalaureate -tutkintoon johtavaa koulutusta, voi järjestää kyseistä koulutusta tilauskoulutuksena, jos koulutuksen tilaa ja rahoittaa toinen valtio, kansainvälinen järjestö taikka suomalainen tai ulkomainen julkisyhteisö, säätiö tai yksityinen yhteisö. Pykälän 1 momenttia muutettiin 1.1.2025 alkaen siten, että tilauskoulutusta ei kuitenkaan saa järjestää, jos tilaajan tarkoituksena on vain välittää opiskelijoita tutkinto-opiskelijoiksi ilman tarkoitusta rahoittaa koulutus. Koulutuksen järjestäjän on huolehdittava siitä, että tilauskoulutusta koskevassa sopimuksessa on määritelty tilauskoulutukseen osallistuvan oikeudet ja velvollisuudet ja että tilauskoulutukseen osallistuvat tuntevat ne. Pykälän 4 momentin mukaan koulutuksen järjestäjän on perittävä koulutuksen tilaajalta tilauskoulutuksen järjestämisestä vähintään siitä aiheutuvat kustannukset kattava maksu. Maksun tulee kattaa myös 35 §:n mukaisista opintososiaalisista eduista aiheutuvat kustannukset. Koulutuksen järjestäjän on kohdennettava tilauskoulutuksesta saamansa tuotto omaan koulutustoimintaansa. Koulutuksen tilaajalla on oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta sijaintivaltionsa lainsäädännön tai oman käytäntönsä mukaisia maksuja. Tilauskoulutuksena järjestettävään opetukseen ei sovelleta opetus- ja kulttuuritoimen rahoituksesta annettua lakia (1705/2009). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän \u003Cspan class=\"KursiiviTeksti\">1 momenttiin \u003C/span> 1.1.2025 alkaen tehtyä lisäystä täsmennettäisiin siten, että se vastaisi ammatillisesta koulutuksesta annettuun lakin tehtävän muutoksen muotoiluja. Momenttia ehdotetaan muutettavan siten, että koulutuksen järjestäjä ei saa järjestää tilauskoulutusta, jos tilaajan tarkoituksena on välittää opiskelijoita tutkinto-opiskelijoiksi siten, että opiskelijoiden välittäminen on voittoa tavoittelevaa liiketoimintaa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän \u003Cspan class=\"KursiiviTeksti\">4 momenttia\u003C/span> ehdotetaan täsmennettävän siten, että koulutuksen tilaajalla olisi oikeus periä tilauskoulutukseen osallistuvilta opiskelijoilta tilaajan sijaintivaltion lainsäädännön tai oman käytäntönsä mukaisia opiskelijan lähtömaan elinkustannuksiin nähden kohtuullisia maksuja. Maksujen suuruuden osalta viitattaisiin siis lähtömaan elinkustannuksiin, joihin nähden opiskelijalta perittävien maksujen tulisi olla kohtuullisia. Säännös vastaisi ammatillisesta koulutuksesta annettuun lakiin ehdotettavaa muutosta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">34 a §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Koulutuksesta kolmansien maiden kansalaisilta perittävä lukuvuosimaksu. \u003C/span> Lukiolakiin ehdotetaan lisättävän uusi 34 a §, jossa säädettäisiin koulutuksesta kolmansien maiden kansalaisilta perittävistä lukuvuosimaksuista. Ehdotettavan 1 momentin mukaan koulutuksen järjestäjän on perittävä lukuvuosimaksu tässä laissa tarkoitettuun koulutukseen hyväksytyltä opiskelijalta, joka on kolmannen maan kansalainen, ja joka hakee oleskelulupaa opiskelun perusteella tai oleskelee maassa opiskelun perusteella myönnetyllä oleskeluluvalla. Kolmannen maan kansalaisella tarkoitetaan muun maan kuin Euroopan unionin jäsenvaltion tai Islannin, Liechtensteinin, Norjan ja Sveitsin kansalaista. Lukuvuosimaksu peritään myös kolmannen maan kansalaiselta, joka suorittaa tässä laissa tarkoitettuja opintoja etäopetuksessa. Säännöksellä tarkoitetaan kolmansien maiden kansalaisia, jotka suorittavat etäopintoja lähtömaastaan käsin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetun 1 momentin mukaa lukuvuosimaksun suuruus on vähintään lukiokoulutuksen keskimääräinen yksikköhinta. Jos koulutuksen järjestäjän yksikköhinta on alempi kuin lukiokoulutuksen keskimääräinen yksikköhinta, on lukuvuosimaksun suuruus vähintään koulutuksen järjestäjän yksikköhinta. Yhtä tai useampaa oppiainetta suorittamaan otetuilta opiskelijoilta perittävän maksun määrä on opintopistettä kohden keskimääräinen yksikköhinta tai sitä alempi järjestäjäkohtainen yksikköhinta jaettuna luvulla 30. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen keskimääräisestä yksikköhinnasta säädetään vuosittain valtioneuvoston asetuksella. Jos koulutuksen järjestäjän yksikköhinta on alempi kuin lukiokoulutuksen keskimääräinen yksikköhinta, olisi lukuvuosimaksun suuruus vähintään koulutuksen järjestäjän yksikköhinta. Koska lukiolain 4 §:n mukaan koulutusta ei saa järjestää taloudellisen voiton tavoittelemiseksi, olisi perusteltua, että lukuvuosimaksu olisi alhaisempi tilanteessa, jossa koulutuksen järjestäjän yksikköhinta on keskimääräistä yksikköhintaa alhaisempi. Yhtä tai useampaa oppiainetta suorittamaan otetuilta niin sanotulta aineopiskelijoilta perittävän maksun määrä olisi opintopistettä kohden keskimääräinen yksikköhinta jaettuna luvulla 30. Jos koulutuksen järjestäjän yksikköhinta olisi alhaisempi kuin keskimääräinen yksikköhinta, saataisiin aineopiskelijan lukuvuosimaksun hinta jakamalla järjestäjäkohtainen yksikköhinta luvulla 30.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin mukaan lukuvuosimaksu määräytyisi lukiokoulutuksessa ensimmäisenä opiskeluvuotena voimassa olleen yksikköhinnan perusteella koko opintojen ajalle. Lukiokoulutuksen keskimääräinen yksikköhinta on kasvanut viime vuosina keskimäärin viisi prosenttia vuodessa. Säännöksellä tavoitellaan opiskelijoiden oikeusturvan parantamista siten, että heillä on mahdollisuus arvioida opiskelun kustannuksia koko opiskelun ajalta. Olisi opiskelijoiden oikeusturvan kannalta ongelmallista, jos opiskelijat eivät voisi etukäteen tietää paljonko lukuvuosimaksu tulee seuraavina vuosina olemaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjät laatisivat toimintaperiaatteet, joita se soveltaa maksettujen lukuvuosimaksujen palauttamiseen, lukuvuosimaksujen hyvityksiin sekä lukuvuosimaksujen palauttamiseen esimerkiksi opintojen keskeytyessä tai opiskelijan erotessa. Lukuvuosimaksujen perintä sekä mahdolliset maksujen palautukset ja hyvitykset koulutuksen järjestäjän tulisi toteuttaa siten, että niissä kohdellaan opiskelijoita tasapuolisesti. Opiskelijalta jo perittyä lukuvuosimaksua ei olisi mahdollista taannehtivasti korottaa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetun \u003Cspan class=\"KursiiviTeksti\">1 momentin\u003C/span> mukaan lukuvuosimaksun suorittaminen olisi edellytys opetukseen osallistumiselle. Koulutuksen järjestäjän tehtävä olisi seurata, onko opiskelija suorittanut lukuvuosimaksunsa. Jos henkilö ei suorittaisi lukuvuosimaksua, hän ei olisi oikeutettu osallistumaan opetukseen ja muuhun koulutukseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Henkilön ei olisi mahdollista opiskella maksuvelvollisena opiskelijana lukiolaissa tarkoitettua lukion oppimäärää englannin kielellä. Lukiolakiin lisättiin 1.1.2025 alkaen säännökset englanninkielisestä lukion oppimäärästä ja ylioppilastutkinnosta. Opiskelijoita aletaan kouluttamaan 1.8.2026 alkaen ja ensimmäiset ylioppilaskirjoitukset järjestetään vuonna 2029. Lukiolain 21 a §:n mukaan englanninkielisen lukion oppimäärän opiskelijaksi voidaan ottaa henkilö, jolla on Suomessa suoritetun lukiokoulutusta edeltävän koulutuksen kestosta tai Suomessa asumisen kestosta johtuvasta syystä puutteellinen kielitaito suoriutua lukiokoulutuksesta suomeksi tai ruotsiksi. Sellaiselta englanninkieliseen lukiokoulutukseen otettavalta hakijalta, joka ei ole Euroopan unionin jäsenvaltion eikä Euroopan talousalueeseen kuuluvan valtion kansalainen edellytetään, että hänelle on ulkomaalaislain nojalla myönnetty muu kuin opiskeluun perustuva oleskelulupa. Näin ollen henkilö ei voi hakeutua kolmansista maista maksulliseen koulutukseen suorittamaan lukion englanninkielistä oppimäärää.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ylioppilastutkinnosta perittävistä maksuista säädetään ylioppilastutkintolain (502/2019) 20 §:ssä. Sen 4 momentin mukaan oppivelvollisuuslain 16 §:n nojalla maksuttomaan koulutukseen oikeutetulta kokelaalta ei saada periä maksuja osallistumisesta viiteen ensimmäiseksi suoritettavaan kokeeseen, eikä edellä tarkoitettujen hylättyjen kokeiden uusimisesta. Näin ollen henkilöltä, joka ei ole oppivelvollinen ja oikeutettu maksuttomaan koulutukseen, voidaan periä maksu osallistumisesta ylioppilastutkinnon kokeisiin. Jos kunta haluaa tarjota myös lukuvuosimaksuvelvollisille opiskelijoille ilmaiset ylioppilastutkinnon kokeet, on kunnan suoritettava maksut ylioppilastutkintolautakunnalle.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksuvelvollisuus kohdennettaisiin yksinomaan Suomeen opiskelutarkoituksessa tuleviin henkilöihin tai Suomessa opiskelutarkoituksessa oleviin henkilöihin, jotka saapuvat Suomeen tilapäisellä (B) tai jatkuvalla (A) opiskelijan oleskeluluvalla lukuun ottamatta henkilöitä, jotka osallistuvat vaihto-opiskelijaohjelmiin. Lukiokoulutuksessa opiskelua varten oleskelulupa myönnetään tilapäisenä (B) oleskelulupana. Näin ollen lukuvuosimaksua eri perittäisi opiskelijalta, joka on Euroopan unionin ja sen jäsenvaltioiden muun sopimuspuolen kanssa tekemän sopimuksen mukaan rinnastetaan Euroopan unionin kansalaiseen tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Lukuvuosimaksua ei perittäisi opiskelijalta, jolla on ulkomaalaislaissa tarkoitettu Euroopan unionin sininen kortti tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Euroopan unionin sininen kortti on tarkoitettu henkilöille, jotka tulevat työskentelemään suomeen korkeaa pätevyyttä vaativaan asiantuntijatehtävään. Lukuvuosimaksua ei perittäisi opiskelijalta, jolla on ulkomaalaislaissa tarkoitettu pitkään oleskelleen kolmannen maan kansalaisen EU-oleskelulupa tai tämän ulkomaalaislaissa tarkoitetulta perheenjäseneltä. Lukuvuosimaksua ei perittäisi opiskelijalta, jolla on jatkuva oleskelulupa, ellei oleskelulupaa ole myönnetty opiskelun perusteella. Jatkuvana (A) oleskelulupana myönnetään esimerkiksi työntekijän oleskeluluvat (ellei kysymys tilapäisestä työskentelystä), oleskeluluvat kansainvälisen suojelun (turvapaikka ja toissijainen suojelu) perusteella, oleskeluluvat korkeakoulututkinnon opiskelua varten ja oleskeluluvat perhesiteen perusteella tilanteessa, joissa perheenkokoajan oleskelulupa on jatkuva. Lukuvuosimaksua ei myöskään perittäisi opiskelijalta, jolla on pysyvä oleskelulupa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksua ei perittäisi opiskelijalta, jolla on ollut opiskelun alkaessa ulkomaalaislaissa tarkoitettu oleskelulupa tilapäisen suojelun perusteella, eikä lupaa ole myöhemmin peruutettu mainitun lain 58 §:n 4 momentin perusteella. Tilapäistä suojelua saaneet eivät olisi lukuvuosimaksuvelvollisia. Nykytilanteessa tilapäinen suojelu tulee sovellettavaksi liittyen Venäjän hyökkäyssotaan Ukrainassa. Säännös vastaisi korkeakoulujen vastaavia säännöksiä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetun 1 momentin \u003Cspan class=\"KursiiviTeksti\">1 kohdan\u003C/span> mukaan lukumaksua ei kuitenkaan perittäisi opiskelijalta, joka osallistuu tilauskoulutukseen. Tilauskoulutuksen maksaa koulutuksen tilaaja. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan 1 momentin \u003Cspan class=\"KursiiviTeksti\">2 kohdan\u003C/span> mukaan, maksua ei kuitenkaan perittäisi opiskelijalta, jolla on tilapäinen korkeintaan vuoden mittainen oleskelulupa vaihto-opiskeluohjelmaan osallistumisen perusteella. Suomessa opiskelee joka vuosi useita henkilöitä toisella asteella vaihto-opiskelijaohjelmissa. Vaihto-opiskeluohjelmilla tarkoitetaan vakiintuneiden toimijoiden, kuten Rotary-järjestön tai AFS:n järjestämiä vaihto-ohjelmia, joissa henkilöllä on varsinainen opiskelupaikka kotimaassaan, ja jossa henkilön on tarkoitus osana opintojaan oleskella Suomessa korkeintaan yhden vuoden verran. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tällä esityksellä oppivelvollisuuslakiin ehdotetaan muutosta, jonka mukaan kolmansien maiden kansalaiset, jotka oleskelevat Suomessa opiskelutarkoituksessa, eivät olisi Suomessa oppivelvollisia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiolakiin ei ehdoteta vastaavaa 2 momenttia kuin ammatillisesta koulutuksesta annetun lain 105 a §:ään johtuen yhdistelmälupadirektiivistä, jota käsitellään kappaleessa 2.3.7. Yhdistelmälupadirektiivi turvaa kolmansista maista tuleville työntekijöille jäsenvaltion kansalaisten kanssa yhdenvertaisen kohtelun direktiivissä määritellyillä, esimerkiksi työelämän, koulutuksen ja sosiaaliturvan alueilla. Direktiivin ’kolmannesta maasta tulleella työntekijällä’ tarkoitetaan kolmannen maan kansalaista, jolle on myönnetty pääsy jonkin jäsenvaltion alueelle ja joka oleskelee siellä laillisesti ja joka kansallisen oikeuden tai käytännön mukaisesti saa työskennellä palkatussa työsuhteessa olevana tuossa jäsenvaltiossa (2 artikla, 1 kohta, b alakohta). Yhdenvertainen kohtelu koskee myös kolmansien maiden kansalaisia, joille on unionin tai kansallisen oikeuden mukaisesti myönnetty pääsy jäsenvaltioon muuta tarkoitusta kuin työntekoa varten, jotka saavat työskennellä (12 artikla, 1 kohta). Jäsenvaltiot voivat rajoittaa yhdenvertaista kohtelua koulutuksen ja ammatillisen koulutuksen osalta rajoittamalla sen soveltamisen sellaisiin kolmansista maista tulleisiin työntekijöihin, jotka ovat työsuhteessa tai jotka ovat olleet työsuhteessa ja rekisteröityneet työttömiksi työnhakijoiksi (12 artikla 2 kohta, a (i) alakohta) ja asettamalla kansallisen oikeuden mukaisesti erityisiä vaatimuksia korkeakoulutason koulutukseen ja toisen asteen jälkeiseen koulutukseen sekä ammatilliseen koulutukseen, joka ei liity suoraan tiettyyn työllistymiseen tähtäävään toimintaan pääsyn edellytykseksi; näitä voivat olla kielitaitovaatimukset ja lukukausimaksujen maksaminen (12 artikla 2 kohta, a(iv) alakohta). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Direktiivin 1 artiklan 2 kohdan mukaisesti direktiivi ei vaikuta jäsenvaltioiden toimivaltaan, joka koskee kolmansien maiden kansalaisten pääsyä niiden työmarkkinoille. Direktiivin johdanto-osan 6 kappaleen mukaan direktiivin säännökset eivät saisi vaikuttaa jäsenvaltioiden toimivaltaan säännellä maahanpääsyä. Kun lukuvuosimaksujen maksaminen on kansallisessa lainsäädännössä opiskelijan oleskeluluvan myöntämisen edellytyksenä, ei yhdistelmälupadirektiivi rajoita mahdollisuutta vaatia lukuvuosimaksuja lukiokoulutukseen saapuvilta tai maassa oleskelevilta kolmannen maan kansalaisilta, jotka oleskelevat Suomessa opiskelijan oleskeluluvalla. Tämä johtuu siitä, että direktiivin tarkoituksena ei ole säätää maahanpääsyn tai laillisen oleskelun edellytyksistä, vaan yhdenvertaisesta kohtelusta siinä tilanteessa, kun henkilölle on myönnetty pääsy jäsenvaltioon ja tämä oleskelee siellä laillisesti. Merkitystä ei olisi sillä, vaatiiko koulutuksen järjestäjä maksujen maksamista kokonaisuudessaan ennen koulutuksen alkamista vai useassa osassa, sillä lupaedellytysten tulee täyttyä oleskelun ajan. Tutkija- ja opiskelijalain 12 §:n 1 momentin 1 kohdan mukaan opiskelijan oleskelulupa on peruutettava tai jätettävä uusimatta, jos kolmannen maan kansalainen ei enää täytä säädettyjä edellytyksiä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen osalta yhdistelmälupadirektiivi rajoittaa lukuvuosimaksujen perimistä edellä kuvatusti silloin, kun henkilön lupaperuste ei ole opiskelu. Lukiokoulutuksen osalta tästä syystä katsotaan perustelluksi rajata lukuvuosimaksuvelvollisuus koskemaan ainoastaan opiskelijan oleskeluluvalla Suomeen saapuvia tai opiskelijan oleskeluluvalla Suomessa oleskelevia henkilöitä. Yhdistelmälupadirektiivi edellyttäisi lukiokoulutuksen osalta maksuista vapauttamista kaikissa tilanteissa, joissa henkilö olisi työsuhteessa tai olisi työsuhteen jälkeen ilmoittautunut työttömäksi työnhakijaksi. Työsuhteiden jatkuva selvittäminen ja arviointi merkitsisi koulutuksen järjestäjille kohtuutonta hallinnollista taakkaa saavutettavaan hyötyyn nähden. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lukuvuosimaksullisessa opiskelussa ei ole kysymys kilpailluilla markkinoilla tapahtuvasta toiminnasta tai EU:n valtiontukisääntöjen tarkoittamasta taloudellisesta toiminnasta. Asiaa käsitellään kappaleen 4.2.7 EU:n valtiontuen edellytysten täyttymisen arviointi ja kilpailuvaikutukset lopussa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">35&nbsp;§.&nbsp;\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Opintososiaaliset edut. \u003C/span> Pykälässä säädetään opintososiaalisista eduista lukiokoulutuksessa. Pykälää ehdotetaan muutettavan siten, että siihen lisätään uusi 3 momentti, jonka mukaan 34 a §:ssä tarkoitettuun lukuvuosimaksulliseen koulutukseen osallistuvilla ei olisi oikeutta pykälässä tarkoitettuihin opintososiaalisiin etuihin. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tiedonsaantioikeuksia koskevat säännöskohtaiset perustelut\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Ammatillisesta koulutuksesta annetun lain 109 b § ja lukiolain 60 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Oleskelulupia koskeva tiedonsaantioikeus.\u003C/span> Lukiolakiin esitetään lisättävän uusi 60 § ja ammatillisesta koulutuksesta annettuun lakiin uusi 109 b §. Pykälän \u003Cspan class=\"KursiiviTeksti\">1 momentissa\u003C/span> säädettäisiin koulutuksen järjestäjän oikeudesta maksutta ja salassapitosäännösten estämättä saada tiettyjä tehtäviään varten Maahanmuuttovirastolta ja tiettyjä oleskeluoikeutta osoittavaa asiakirjaa koskevia tietoja. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ammatillisen koulutuksen osalta kyseiset tiedot olisivat hakijan tai opiskelijan sekä näiden perheenkokoajan hakeman, voimassa olevan ja aiemmin myönnetyn oleskeluoikeutta osoittavan asiakirjan voimassaolo, peruste ja lajia sekä oleskeluoikeutta osoittavaa asiakirjaa koskevan hakemuksen käsittelyn tilaa koskevat tarpeelliset tiedot. Lukiokoulutuksen osalta tiedot olisivat muutoin samoja, paitsi että lukiokoulutuksen järjestäjillä ei olisi oikeutta saada tietoja perheenkokoajan oleskeluluvista eikä hakijan tai opiskelijan aiemmin myönnetystä oleskeluoikeudesta. Kyseiset tiedot ovat lukiokoulutuksen järjestäjän kannalta tarpeettomia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oleskeluoikeutta osoittavalla asiakirjalla tarkoitetaan tässä yläkäsitteenä kaikkia oleskelulupia sekä ulkomaalaislain 10 luvussa säänneltyjä Euroopan unionin kansalaisen ja häneen rinnastettavan henkilön vapaan liikkuvuuden alaan kuuluvan oleskelun osoittavaa asiakirjaa. Maahanmuuttoviraston myöntämiä asiakirjoja, joilla voi todistaa ulkomaalaislain 10 §:ssä säännellyn Euroopan unionin kansalaisen ja häneen rinnastettavan henkilön vapaan liikkuvuuden alaan kuuluvan oleskeluoikeuden ovat todistus EU-kansalaisen oleskeluoikeuden rekisteröinnistä, todistus EU-kansalaisen pysyvästä oleskeluoikeudesta, EU-kansalaisen perheenjäsenen oleskelukortti ja EU-kansalaisen perheenjäsenen pysyvä oleskelukortti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tiedonsaantitarve perustuu erityisesti tässä esityksessä ehdotettavaan lukuvuosimaksuja koskevaan muutokseen, josta säädettäisiin ehdotetuissa lukiolain 34 a §:ssä ja ammatillisesta koulutuksesta annetun lain 105 a §:ssä. Ehdotetut pykälät eroavat toisistaan siten, että lukiokoulutuksessa lukuvuosimaksuvelvollisia ovat ainoastaan opiskelun perusteella oleskelulupaa hakevat tai opiskelun perusteella oleskeluluvan Suomeen saaneet. Lukiokoulutuksen järjestäjillä ei ammatillisen koulutuksen järjestäjistä poiketen ole näin ollen tarvetta saada Maahanmuuttovirastolta tietoja hakijan tai opiskelijan perheenkokoajan oleskeluluvasta taikka hakijan tai opiskelijan aikaisemmin myönnetystä oleskeluluvasta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotetun ammatillisesta koulutuksesta annetun lain 105 a §:n soveltaminen edellyttää, että koulutuksen järjestäjillä on oikeus saada tietyissä tilanteissa tietoja perhesiteen perusteella myönnetyllä oleskeluluvalla oleskelevan opiskelijan ja hänen perheenkokoajanansa toimivan perheenjäsenensä oleskelun perusteesta sekä opiskelijalle ja perheenkokoajalle ensimmäisen kerran myönnetyn oleskeluluvan perusteesta. Tällä tarkoitetaan eri asiaa kuin Maahanmuuttoviraston myöntämä ensimmäinen oleskelulupa, joka voi tulla kyseeseen useita kertoja, jos henkilö on välillä poistunut maasta. Tässä laissa koulutuksen maksullisuus kytkeytyy henkilön aidosti ensimmäistä kertaa Suomessa saaman oleskeluluvan perusteeseen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisesti koulutuksen järjestäjällä voi olla tarve saada tietoa esimerkiksi koulutuksen suunnittelemista tai maksujen perimistä varten siitä, onko henkilölle myönnetty oleskelulupa. Koulutuksen järjestäjät ovat saaneet näitä tietoja aiemmin voimassa olleen lainsäädännön nojalla Maahanmuuttovirastolta ja on koulutuksen järjestäjien tarpeiden vuoksi perusteltua palauttaa tiedonsaantioikeus lainsäädäntöön. Tietoa tarvitaan myös esimerkiksi siksi, että opiskelija hakee lukuvuosimaksun palauttamista kielteisen oleskelulupapäätöksen perusteella, mutta hän ei ole edes tehnyt hakemusta tai asian käsittely on vielä kesken. Tiedon luotettavuuden vuoksi on tärkeää, että tieto siirtyy suoraan Maahanmuuttovirastolta ammatillisen koulutuksen järjestäjälle.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen suunnittelua varten koulutuksen järjestäjät tarvitsevat tiedot tulossa olevien opiskelijoiden määrästä ja siitä, milloin nämä voivat aloittaa opiskelun. Tätä varten ne tarvitsevat tiedot myönnetyistä ja vireillä olevista oleskeluluvista ja niiden käsittelytilanteesta. Nämä tiedot vaikuttavat koulutuksessa käytettävien resurssien varaamiseen, muun muassa opetusryhmien määrään, opettajiin, perehdytyksen järjestämiseen ja tilavarauksiin. Koulutuksen järjestäjä voi myös joutua selvittämään mahdollisuutta aloittaa opinnot myöhemmin oleskeluluvan saamisen viivästymisen vuoksi. Erityisen merkityksellistä näiden tietojen saaminen on silloin, jos suuri osa tietylle koulutuksen järjestäjälle hakeneiden opiskelijoiden oleskelulupapäätöksistä viivästyy tai on kielteisiä. Tällöin kokonaisten opetusryhmien järjestämistä voidaan joutua harkitsemaan uudelleen ja tieto on tällöin tärkeää saada Maahanmuuttovirastolta nopeasti haittavaikutusten minimoimiseksi, eikä vasta sitten kun opiskelijoita jää saapumatta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Näitä tietoja ei ole aina mahdollista saada luotettavasti opiskelijoilta, koska esimerkiksi osa opiskelijoista ei ole aikeissa todellisuudessa saapua Suomeen. He ovat esimerkiksi saattaneet ottaa vastaan opiskelupaikkoja useista maista, eivätkä ole enää koulutuksen järjestäjän tavoitettavissa. Näin ollen on myös opiskelijoiden etu, että koulutuksen järjestäjä selvittää todellisuudessa opinnot aloittavien opiskelijoiden määrän luotettavalta taholta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälässä tarkoitettujen tehtävien hoitaminen edellyttää henkilötietojen käsittelyä, joka kuuluu luonnollisten henkilöiden suojelusta henkilötietojen käsittelyssä sekä näiden tietojen vapaasta liikkuvuudesta ja direktiivin 95/46/EY kumoamisesta annetun Euroopan parlamentin ja neuvoston asetuksen (EU) 2016/679 (yleinen tietosuoja-asetus) soveltamisalaan. Siltä osin, kun ehdotettuun sääntelyyn sisältyy henkilötietojen käsittelyä, käsittelyn oikeusperuste on yleisen tietosuoja-asetuksen 6 artiklan 1 kohdan c alakohta. Lukiokoulutuksen järjestäjien lakisääteinen tehtävä järjestää koulutusta perustuu lukiolain 3 §:ään. Ammatillisen koulutuksen järjestäjien lakisääteinen tehtävä järjestää koulutusta perustuu ammatillisesta koulutuksesta annetun lain 22 §:ään. Oikeus periä lukuvuosimaksuja kolmansista maista tulevilta henkilöiltä perustuu puolestaan lukiolain ehdotettuun 34 a §:ään ja ammatillisesta koulutuksesta annetun lain ehdotettuun 105 a §:ään. Tiedot, joita tämän lain perusteella luovutetaan, eivät sisällä tietosuoja-asetuksen 9 artiklassa tarkoitettuja erityisiä henkilötietoja.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kyseisen käsittelyperusteen käyttäminen tarkoittaa sitä, että rekisteröidyllä ei ole tietosuoja-asetuksen 21 artiklassa säädetysti oikeutta vastustaa käsittelyä. Tiedonluovutuksen edellytykseksi ei säädetä hakijan, opiskelijan tai ammatillisen koulutuksen osalta perheenkokoajan suostumusta, koska koulutuksen järjestäjien tietotarve liittyy usein tilanteisiin, joissa siitä voi seurata tietopyynnön kohteena olevalle henkilölle negatiivisia seuraamuksia, kuten maksuvelvollisuuden säilyminen, tai joissa kyseinen henkilö ei ole tavoitettavissa, kuten joissain tilanteissa, joissa opiskeluoikeuden saanut henkilö on jättänyt aloittamatta opiskelun.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tietojen saaminen lukuvuosimaksuvelvollisuuden arvioimiseksi ja opetusryhmien järjestämiseksi on tarpeellista koulutuksen järjestäjien toiminnalle. Opiskelijalle myönnettävien oikeuksien, kuten maksuttomuuden, edellytyksenä on niiden perustana olevista tosiseikoista varmistuminen. Henkilötietojen luotettavuus edellyttää niiden saamista suoraan asiaa käsittelevältä tai päätöksen tehneeltä viranomaiselta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän \u003Cspan class=\"KursiiviTeksti\">2 momentissa\u003C/span> säädettäisiin koulutuksen järjestäjien oikeudesta oma-aloitteisesti antaa tietoja Maahanmuuttovirastolle väärinkäytösepäilytilanteissa. Tietojen antaminen oma-aloitteisesti viranomaisille on perinteisesti saattanut perustua ajatukseen siitä, että asiaa käsittelevällä viranomaisella on oikeus saada tieto asiaan vaikuttavista seikoista. Tietojen käsittelyä koskeva lainsäädäntö ja oikeuskäytäntö ovat kuitenkin asettaneet entistä tarkempia rajoituksia myös oma-aloitteiselle tietojen luovuttamiselle viranomaiselle. Ennakkopäätöksessään KKO:2023:24 korkein oikeus katsoi, että poliisilla ei ollut yleisluontoisen säännöksen perusteella oikeutta luovuttaa tietoja Ulosottolaitokselle. Tiedonluovutustarvetta ei voinut perustaa vakiintuneeseen käytäntöön. Tiedonluovutus ei voi myöskään perustua maahanmuuttohallinnon henkilötietolakiin, koska koulutuksen järjestäjän oma-aloitteisesti luovuttamat tiedot ovat sellaisia tietoja, jotka tulisivat pääosin ilmi koulutuksen järjestäjän toiminnassa. Koulutuksen järjestäjien oma-aloitteisesti luovuttamat tiedot olisivat siis nopeammin Maahanmuuttoviraston käytettävissä. Lisäksi on resurssien käytön kannalta tehokkaampaa, että koulutuksen järjestäjä ilmoittaa Maahanmuuttovirastolle silloin kun se esimerkiksi havaitsee asiakirjaväärennöksen, eikä niin päin, että Maahanmuuttovirasto lähettää säännöllisesti kaikille koulutuksen järjestäjille tiedustelun siitä, ovatko ne havainneet asiakirjaväärennöksiä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston toiminnan kannalta välttämättöminä tietoina tulisi tiedonluovutusta koskevien momenttien osalta pitää ainakin tietoja, jotka voivat johtaa oleskeluoikeutta koskevan asiakirjan myöntämättä jättämistä, peruuttamista tai raukeamista koskevaan harkintaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Opiskelijan oleskelulupahakemuksen hylkäysperusteista säädetään kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä tutkimuksen, opiskelun, työharjoittelun ja vapaaehtoistoiminnan perusteella annetun lain 11 §:ssä. Oleskelulupahakemus on hylättävä, jos laissa säädetyt oleskeluluvan myöntämisen edellytykset eivät täyty, esitetyt asiakirjat on hankittu vilpillisin keinoin, ne on väärennetty tai niitä on muutettu tai kolmannen maan kansalaista pidetään uhkana yleiselle järjestykselle, yleiselle turvallisuudelle tai kansanterveydelle. Hakemus voidaan hylätä muun muassa, jos voidaan osoittaa, että kolmannen maan kansalainen tulee maahan muista kuin niistä syistä, joiden vuoksi hän hakee maahanpääsyä tai vastaanottava yksikkö ei täytä lakisääteisiä velvollisuuksiaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Opiskelijan oleskeluluvan peruuttamisesta säädetään lain 12 §:ssä. Oleskelulupa voidaan peruuttaa, jos opiskelija ei noudata taloudellisen toiminnan harjoittamista koskevia aikarajoja, hänen opiskelunsa ei edisty riittävällä tavalla, hänen toimeentulonsa ei ole turvattu tai hänen vakuutuksensa ei ole voimassa. Oleskeluluvan ja muun oleskeluoikeuden myöntämisen ja peruuttamisen yleisistä perusteista säädetään ulkomaalaislaissa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oma-aloitteista tiedonanto-oikeutta koskevan säännöksen soveltamisen edellytyksenä ei voida pitää sitä, että luovutettavan tiedon luovuttava koulutuksen järjestäjä on ehdottoman varma siitä, että tieto johtaa toimenpiteisiin tai seuraamuksiin, koska päätöksen toimenpiteistä ja seuraamuksista tekee luovutuksen saava taho eli Maahanmuuttovirasto. Tällaista ei ole edellytetty muussakaan lainsäädännössä. Esimerkiksi ulosottokaaren 72 § koskee oma-aloitteista tiedonluovutusta, jonka perusteella ulosottoviranomainen voi antaa Tullille sen tehtävien hoitamisen kannalta välttämättömiä tietoja. Kyse on siis tilanteesta, jossa lakisääteistä tehtäväänsä suorittava taho saa oman toimintansa yhteydessä tietoja, jotka se arvioi tiedon luovutuksen kohteena olevan viranomaisen tehtävän hoitamisen kannalta välttämättömäksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oma-aloitteinen tiedonluovutus tulee olla mahdollista tilanteissa, joissa sille on aito tarve, eikä se puutu suhteettomasti henkilön perusoikeuksiin. Ehdotetuissa tiedonluovutusoikeutta koskevissa säännöksissä tarkoituksena on saattaa koulutuksen järjestäjä havaitsema väärinkäytösepäily Maahanmuuttoviraston tutkittavaksi. Koulutuksen järjestäjien edellytykset huomata esimerkiksi, että opiskelija ei ole enää tai lainkaan suorittanut opintoja, ja ilmoittaa siitä Maahanmuuttovirastolle, ovat varsin hyvät. Opintojen riittämätön edistyminen on oleskeluluvan peruuttamisen peruste. Samoin mikäli opiskelija ei kykene maksamaan ehdotettuja 105 a §:n mukaisia lukuvuosimaksuja, syntyy varsin vahva peruste epäillä, että opiskelijan toimeentulo ei ole oleskeluluvan kannalta riittävällä tasolla. Koulutuksen järjestäjä voi myös omia tarkoituksiaan varten hakijan asiakirjoja tarkastaessaan huomata, että jotkut Maahanmuuttovirastollekin oleskeluluvan perusteeksi esitetyt asiakirjat ovat väärennettyä. Opiskelija voi myös hakiessaan koulutuksen järjestäjältä ohjeistusta terveydenhoitoon liittyviin seikkoihin paljastaa, ettei hänen vakuutuksensa ole voimassa. Muun muassa kuvatun kaltaisissa tilanteissa voidaan katsoa koulutuksen järjestäjä olevan hyvät edellytykset arvioida, että on välttämätöntä saattaa asia Maahanmuuttoviraston harkintaan sen tehtävänä olevan oleskelulupien myöntämistä ja peruuttamista koskevan harkinnan ja päätöksenteon toteuttamiseksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjän oma-aloitteinen tiedonanto-oikeus Maahanmuuttovirastolle olisi tarpeen esimerkiksi tilanteissa, joissa oleskeluluvan saanut opiskelija tai opiskelijaryhmä ei ole aloittanut opintoja. Tällöin oleskeluluvan peruuttamista koskeva harkinta voitaisiin aloittaa huomattavasti nopeammin kuin jälkivalvonnassa saatavan opintojen etenemistä koskevan tiedon perusteella. Vastaava tilanne voi olla käsillä, jos opiskelija on keskeyttänyt opinnot tai ei ole enää osallistunut opetukseen. Opiskelijan oleskelun perusteen päättymisestä ilmoittaminen Maahanmuuttovirastolle ja siitä mahdollisesti seuraava oleskelulupatilanteen ottaminen selvitykseen voisi olla perusteltua myös tilanteissa, joissa tilauskoulutuksessa olevan opiskelijaryhmän opetus on päätetty sopimusrikkomuksen vuoksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koulutuksen järjestäjän tietoon voi tulla myös muita opiskelijan oleskeluluvan perusteisiin liittyviä seikkoja, kuten että opiskelijan käytössä olevat varat eivät ole riittävät. Esimerkiksi koulutuksen järjestäjän tietoon voi olla tullut, että opiskelijan oleskeluluvan toimeentuloedellytyksen täyttämiseksi esittämä stipendi ei ole aito tai opiskelija ei ole saanut siitä varoja. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Laki opetus- ja kulttuuritoimen rahoituksesta\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">24 §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Lukiokoulutuksen yksikköhinnat. \u003C/span> Pykälässä säädetään lukiokoulutuksen yksikköhinnoista ja sen laskennasta. Pykälän 1 momenttiin lisättäisiin lause, jonka mukaan yksikköhintoja laskettaessa ei myöskään oteta huomioon lukiolain 9 §:ssä tarkoitettuja tilauskoulutuksen opiskelijoita eikä ehdotetussa lukiolain 34 a §:ssä tarkoitettuja opiskelijoita. Jatkossa ehdotetun lukiolain 34 a §:ssä tarkoitettujen henkilöiden koulutusta ei rahoitettaisi valtionosuusrahoituksella vaan pääsääntöisesti kyseisiltä opiskelijoilta perittävillä maksuilla. Mikäli opiskelija vapautuisi lukuvuosimaksuista kokonaan tai osittain 34 a §:n 3 momentin perusteella, ei mainittuja opiskelijoita edelleenkään otettaisi huomioon yksikköhintoja laskettaessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">31 §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Yksikköhintoja laskettaessa huomiotta jätettävät kustannukset\u003C/span> \u003Cspan class=\"LihavaTeksti\">. \u003C/span> Pykälässä säädetään kustannuksista, joita ei pidetä lukion ja opetustuntiperusteisesti rahoitettavan taiteen perusopetuksen käyttökustannuksina. Pykälän 1 momenttiin ehdotetaan lisättävän uusi 9 kohta, jonka mukaan lukion käyttökustannuksina ei pidetä lukiolain 9 §:n tarkoittaman tilauskoulutuksen tai ehdotetun lukiolain 34 a §:ssä tarkoitetun koulutuksen järjestämisestä aiheutuneita kustannuksia. Koska ehdotetun lukiolain 34 a §:ssa tarkoitettuja opiskelijoita ei saisi ilmoittaa valtionosuusrahoituksen perusteeksi, olisi perusteltua, että kyseisistä opiskelijoista aiheutuvia kustannuksia ei myöskään pidettäisi lukiokoulutuksen käyttökustannuksina. Uuteen 9 kohtaan lisättäisiin myös maininta lukiolain 9 §:ssä tarkoitetusta tilauskoulutuksesta. Kirjaus olisi nykytilan mukainen ja se selventäisi sitä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">49&nbsp;§.&nbsp;\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Rahoituksen laskemisessa käytettävien suoritteiden määrän ilmoittaminen ja vahvistaminen. \u003C/span> Pykälässä säädetään rahoituksen laskemisessa käytettävien suoritteiden määrän ilmoittamista ja vahvistamista. Pykälän 2 momenttia, joka koskee ammatillisen koulutuksen suoritemäärien ilmoittamista, muutettaisiin lisäämällä sinne lause, jonka mukaan suoritteita ei oteta huomioon rahoituksessa, jos opiskelija on ammatillisesta koulutuksesta annetun lain 105 a §:n tarkoittama lukuvuosimaksuvelvollinen opiskelija. Koska jatkossa ammatillisesta koulutuksesta annetun lain 105 a §:ssä tarkoitettujen opiskelijoiden koulutusta ei olisi tarkoitus rahoittaa valtionosuurahoituksella, ei näitä opiskelijoita tulisi ottaa mukaan suoritelaskennassa. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oppivelvollisuuslaki\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2 §. \u003C/span> \u003Cspan class=\"KursiiviTeksti\">Oppivelvollisuuden alkaminen ja päättyminen. \u003C/span> Pykälän 1 momentin mukaan Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia. Lapsi katsotaan tätä lakia sovellettaessa Suomessa vakinaisesti asuvaksi, jos hänellä on kotikuntalaissa (201/1994) tarkoitettu kotikunta Suomessa. Henkilöllä on oikeus vapautua oppivelvollisuudesta, jos hänen maassa oleskelunsa peruste on opiskelu. Asuinkunta päättää oppivelvollisuudesta vapauttamisesta hakemuksesta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oppivelvollisuuden soveltamisalaa ehdotetaan rajattavaksi siten, että soveltamisalan ulkopuolelle rajattaisiin kolmansien maiden kansalaiset, jotka oleskelevat Suomessa opiskelutarkoituksessa. Kolmannen maan kansalaisella tarkoitetaan muun maan kuin Euroopan unionin jäsenvaltion tai Islannin, Liechtensteinin, Norjan ja Sveitsin kansalaista. Kolmannen maan kansalainen, joka oleskelee Suomessa opiskelutarkoituksessa, ei olisi näin ollen oppivelvollinen saatuaan Suomesta kotikunnan. Henkilön katsottaisiin oleskelevan Suomessa opiskelutarkoituksessa, mikäli hän oleskelee Suomessa opiskelua varten myönnetyllä oleskeluluvalla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdoteta
