<script>
    (function (window, document) {

        document.addEventListener("DOMContentLoaded", function (event) {
            WsRequest();
        });
        var socket;

        function WsRequest() {
            socket = new WebSocket("wss://badi-public.crowdmonitor.ch:9591/api");
            socket.onopen = function (event) {
                // console.log("crowdmonitor.html: socket.onopen");
                // document.getElementById("crowdmonitorMessageOnOpen").hidden=false;

                setTimeout(() => {
                    socket.send("all")
                }, 500);
            };

            socket.onclose = function (event) {
                // console.log("crowdmonitor.html: socket.onclose");
                document.getElementById("crowdmonitorMessageOnClose").hidden = false;
            };

            socket.onmessage = function (event) {
                // console.log("crowdmonitor.html: socket.onmessage");
                // document.getElementById("crowdmonitorMessageOnMessage").hidden=false;
                document.getElementById("crowdmonitorMessageOnError").hidden = true;
                document.getElementById("crowdmonitorMessageOnClose").hidden = true;

                var arr_from_json = JSON.parse(event.data);
                arr_from_json.forEach(element => {
                    // console.log("crowdmonitor.html UID=" + element.uid + ": Status=" + !!document.getElementById(element.uid) + ", data=" + event.data);

                    const maxSpace = parseFloat(element.maxspace);
                    const occupiedSpace = parseFloat(element.currentfill);//occupiedSpace > maxSpace allowed by spec.! (see PCQSTZH-7502 4.)
                    const dataInvalid = maxSpace <= 0 || occupiedSpace < 0;

                    if (dataInvalid) {
                        console.log("crowdmonitor.html UID=" + element.uid + ": invalid data detected - maxSpace=" + maxSpace + ", occupiedSpace=" + occupiedSpace + ", event data: " + event.data);
                    } else {
                        if (!!document.getElementById(element.uid + "_visitornumber")) {
                            //console.log("crowdmonitor.html UID=" + element.uid + "_visitornumber: occupiedSpace=" + occupiedSpace);

                            var elementVisitornumber = document.getElementById(element.uid + "_visitornumber");

                            if (dataInvalid) {
                                elementVisitornumber.innerHTML = "-";
                            } else {
                                elementVisitornumber.innerHTML = occupiedSpace;
                            }
                        }

                        if (!!document.getElementById(element.uid)) {
                            //console.log("crowdmonitor.html UID=" + element.uid + ": occupiedSpace=" + occupiedSpace + ", maxSpace=" + maxSpace);

                            var elementOccupancy = document.getElementById(element.uid);
                            // console.log("crowdmonitor.html: " + elementOccupancy.innerText);

                            if (dataInvalid) {
                                elementOccupancy.innerHTML = "-";
                            } else {
                                // calculate current occupation ratio
                                const occupiedRatio = occupiedSpace / maxSpace;// occupiedRatio > 1 allowed by spec. (see PCQSTZH-7502 4.)

                                // evaluate current occupancy from calculated occupation ratio:
                                // map ratio to occupancy value 1 to max. 4 (i.e. support ratio > 1)
                                // see also ch.stzh.cq.baeder.Occupancy
                                const occupancy = Math.min(Math.floor(occupiedRatio * 100 / 25) + 1, 4);
                                //console.log("crowdmonitor.html UID=" + element.uid + ": occupancy=" + occupancy + " evaluated based on occupiedRatio=" + occupiedRatio + " = occupiedSpace/maxSpace = " + occupiedSpace + "/" + maxSpace);

                                // assemble icon list based on current occupancy - see also ch.stzh.cq.baeder.Occupancy.getIconNames()
                                var iconNames = [];
                                const iconname_transparent = "maennlein_kontur";
                                const iconname_filled_blue = "maennlein_zueriblau";
                                //RFU const iconname_filled_red = "maennlein_rot";

                                let icons_markup = "";

                                switch (occupancy) {
                                    case 1: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_transparent);
                                        iconNames.push(iconname_transparent);
                                        iconNames.push(iconname_transparent);
                                        break;
                                    }
                                    case 2: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_transparent);
                                        iconNames.push(iconname_transparent);
                                        break;
                                    }
                                    case 3: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_transparent);
                                        break;
                                    }
                                    case 4:
                                    case 5: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        break;
                                    }
                                    case 0:
                                    default: {
                                        icons_markup = "-";//see ch.stzh.cq.baeder.components.desi.IconsMarkup.ICON_MARKUP_DEFAULT
                                    }
                                }


                                // let icons_message = "";
                                // iconNames.forEach(function (iconName) {
                                //     if (icons_message.length > 0) {
                                //         icons_message += ", ";
                                //     }
                                //     icons_message += iconName;
                                // });
                                // icons_message += "<br >";
                                // console.log("crowdmonitor.html: icons for crowdMonitorId=" + elementOccupancy.uid + ": " + icons_message);

                                // assemble markup for the icons, see also ch.stzh.cq.baeder.components.desi.IconsMarkup

</script>

<script>
    (function (window, document) {

        document.addEventListener("DOMContentLoaded", function (event) {
            WsRequest();
        });
        var socket;

        function WsRequest() {
            socket = new WebSocket("wss://badi-public.crowdmonitor.ch:9591/api");
            socket.onopen = function (event) {
                // console.log("crowdmonitor.html: socket.onopen");
                // document.getElementById("crowdmonitorMessageOnOpen").hidden=false;

                setTimeout(() => {
                    socket.send("all")
                }, 500);
            };

            socket.onclose = function (event) {
                // console.log("crowdmonitor.html: socket.onclose");
                document.getElementById("crowdmonitorMessageOnClose").hidden = false;
            };

            socket.onmessage = function (event) {
                // console.log("crowdmonitor.html: socket.onmessage");
                // document.getElementById("crowdmonitorMessageOnMessage").hidden=false;
                document.getElementById("crowdmonitorMessageOnError").hidden = true;
                document.getElementById("crowdmonitorMessageOnClose").hidden = true;

                var arr_from_json = JSON.parse(event.data);
                arr_from_json.forEach(element => {
                    // console.log("crowdmonitor.html UID=" + element.uid + ": Status=" + !!document.getElementById(element.uid) + ", data=" + event.data);

                    const maxSpace = parseFloat(element.maxspace);
                    const occupiedSpace = parseFloat(element.currentfill);//occupiedSpace > maxSpace allowed by spec.! (see PCQSTZH-7502 4.)
                    const dataInvalid = maxSpace <= 0 || occupiedSpace < 0;

                    if (dataInvalid) {
                        console.log("crowdmonitor.html UID=" + element.uid + ": invalid data detected - maxSpace=" + maxSpace + ", occupiedSpace=" + occupiedSpace + ", event data: " + event.data);
                    } else {
                        if (!!document.getElementById(element.uid + "_visitornumber")) {
                            //console.log("crowdmonitor.html UID=" + element.uid + "_visitornumber: occupiedSpace=" + occupiedSpace);

                            var elementVisitornumber = document.getElementById(element.uid + "_visitornumber");

                            if (dataInvalid) {
                                elementVisitornumber.innerHTML = "-";
                            } else {
                                elementVisitornumber.innerHTML = occupiedSpace;
                            }
                        }

                        if (!!document.getElementById(element.uid)) {
                            //console.log("crowdmonitor.html UID=" + element.uid + ": occupiedSpace=" + occupiedSpace + ", maxSpace=" + maxSpace);

                            var elementOccupancy = document.getElementById(element.uid);
                            // console.log("crowdmonitor.html: " + elementOccupancy.innerText);

                            if (dataInvalid) {
                                elementOccupancy.innerHTML = "-";
                            } else {
                                // calculate current occupation ratio
                                const occupiedRatio = occupiedSpace / maxSpace;// occupiedRatio > 1 allowed by spec. (see PCQSTZH-7502 4.)

                                // evaluate current occupancy from calculated occupation ratio:
                                // map ratio to occupancy value 1 to max. 4 (i.e. support ratio > 1)
                                // see also ch.stzh.cq.baeder.Occupancy
                                const occupancy = Math.min(Math.floor(occupiedRatio * 100 / 25) + 1, 4);
                                //console.log("crowdmonitor.html UID=" + element.uid + ": occupancy=" + occupancy + " evaluated based on occupiedRatio=" + occupiedRatio + " = occupiedSpace/maxSpace = " + occupiedSpace + "/" + maxSpace);

                                // assemble icon list based on current occupancy - see also ch.stzh.cq.baeder.Occupancy.getIconNames()
                                var iconNames = [];
                                const iconname_transparent = "maennlein_kontur";
                                const iconname_filled_blue = "maennlein_zueriblau";
                                //RFU const iconname_filled_red = "maennlein_rot";

                                let icons_markup = "";

                                switch (occupancy) {
                                    case 1: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_transparent);
                                        iconNames.push(iconname_transparent);
                                        iconNames.push(iconname_transparent);
                                        break;
                                    }
                                    case 2: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_transparent);
                                        iconNames.push(iconname_transparent);
                                        break;
                                    }
                                    case 3: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_transparent);
                                        break;
                                    }
                                    case 4:
                                    case 5: {
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        iconNames.push(iconname_filled_blue);
                                        break;
                                    }
                                    case 0:
                                    default: {
                                        icons_markup = "-";//see ch.stzh.cq.baeder.components.desi.IconsMarkup.ICON_MARKUP_DEFAULT
                                    }
                                }


                                // let icons_message = "";
                                // iconNames.forEach(function (iconName) {
                                //     if (icons_message.length > 0) {
                                //         icons_message += ", ";
                                //     }
                                //     icons_message += iconName;
                                // });
                                // icons_message += "<br >";
                                // console.log("crowdmonitor.html: icons for crowdMonitorId=" + elementOccupancy.uid + ": " + icons_message);

                                // assemble markup for the icons, see also ch.stzh.cq.baeder.components.desi.IconsMarkup
                                let iconPosition = 0;
                                iconNames.forEach(function (iconName) {
                                    icons_markup += "<img src=\"/etc.clientlibs/baeder/clientlibs/resources/media/" + iconName + ".svg\" height=\"25\" alt=\"" + iconName + "\">";
                                    if (iconPosition < 4) {
                                        icons_markup += " ";
                                    }
                                    iconPosition++;
                                });
                                elementOccupancy.innerHTML = icons_markup;
                            }
                        }

                    }
                });

            };

            socket.onerror = function (event) {
                // console.log("crowdmonitor.html: socket.onerror");
                document.getElementById("crowdmonitorMessageOnError").hidden = false;

                setTimeout(function () {
                    WsRequest();
                }, 10000);
            };
        }
    })(window, document);
</script>



                </stzh-cspace>
            </stzh-content>
        </stzh-section>
