            }

            }else{
                ctx.fillStyle = "#FFFFFF"
            }
        }  
        ctx.fill();
        ctx.closePath();
    }
    $("#population").append(somma.toFixed(0));

function loadZip(nameFile = "", callback = (x) => {}, dir = "data/", ) {
    new JSZip.external.Promise(function (resolve, reject) {
            JSZipUtils.getBinaryContent(nameFile, function (err, data) {
                if (err) {
                    reject(err);
                } else {
                    resolve(data);
                }
            });
        }).then(function (data) {
            return JSZip.loadAsync(data);
        })
        .then((zip) => {
            zip.file("hexes.geojson").async("string").then(function (data3) {
                let resultFile = JSON.parse(data3);
                callback(resultFile)
                return resultFile
            });
        });
};
